<form

<script>

/* =========================================================
   VARIABLES
========================================================= */

let html5QrCode = null;

let lectorActivo = false;

let carnetBloqueado = false;

let escaneosRegistrados = 0;

let esperandoRespuesta = false;

/*
 * Temporizador de seguridad.
 *
 * Evita que el Hub quede eternamente esperando
 * si el navegador no recibe el postMessage.
 */
let temporizadorRespuesta = null;


/* =========================================================
   RECIBIR RESPUESTA DESDE APPS SCRIPT
========================================================= */

window.addEventListener(
  "message",
  function(event) {

    try {

      console.log(
        "MENSAJE RECIBIDO:",
        event.data
      );


      /*
       * Verificamos que sea nuestra respuesta.
       */
      if (
        !event.data ||
        event.data.tipo !== "BUFALOS_ASISTENCIA"
      ) {

        return;

      }


      console.log(
        "================================"
      );

      console.log(
        "RESPUESTA RECIBIDA DESDE APPS SCRIPT"
      );

      console.log(
        event.data
      );

      console.log(
        "================================"
      );


      /*
       * Cancelamos el temporizador.
       */
      cancelarTemporizadorRespuesta();


      esperandoRespuesta = false;


      const resultado =
        event.data.resultado || {};


      mostrarResultadoReal(
        resultado
      );

    }

    catch(error) {

      console.error(
        "ERROR PROCESANDO RESPUESTA:",
        error
      );


      cancelarTemporizadorRespuesta();


      esperandoRespuesta = false;


      mostrarResultado(

        "❌" +

        "<div class='jugador'>" +
        "ERROR PROCESANDO RESPUESTA" +
        "</div>" +

        escaparHTML(
          error.message ||
          "No se pudo interpretar la respuesta."
        ),

        "error"

      );


      document.getElementById(
        "estadoLector"
      ).innerHTML =
        "❌ ERROR — LECTOR DETENIDO";


      mostrarContinuar();

    }

  },
  false
);


/* =========================================================
   TAMBIÉN ESCUCHAMOS DESDE EL IFRAME
========================================================= */

const iframePostHub =
  document.getElementById(
    "iframePostHub"
  );


if (iframePostHub) {

  iframePostHub.addEventListener(
    "load",
    function() {

      console.log(
        "IFRAME DE RESPUESTA CARGADO"
      );

    }
  );

}


/* =========================================================
   MOSTRAR RESULTADO REAL
========================================================= */

function mostrarResultadoReal(
  resultado
) {

  const tipo =
    String(
      document.getElementById("tipo").value || ""
    ).toUpperCase();


  /*
   * ===============================================
   * REGISTRO EXITOSO
   * ===============================================
   */

  if (
    resultado.ok === true &&
    resultado.estado === "REGISTRADO"
  ) {

    escaneosRegistrados++;


    document.getElementById(
      "contador"
    ).innerHTML =
      "Registros enviados: " +
      escaneosRegistrados;


    const jugador =
      resultado.jugador || {};


    const nombre =
      jugador.nombre ||
      resultado.nombre ||
      "Jugador";


    const documento =
      jugador.documento ||
      resultado.documento ||
      "";


    mostrarResultado(

      "✅" +

      "<div class='jugador'>" +

      (
        tipo === "PREASISTENCIA"
          ? "PREASISTENCIA REGISTRADA"
          : "ASISTENCIA REGISTRADA"
      ) +

      "</div>" +

      "<strong>" +

      escaparHTML(nombre) +

      "</strong>" +

      "<br><br>" +

      "<span class='documento'>" +

      "Documento: " +

      escaparHTML(documento) +

      "</span>" +

      "<br><br>" +

      "🎉 Registro realizado correctamente.",

      "exito"

    );


    document.getElementById(
      "estadoLector"
    ).innerHTML =
      "🟢 REGISTRO REALIZADO — LECTOR DETENIDO";


    mostrarContinuar();


    return;

  }


  /*
   * ===============================================
   * DUPLICADO
   * ===============================================
   */

  if (
    resultado.duplicado === true ||
    resultado.estado === "DUPLICADO"
  ) {

    const jugador =
      resultado.jugador || {};


    const nombre =
      jugador.nombre ||
      resultado.nombre ||
      "Jugador";


    const documento =
      jugador.documento ||
      resultado.documento ||
      "";


    mostrarResultado(

      "⚠️" +

      "<div class='jugador'>" +
      "YA REGISTRADO" +
      "</div>" +

      "<strong>" +

      escaparHTML(nombre) +

      "</strong>" +

      "<br><br>" +

      "<span class='documento'>" +

      "Documento: " +

      escaparHTML(documento) +

      "</span>" +

      "<br><br>" +

      escaparHTML(
        resultado.mensaje ||
        "Este jugador ya tiene registrada esta asistencia para esta actividad."
      ),

      "duplicado"

    );


    document.getElementById(
      "estadoLector"
    ).innerHTML =
      "⚠️ YA REGISTRADO — LECTOR DETENIDO";


    mostrarContinuar();


    return;

  }


  /*
   * ===============================================
   * JUGADOR NO ENCONTRADO
   * ===============================================
   */

  if (
    resultado.estado === "NO_ENCONTRADO" ||
    (
      resultado.ok === false &&
      String(resultado.mensaje || "")
        .toLowerCase()
        .includes("jugador no encontrado")
    )
  ) {

    mostrarResultado(

      "❌" +

      "<div class='jugador'>" +
      "JUGADOR NO ENCONTRADO" +
      "</div>" +

      "<br>" +

      (
        resultado.documento

          ? "<span class='documento'>" +
            "Documento: " +
            escaparHTML(
              resultado.documento
            ) +
            "</span><br><br>"

          : ""
      ) +

      "El documento no aparece registrado en BÚFALOS FC.",

      "error"

    );


    document.getElementById(
      "estadoLector"
    ).innerHTML =
      "❌ JUGADOR NO ENCONTRADO — LECTOR DETENIDO";


    mostrarContinuar();


    return;

  }


  /*
   * ===============================================
   * ERROR
   * ===============================================
   */

  mostrarResultado(

    "❌" +

    "<div class='jugador'>" +
    "ERROR" +
    "</div>" +

    "<br>" +

    escaparHTML(
      resultado.mensaje ||
      "No se pudo completar el registro."
    ),

    "error"

  );


  document.getElementById(
    "estadoLector"
  ).innerHTML =
    "❌ ERROR — LECTOR DETENIDO";


  mostrarContinuar();

}


/* =========================================================
   INICIAR LECTOR
========================================================= */

async function iniciarLector() {

  if (carnetBloqueado) {

    console.log(
      "LECTOR BLOQUEADO"
    );

    return;

  }


  if (lectorActivo) {

    return;

  }


  try {

    document.getElementById(
      "estadoLector"
    ).innerHTML =
      "🟡 INICIANDO CÁMARA...";


    /*
     * Si existía un lector anterior,
     * intentamos limpiarlo.
     */

    if (html5QrCode) {

      try {

        await html5QrCode.clear();

      }

      catch(error) {

        console.log(
          "No fue necesario limpiar lector anterior."
        );

      }

    }


    html5QrCode =
      new Html5Qrcode(
        "reader"
      );


    const cameras =
      await Html5Qrcode.getCameras();


    if (
      !cameras ||
      cameras.length === 0
    ) {

      throw new Error(
        "No se encontró ninguna cámara."
      );

    }


    let camaraSeleccionada =
      cameras[0].id;


    /*
     * Preferimos cámara trasera.
     */

    const camaraTrasera =
      cameras.find(
        function(camara) {

          const nombre =
            String(
              camara.label || ""
            ).toLowerCase();


          return (

            nombre.includes("back") ||

            nombre.includes("rear") ||

            nombre.includes("trasera") ||

            nombre.includes("environment")

          );

        }
      );


    if (camaraTrasera) {

      camaraSeleccionada =
        camaraTrasera.id;

    }


    await html5QrCode.start(

      camaraSeleccionada,

      {

        fps: 10,

        qrbox: {

          width: 250,

          height: 250

        },

        aspectRatio: 1.0,

        rememberLastUsedCamera: true

      },

      procesarQR,

      function(errorMessage) {

        /*
         * Errores normales de lectura.
         * No hacemos nada.
         */

      }

    );


    lectorActivo = true;


    document.getElementById(
      "btnIniciar"
    ).disabled = true;


    document.getElementById(
      "btnDetener"
    ).disabled = false;


    document.getElementById(
      "estadoLector"
    ).innerHTML =
      "🟢 LECTOR ACTIVO — ESCANEE UN CARNET";


    mostrarResultado(
      "",
      "oculto"
    );


    ocultarContinuar();


    console.log(
      "LECTOR INICIADO CORRECTAMENTE"
    );

  }

  catch(error) {

    console.error(
      "ERROR INICIANDO LECTOR:",
      error
    );


    lectorActivo = false;


    document.getElementById(
      "btnIniciar"
    ).disabled = false;


    document.getElementById(
      "btnDetener"
    ).disabled = true;


    document.getElementById(
      "estadoLector"
    ).innerHTML =
      "❌ NO SE PUDO INICIAR LA CÁMARA";


    mostrarResultado(

      "❌ " +

      escaparHTML(
        error.message ||
        "Error desconocido."
      ),

      "error"

    );

  }

}


/* =========================================================
   DETENER LECTOR MANUALMENTE
========================================================= */

async function detenerLector() {

  cancelarTemporizadorRespuesta();


  try {

    if (
      html5QrCode &&
      lectorActivo
    ) {

      await html5QrCode.stop();

    }

  }

  catch(error) {

    console.error(
      "ERROR DETENIENDO LECTOR:",
      error
    );

  }


  lectorActivo = false;

  carnetBloqueado = false;

  esperandoRespuesta = false;


  document.getElementById(
    "btnIniciar"
  ).disabled = false;


  document.getElementById(
    "btnDetener"
  ).disabled = true;


  document.getElementById(
    "estadoLector"
  ).innerHTML =
    "🔴 LECTOR DETENIDO";

}


/* =========================================================
   PROCESAR QR
========================================================= */

async function procesarQR(
  decodedText
) {

  /*
   * Protección principal.
   */

  if (carnetBloqueado) {

    console.log(
      "QR IGNORADO: CARNET BLOQUEADO"
    );

    return;

  }


  /*
   * Protección adicional.
   */

  if (esperandoRespuesta) {

    console.log(
      "QR IGNORADO: ESPERANDO RESPUESTA"
    );

    return;

  }


  const documento =
    String(
      decodedText || ""
    ).trim();


  if (!documento) {

    return;

  }


  /*
   * Bloqueamos inmediatamente.
   */

  carnetBloqueado = true;

  esperandoRespuesta = true;


  console.log(
    "================================"
  );

  console.log(
    "QR DETECTADO:",
    documento
  );

  console.log(
    "LECTOR BLOQUEADO"
  );

  console.log(
    "================================"
  );


  mostrarResultado(

    "🔎" +

    "<div class='jugador'>" +
    "QR DETECTADO" +
    "</div>" +

    "<strong>Documento:</strong> " +

    escaparHTML(
      documento
    ) +

    "<br><br>" +

    "⏳ Procesando registro...",

    "diagnostico"

  );


  document.getElementById(
    "estadoLector"
  ).innerHTML =
    "🟡 CARNET DETECTADO — DETENIENDO LECTOR";


  /*
   * Detenemos físicamente la cámara.
   */

  await detenerCamara();


  const tipo =
    document.getElementById(
      "tipo"
    ).value;


  const actividad =
    document.getElementById(
      "actividad"
    ).value.trim() ||
    "Entrenamiento";


  /*
   * Enviamos una sola vez.
   */

  enviarRegistro(
    documento,
    tipo,
    actividad
  );

}


/* =========================================================
   DETENER CÁMARA
========================================================= */

async function detenerCamara() {

  try {

    if (
      html5QrCode &&
      lectorActivo
    ) {

      console.log(
        "DETENIENDO CÁMARA..."
      );


      await html5QrCode.stop();


      console.log(
        "CÁMARA DETENIDA"
      );

    }

  }

  catch(error) {

    console.error(
      "ERROR DETENIENDO CÁMARA:",
      error
    );

  }


  lectorActivo = false;


  document.getElementById(
    "btnIniciar"
  ).disabled = true;


  document.getElementById(
    "btnDetener"
  ).disabled = true;

}


/* =========================================================
   ENVIAR REGISTRO
========================================================= */

function enviarRegistro(
  documento,
  tipo,
  actividad
) {

  try {

    console.log(
      "ENVIANDO AL SISTEMA BÚFALOS FC:",
      documento
    );


    /*
     * Cargamos datos del formulario.
     */

    document.getElementById(
      "postAccion"
    ).value =
      "registrarAsistenciaQR";


    document.getElementById(
      "postDocumento"
    ).value =
      documento;


    document.getElementById(
      "postTipo"
    ).value =
      tipo;


    document.getElementById(
      "postActividad"
    ).value =
      actividad;


    document.getElementById(
      "postRegistradoPor"
    ).value =
      "Hub QR";


    /*
     * Mostramos estado ANTES del envío.
     */

    mostrarResultado(

      "📤" +

      "<div class='jugador'>" +
      "PROCESANDO..." +
      "</div>" +

      "Enviando información al sistema BÚFALOS FC." +

      "<br><br>" +

      "⏳ Esperando confirmación...",

      "diagnostico"

    );


    document.getElementById(
      "estadoLector"
    ).innerHTML =
      "🟡 ESPERANDO CONFIRMACIÓN DEL SISTEMA";


    /*
     * Enviamos mediante formulario oculto.
     */

    document
      .getElementById(
        "formPostHub"
      )
      .submit();


    console.log(
      "FORMULARIO ENVIADO CORRECTAMENTE"
    );


    /*
     * IMPORTANTE:
     *
     * Dejamos un tiempo máximo.
     * Si el postMessage no llega,
     * no dejamos el sistema congelado.
     */

    iniciarTemporizadorRespuesta(
      documento
    );

  }

  catch(error) {

    console.error(
      "ERROR ENVIANDO REGISTRO:",
      error
    );


    cancelarTemporizadorRespuesta();


    esperandoRespuesta = false;


    mostrarResultado(

      "❌" +

      "<div class='jugador'>" +
      "ERROR AL ENVIAR" +
      "</div>" +

      escaparHTML(
        error.message ||
        "Error desconocido."
      ),

      "error"

    );


    document.getElementById(
      "estadoLector"
    ).innerHTML =
      "❌ ERROR — LECTOR DETENIDO";


    mostrarContinuar();

  }

}


/* =========================================================
   TEMPORIZADOR DE SEGURIDAD
========================================================= */

function iniciarTemporizadorRespuesta(
  documento
) {

  cancelarTemporizadorRespuesta();


  /*
   * Esperamos 8 segundos.
   */

  temporizadorRespuesta =
    setTimeout(
      function() {

        /*
         * Si ya recibimos respuesta,
         * no hacemos nada.
         */

        if (!esperandoRespuesta) {

          return;

        }


        console.warn(
          "NO SE RECIBIÓ POSTMESSAGE EN EL TIEMPO ESPERADO."
        );


        esperandoRespuesta = false;


        /*
         * MUY IMPORTANTE:
         *
         * Como ya comprobamos que el registro
         * llega a Google Sheets, no mostramos
         * "ERROR DE REGISTRO".
         *
         * Mostramos una advertencia de confirmación.
         */

        mostrarResultado(

          "⚠️" +

          "<div class='jugador'>" +
          "REGISTRO ENVIADO" +
          "</div>" +

          "<strong>Documento:</strong> " +

          escaparHTML(
            documento
          ) +

          "<br><br>" +

          "El sistema recibió el registro, " +
          "pero el navegador no devolvió la confirmación visual.",

          "diagnostico"

        );


        document.getElementById(
          "estadoLector"
        ).innerHTML =
          "⚠️ REGISTRO ENVIADO — CONFIRMACIÓN NO RECIBIDA";


        mostrarContinuar();

      },
      8000
    );

}


/* =========================================================
   CANCELAR TEMPORIZADOR
========================================================= */

function cancelarTemporizadorRespuesta() {

  if (
    temporizadorRespuesta
  ) {

    clearTimeout(
      temporizadorRespuesta
    );

    temporizadorRespuesta = null;

  }

}


/* =========================================================
   CONTINUAR CON SIGUIENTE CARNET
========================================================= */

async function continuarSiguiente() {

  console.log(
    "================================"
  );

  console.log(
    "CONTINUAR CON SIGUIENTE CARNET"
  );

  console.log(
    "================================"
  );


  cancelarTemporizadorRespuesta();


  ocultarContinuar();


  mostrarResultado(
    "",
    "oculto"
  );


  /*
   * Desbloqueamos.
   */

  carnetBloqueado = false;

  esperandoRespuesta = false;


  /*
   * Limpiamos formulario.
   */

  document.getElementById(
    "postDocumento"
  ).value =
    "";


  document.getElementById(
    "postAccion"
  ).value =
    "";


  document.getElementById(
    "postTipo"
  ).value =
    "";


  document.getElementById(
    "postActividad"
  ).value =
    "";


  document.getElementById(
    "postRegistradoPor"
  ).value =
    "";


  document.getElementById(
    "estadoLector"
  ).innerHTML =
    "🟡 PREPARANDO SIGUIENTE CARNET";


  await esperar(500);


  await iniciarLector();

}


/* =========================================================
   ESPERAR
========================================================= */

function esperar(
  milisegundos
) {

  return new Promise(
    function(resolve) {

      setTimeout(
        resolve,
        milisegundos
      );

    }
  );

}


/* =========================================================
   MOSTRAR RESULTADO
========================================================= */

function mostrarResultado(
  contenido,
  tipo
) {

  const elemento =
    document.getElementById(
      "resultado"
    );


  elemento.className =
    "resultado " +
    tipo;


  elemento.innerHTML =
    contenido;


  if (
    tipo === "oculto"
  ) {

    elemento.classList.add(
      "oculto"
    );

  }

  else {

    elemento.classList.remove(
      "oculto"
    );

  }

}


/* =========================================================
   MOSTRAR CONTINUAR
========================================================= */

function mostrarContinuar() {

  document
    .getElementById(
      "botonContinuar"
    )
    .classList.remove(
      "oculto"
    );

}


/* =========================================================
   OCULTAR CONTINUAR
========================================================= */

function ocultarContinuar() {

  document
    .getElementById(
      "botonContinuar"
    )
    .classList.add(
      "oculto"
    );

}


/* =========================================================
   HTML SEGURO
========================================================= */

function escaparHTML(
  texto
) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    String(
      texto || ""
    );


  return div.innerHTML;

}
