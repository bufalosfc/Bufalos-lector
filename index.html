<!DOCTYPE html>

<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BÚFALOS FC - Lector QR</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .contenedor {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .panel {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.10);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 13px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-bottom: 12px;
    }

    button {
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-iniciar {
      background: #198754;
      color: white;
    }

    .btn-detener {
      background: #dc3545;
      color: white;
    }

    .btn-continuar {
      background: #0d6efd;
      color: white;
      font-size: 18px;
      padding: 16px;
      margin-top: 10px;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 15px auto;
    }

    .estado {
      text-align: center;
      font-weight: bold;
      padding: 12px;
      border-radius: 8px;
      margin-top: 10px;
      background: #eee;
    }

    .resultado {
      text-align: center;
      padding: 20px;
      border-radius: 12px;
      margin-top: 15px;
      font-size: 18px;
      line-height: 1.5;
    }

    .diagnostico {
      background: #fff3cd;
      color: #664d03;
    }

    .exito {
      background: #d1e7dd;
      color: #0f5132;
    }

    .error {
      background: #f8d7da;
      color: #842029;
    }

    .duplicado {
      background: #fff3cd;
      color: #664d03;
    }

    .jugador {
      font-size: 24px;
      font-weight: bold;
      margin: 10px 0;
    }

    .contador {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      margin-top: 10px;
    }

    .oculto {
      display: none !important;
    }

    .bloqueado {
      text-align: center;
      padding: 15px;
      background: #e9ecef;
      border-radius: 10px;
      font-weight: bold;
    }

    iframe {
      display: none;
    }
  </style>

</head>

<body>

<div class="contenedor">

  <h1>⚽ BÚFALOS FC</h1>

  <div class="panel">

```
<label for="tipo">
  Tipo de registro
</label>

<select id="tipo">
  <option value="PREASISTENCIA">PREASISTENCIA</option>
  <option value="ASISTENCIA">ASISTENCIA</option>
</select>

<label for="actividad">
  Actividad
</label>

<input
  type="text"
  id="actividad"
  value="Entrenamiento"
  placeholder="Nombre de la actividad"
>

<button
  class="btn-iniciar"
  id="btnIniciar"
  onclick="iniciarLector()">
  📷 INICIAR LECTOR
</button>

<button
  class="btn-detener"
  id="btnDetener"
  onclick="detenerLector()"
  disabled>
  ⛔ DETENER LECTOR
</button>
```

  </div>

  <div class="panel">

```
<div id="reader"></div>

<div
  id="estadoLector"
  class="estado">
  🔴 LECTOR DETENIDO
</div>

<div
  id="contador"
  class="contador">
  Escaneos registrados: 0
</div>
```

  </div>

  <div
    id="resultado"
    class="resultado oculto">
  </div>

  <div
    id="botonContinuar"
    class="oculto">

```
<button
  class="btn-continuar"
  onclick="continuarSiguiente()">
  🟢 CONTINUAR CON EL SIGUIENTE CARNET
</button>
```

  </div>

</div>

<!--
  FORMULARIO OCULTO

  No usamos fetch().
  Esto evita el problema de CORS que teníamos con Apps Script.
-->

<iframe
  name="iframePostHub"
  id="iframePostHub">
</iframe>

<form
  id="formPostHub"
  method="POST"
  target="iframePostHub"
  action="https://script.google.com/macros/s/AKfycbwMw4Lbn8xo9JqZCpd7wJ_6cwNy-nswbErwbhkPWK2y26_ZwtVYZ9p1n2rrHsf60hs/exec">

<input
 type="hidden"
 name="accion"
 id="postAccion">

<input
 type="hidden"
 name="documento"
 id="postDocumento">

<input
 type="hidden"
 name="tipo"
 id="postTipo">

<input
 type="hidden"
 name="actividad"
 id="postActividad">

<input
 type="hidden"
 name="registradoPor"
 id="postRegistradoPor">

</form>

<script>

  /* =========================================================
     CONFIGURACIÓN
  ========================================================= */

  let html5QrCode = null;

  let lectorActivo = false;

  /*
   * ESTA VARIABLE ES LA CLAVE.
   *
   * Mientras esté en true:
   *
   * - NO acepta otro QR
   * - NO procesa otro QR
   * - NO vuelve a enviar
   *
   * Solo vuelve a false cuando el usuario pulsa
   * "CONTINUAR CON EL SIGUIENTE CARNET".
   */
  let carnetEnProceso = false;

  let escaneosRegistrados = 0;

  let ultimoDocumento = "";

  const TIEMPO_BLOQUEO_QR = 5000;


  /* =========================================================
     INICIALIZAR
  ========================================================= */

  window.addEventListener("load", function() {

    console.log("HUB BÚFALOS FC CARGADO");

    document.getElementById("estadoLector").innerHTML =
      "🔴 LECTOR DETENIDO";

  });


  /* =========================================================
     INICIAR LECTOR
  ========================================================= */

  async function iniciarLector() {

    /*
     * Si ya está procesando un carnet,
     * no hacemos nada.
     */
    if (carnetEnProceso) {
      return;
    }

    if (lectorActivo) {
      return;
    }

    try {

      document.getElementById("estadoLector").innerHTML =
        "🟡 INICIANDO CÁMARA...";

      html5QrCode = new Html5Qrcode("reader");


      const cameras =
        await Html5Qrcode.getCameras();


      if (!cameras || cameras.length === 0) {

        throw new Error(
          "No se encontró ninguna cámara."
        );

      }


      let camaraSeleccionada =
        cameras[0].id;


      /*
       * Intentamos encontrar cámara trasera.
       */
      const camaraTrasera =
        cameras.find(camara => {

          const nombre =
            String(camara.label || "").toLowerCase();

          return (
            nombre.includes("back") ||
            nombre.includes("rear") ||
            nombre.includes("trasera") ||
            nombre.includes("environment")
          );

        });


      if (camaraTrasera) {

        camaraSeleccionada =
          camaraTrasera.id;

      }


      await html5QrCode.start(

        camaraSeleccionada,

        {
          fps: 10,

          qrbox: {
            width: 250,
            height: 250
          },

          aspectRatio: 1.0,

          rememberLastUsedCamera: true
        },

        procesarQR,

        function(errorMessage) {

          /*
           * Los errores normales de lectura se ignoran.
           */

        }

      );


      lectorActivo = true;

      document.getElementById("btnIniciar").disabled =
        true;

      document.getElementById("btnDetener").disabled =
        false;

      document.getElementById("estadoLector").innerHTML =
        "🟢 LECTOR ACTIVO — ESCANEE UN CARNET";


      mostrarResultado(
        "",
        "oculto"
      );


      ocultarContinuar();


    } catch(error) {

      console.error(
        "ERROR INICIANDO CÁMARA:",
        error
      );

      lectorActivo = false;

      document.getElementById("btnIniciar").disabled =
        false;

      document.getElementById("btnDetener").disabled =
        true;

      document.getElementById("estadoLector").innerHTML =
        "❌ NO SE PUDO INICIAR LA CÁMARA";

      mostrarResultado(
        "❌ " + error.message,
        "error"
      );

    }

  }


  /* =========================================================
     DETENER LECTOR
  ========================================================= */

  async function detenerLector() {

    try {

      if (html5QrCode && lectorActivo) {

        await html5QrCode.stop();

      }

    } catch(error) {

      console.error(
        "ERROR DETENIENDO LECTOR:",
        error
      );

    }


    lectorActivo = false;

    carnetEnProceso = false;


    document.getElementById("btnIniciar").disabled =
      false;

    document.getElementById("btnDetener").disabled =
      true;


    document.getElementById("estadoLector").innerHTML =
      "🔴 LECTOR DETENIDO";

  }


  /* =========================================================
     PROCESAR QR
  ========================================================= */

  async function procesarQR(decodedText) {

    /*
     * SI YA HAY UN CARNET EN PROCESO,
     * IGNORAMOS ABSOLUTAMENTE TODO.
     */
    if (carnetEnProceso) {

      console.log(
        "QR IGNORADO: YA HAY UN CARNET EN PROCESO"
      );

      return;

    }


    const documento =
      String(decodedText || "").trim();


    if (!documento) {

      return;

    }


    /*
     * SEGURIDAD EXTRA:
     *
     * Evita que la misma cámara dispare
     * dos veces el mismo QR antes de detenerse.
     */
    const ahora = Date.now();

    if (
      documento === ultimoDocumento &&
      ahora - window.tiempoUltimoDocumento <
      TIEMPO_BLOQUEO_QR
    ) {

      console.log(
        "QR REPETIDO IGNORADO:",
        documento
      );

      return;

    }


    ultimoDocumento = documento;

    window.tiempoUltimoDocumento = ahora;


    /*
     * BLOQUEAMOS INMEDIATAMENTE.
     *
     * ESTA LÍNEA OCURRE ANTES DE ENVIAR NADA.
     */
    carnetEnProceso = true;


    console.log(
      "===================================="
    );

    console.log(
      "QR DETECTADO:",
      documento
    );

    console.log(
      "LECTOR BLOQUEADO"
    );

    console.log(
      "===================================="
    );


    /*
     * MOSTRAMOS QUE YA DETECTÓ.
     */

    mostrarResultado(

      "🔎<div class='jugador'>" +
      "QR DETECTADO" +
      "</div>" +

      "<strong>Documento:</strong> " +
      escaparHTML(documento) +

      "<br><br>" +

      "⏳ Procesando registro..." ,

      "diagnostico"

    );


    document.getElementById("estadoLector").innerHTML =
      "🟡 CARNET EN PROCESO — LECTOR BLOQUEADO";


    /*
     * DETENEMOS LA CÁMARA COMPLETAMENTE.
     *
     * Así físicamente no puede seguir escaneando.
     */

    await detenerCamaraSinLiberar();


    /*
     * ENVIAMOS UNA SOLA VEZ.
     */

    const tipo =
      document.getElementById("tipo").value;

    const actividad =
      document.getElementById("actividad").value.trim()
      || "Entrenamiento";


    enviarRegistro(
      documento,
      tipo,
      actividad
    );

  }


  /* =========================================================
     DETENER CÁMARA PERO MANTENER BLOQUEO
  ========================================================= */

  async function detenerCamaraSinLiberar() {

    try {

      if (html5QrCode && lectorActivo) {

        await html5QrCode.stop();

      }

    } catch(error) {

      console.error(
        "ERROR DETENIENDO CÁMARA:",
        error
      );

    }


    lectorActivo = false;


    document.getElementById("btnIniciar").disabled =
      true;

    document.getElementById("btnDetener").disabled =
      true;

  }


  /* =========================================================
     ENVIAR REGISTRO
  ========================================================= */

  function enviarRegistro(
    documento,
    tipo,
    actividad
  ) {

    try {

      console.log(
        "ENVIANDO REGISTRO:",
        {
          accion: "registrarAsistenciaQR",
          documento: documento,
          tipo: tipo,
          actividad: actividad
        }
      );


      document.getElementById("postAccion").value =
        "registrarAsistenciaQR";

      document.getElementById("postDocumento").value =
        documento;

      document.getElementById("postTipo").value =
        tipo;

      document.getElementById("postActividad").value =
        actividad;

      document.getElementById("postRegistradoPor").value =
        "Hub QR";


      /*
       * UN SOLO SUBMIT.
       */
      document.getElementById("formPostHub").submit();


      /*
       * IMPORTANTE:
       *
       * NO desbloqueamos aquí.
       *
       * El carnet queda bloqueado.
       */

      mostrarResultado(

        "📤<div class='jugador'>" +
        "REGISTRO ENVIADO" +
        "</div>" +

        (tipo === "PREASISTENCIA"
          ? "PREASISTENCIA ENVIADA"
          : "ASISTENCIA ENVIADA") +

        "<br><br>" +

        "Enviado al sistema BÚFALOS FC." +

        "<br><br>" +

        "⚠️ El lector está detenido para evitar " +
        "registros duplicados.",

        "diagnostico"

      );


      mostrarContinuar();


    } catch(error) {

      console.error(
        "ERROR ENVIANDO REGISTRO:",
        error
      );


      mostrarResultado(

        "❌<div class='jugador'>" +
        "ERROR AL ENVIAR" +
        "</div>" +

        escaparHTML(
          error.message ||
          "Error desconocido."
        ),

        "error"

      );


      mostrarContinuar();

    }

  }


  /* =========================================================
     CONTINUAR CON SIGUIENTE CARNET
  ========================================================= */

  async function continuarSiguiente() {

    console.log(
      "CONTINUANDO CON SIGUIENTE CARNET"
    );


    /*
     * PRIMERO OCULTAMOS EL BOTÓN.
     */

    ocultarContinuar();


    /*
     * LIMPIAMOS RESULTADO.
     */

    mostrarResultado(
      "",
      "oculto"
    );


    /*
     * LIBERAMOS EL BLOQUEO.
     */

    carnetEnProceso = false;

    ultimoDocumento = "";


    /*
     * VOLVEMOS A ACTIVAR EL LECTOR.
     */

    document.getElementById("estadoLector").innerHTML =
      "🟡 REINICIANDO LECTOR...";


    await iniciarLector();

  }


  /* =========================================================
     MOSTRAR RESULTADO
  ========================================================= */

  function mostrarResultado(
    contenido,
    tipo
  ) {

    const elemento =
      document.getElementById("resultado");


    elemento.className =
      "resultado " +
      tipo;


    elemento.innerHTML =
      contenido;


    if (tipo === "oculto") {

      elemento.classList.add(
        "oculto"
      );

    } else {

      elemento.classList.remove(
        "oculto"
      );

    }

  }


  /* =========================================================
     MOSTRAR BOTÓN CONTINUAR
  ========================================================= */

  function mostrarContinuar() {

    document
      .getElementById("botonContinuar")
      .classList.remove("oculto");

  }


  /* =========================================================
     OCULTAR BOTÓN CONTINUAR
  ========================================================= */

  function ocultarContinuar() {

    document
      .getElementById("botonContinuar")
      .classList.add("oculto");

  }


  /* =========================================================
     CONTADOR
  ========================================================= */

  function incrementarContador() {

    escaneosRegistrados++;

    document.getElementById("contador").innerHTML =
      "Escaneos enviados: " +
      escaneosRegistrados;

  }


  /* =========================================================
     HTML SEGURO
  ========================================================= */

  function escaparHTML(texto) {

    const div =
      document.createElement("div");

    div.textContent =
      String(texto || "");

    return div.innerHTML;

  }


</script>

</body>
</html>
