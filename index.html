<!DOCTYPE html>
<html>
<head>
  <base target="_top">

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>BÚFALOS FC - Lector QR</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .contenedor {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .panel {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.10);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 13px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-bottom: 12px;
    }

    button {
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-iniciar {
      background: #198754;
      color: white;
    }

    .btn-detener {
      background: #dc3545;
      color: white;
    }

    .btn-continuar {
      background: #0d6efd;
      color: white;
      font-size: 18px;
      padding: 16px;
      margin-top: 10px;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 15px auto;
    }

    .estado {
      text-align: center;
      font-weight: bold;
      padding: 12px;
      border-radius: 8px;
      margin-top: 10px;
      background: #eee;
    }

    .resultado {
      text-align: center;
      padding: 20px;
      border-radius: 12px;
      margin-top: 15px;
      font-size: 18px;
      line-height: 1.5;
    }

    .diagnostico {
      background: #fff3cd;
      color: #664d03;
    }

    .exito {
      background: #d1e7dd;
      color: #0f5132;
    }

    .error {
      background: #f8d7da;
      color: #842029;
    }

    .duplicado {
      background: #fff3cd;
      color: #664d03;
    }

    .jugador {
      font-size: 24px;
      font-weight: bold;
      margin: 10px 0;
    }

    .documento {
      font-size: 17px;
      font-weight: bold;
    }

    .contador {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      margin-top: 10px;
    }

    .oculto {
      display: none !important;
    }

    iframe {
      display: none;
    }

  </style>

</head>

<body>

<div class="contenedor">

  <h1>⚽ BÚFALOS FC</h1>

  <div class="panel">

    <label for="tipo">
      Tipo de registro
    </label>

    <select id="tipo">
      <option value="PREASISTENCIA">
        PREASISTENCIA
      </option>

      <option value="ASISTENCIA">
        ASISTENCIA
      </option>
    </select>

    <label for="actividad">
      Actividad
    </label>

    <input
      type="text"
      id="actividad"
      value="Entrenamiento"
      placeholder="Nombre de la actividad"
    >

    <button
      class="btn-iniciar"
      id="btnIniciar"
      onclick="iniciarLector()"
    >
      📷 INICIAR LECTOR
    </button>

    <button
      class="btn-detener"
      id="btnDetener"
      onclick="detenerLector()"
      disabled
    >
      ⛔ DETENER LECTOR
    </button>

  </div>

  <div class="panel">

    <div id="reader"></div>

    <div
      id="estadoLector"
      class="estado"
    >
      🔴 LECTOR DETENIDO
    </div>

    <div
      id="contador"
      class="contador"
    >
      Registros enviados: 0
    </div>

  </div>

  <div
    id="resultado"
    class="resultado oculto"
  >
  </div>

  <div
    id="botonContinuar"
    class="oculto"
  >

    <button
      class="btn-continuar"
      onclick="continuarSiguiente()"
    >
      🟢 CONTINUAR CON EL SIGUIENTE CARNET
    </button>

  </div>

</div>


<!-- =========================================================
     FORMULARIO OCULTO PARA ENVIAR A APPS SCRIPT
========================================================= -->

<iframe
  name="iframePostHub"
  id="iframePostHub"
>
</iframe>


<form
  id="formPostHub"
  method="POST"
  target="iframePostHub"
  action="https://script.google.com/macros/s/AKfycbwMw4Lbn8xo9JqZCpd7wJ_6cwNy-nswbErwbhkPWK2y26_ZwtVYZ9p1n2rrHsf60hs/exec"
>

  <input
    type="hidden"
    name="accion"
    id="postAccion"
  >

  <input
    type="hidden"
    name="documento"
    id="postDocumento"
  >

  <input
    type="hidden"
    name="tipo"
    id="postTipo"
  >

  <input
    type="hidden"
    name="actividad"
    id="postActividad"
  >

  <input
    type="hidden"
    name="registradoPor"
    id="postRegistradoPor"
  >

</form>


<script>

/* =========================================================
   VARIABLES PRINCIPALES
========================================================= */

let html5QrCode = null;

let lectorActivo = false;

let carnetBloqueado = false;

let escaneosRegistrados = 0;

let esperandoRespuesta = false;


/* =========================================================
   RECIBIR RESPUESTA REAL DESDE APPS SCRIPT
========================================================= */

window.addEventListener(
  "message",
  function(event) {

    try {

      /*
       * Solamente procesamos mensajes
       * enviados por nuestro sistema.
       */
      if (
        !event.data ||
        event.data.tipo !== "BUFALOS_ASISTENCIA"
      ) {
        return;
      }


      console.log(
        "RESPUESTA RECIBIDA DESDE APPS SCRIPT:",
        event.data
      );


      esperandoRespuesta = false;


      const resultado =
        event.data.resultado || {};


      mostrarResultadoReal(resultado);


    } catch(error) {

      console.error(
        "ERROR PROCESANDO RESPUESTA:",
        error
      );


      esperandoRespuesta = false;


      mostrarResultado(

        "❌" +

        "<div class='jugador'>" +
        "ERROR PROCESANDO RESPUESTA" +
        "</div>" +

        escaparHTML(
          error.message ||
          "No se pudo interpretar la respuesta."
        ),

        "error"

      );


      mostrarContinuar();

    }

  }
);


/* =========================================================
   MOSTRAR RESULTADO REAL
========================================================= */

function mostrarResultadoReal(resultado) {

  const tipo =
    String(
      document.getElementById("tipo").value || ""
    ).toUpperCase();


  /*
   * REGISTRO EXITOSO
   */
  if (
    resultado.ok === true &&
    resultado.estado === "REGISTRADO"
  ) {

    escaneosRegistrados++;

    document.getElementById("contador").innerHTML =
      "Registros enviados: " +
      escaneosRegistrados;


    const jugador =
      resultado.jugador || {};


    const nombre =
      jugador.nombre ||
      resultado.nombre ||
      "Jugador";


    const documento =
      jugador.documento ||
      resultado.documento ||
      "";


    mostrarResultado(

      "✅" +

      "<div class='jugador'>" +

      (
        tipo === "PREASISTENCIA"
          ? "PREASISTENCIA REGISTRADA"
          : "ASISTENCIA REGISTRADA"
      ) +

      "</div>" +

      "<strong>" +

      escaparHTML(nombre) +

      "</strong>" +

      "<br><br>" +

      "<span class='documento'>" +

      "Documento: " +

      escaparHTML(documento) +

      "</span>" +

      "<br><br>" +

      "🎉 Registro realizado correctamente.",

      "exito"

    );


    document.getElementById("estadoLector").innerHTML =
      "🟢 REGISTRO REALIZADO — LECTOR DETENIDO";


    mostrarContinuar();

    return;

  }


  /*
   * DUPLICADO
   */
  if (
    resultado.duplicado === true ||
    resultado.estado === "DUPLICADO"
  ) {

    const jugador =
      resultado.jugador || {};


    const nombre =
      jugador.nombre ||
      resultado.nombre ||
      "Jugador";


    const documento =
      jugador.documento ||
      resultado.documento ||
      "";


    mostrarResultado(

      "⚠️" +

      "<div class='jugador'>" +
      "YA REGISTRADO" +
      "</div>" +

      "<strong>" +

      escaparHTML(nombre) +

      "</strong>" +

      "<br><br>" +

      "<span class='documento'>" +

      "Documento: " +

      escaparHTML(documento) +

      "</span>" +

      "<br><br>" +

      escaparHTML(
        resultado.mensaje ||
        "Este jugador ya tiene registrada esta asistencia para esta actividad."
      ),

      "duplicado"

    );


    document.getElementById("estadoLector").innerHTML =
      "⚠️ YA REGISTRADO — LECTOR DETENIDO";


    mostrarContinuar();

    return;

  }


  /*
   * JUGADOR NO ENCONTRADO
   */
  if (
    resultado.estado === "NO_ENCONTRADO" ||
    (
      resultado.ok === false &&
      String(resultado.mensaje || "")
        .toLowerCase()
        .includes("jugador no encontrado")
    )
  ) {

    mostrarResultado(

      "❌" +

      "<div class='jugador'>" +
      "JUGADOR NO ENCONTRADO" +
      "</div>" +

      "<br>" +

      (
        resultado.documento
          ? "<span class='documento'>Documento: " +
            escaparHTML(resultado.documento) +
            "</span><br><br>"
          : ""
      ) +

      "El documento no aparece registrado en BÚFALOS FC.",

      "error"

    );


    document.getElementById("estadoLector").innerHTML =
      "❌ JUGADOR NO ENCONTRADO — LECTOR DETENIDO";


    mostrarContinuar();

    return;

  }


  /*
   * ERROR
   */
  mostrarResultado(

    "❌" +

    "<div class='jugador'>" +
    "ERROR" +
    "</div>" +

    "<br>" +

    escaparHTML(
      resultado.mensaje ||
      "No se pudo completar el registro."
    ),

    "error"

  );


  document.getElementById("estadoLector").innerHTML =
    "❌ ERROR — LECTOR DETENIDO";


  mostrarContinuar();

}


/* =========================================================
   INICIAR LECTOR
========================================================= */

async function iniciarLector() {

  if (carnetBloqueado) {

    console.log(
      "LECTOR BLOQUEADO"
    );

    return;

  }


  if (lectorActivo) {
    return;
  }


  try {

    document.getElementById("estadoLector").innerHTML =
      "🟡 INICIANDO CÁMARA...";


    html5QrCode =
      new Html5Qrcode("reader");


    const cameras =
      await Html5Qrcode.getCameras();


    if (
      !cameras ||
      cameras.length === 0
    ) {

      throw new Error(
        "No se encontró ninguna cámara."
      );

    }


    let camaraSeleccionada =
      cameras[0].id;


    const camaraTrasera =
      cameras.find(
        function(camara) {

          const nombre =
            String(
              camara.label || ""
            ).toLowerCase();


          return (
            nombre.includes("back") ||
            nombre.includes("rear") ||
            nombre.includes("trasera") ||
            nombre.includes("environment")
          );

        }
      );


    if (camaraTrasera) {

      camaraSeleccionada =
        camaraTrasera.id;

    }


    await html5QrCode.start(

      camaraSeleccionada,

      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        },

        aspectRatio: 1.0,

        rememberLastUsedCamera: true
      },

      procesarQR,

      function(errorMessage) {

        /*
         * Errores normales de lectura.
         * No hacemos nada.
         */

      }

    );


    lectorActivo = true;


    document.getElementById("btnIniciar").disabled =
      true;


    document.getElementById("btnDetener").disabled =
      false;


    document.getElementById("estadoLector").innerHTML =
      "🟢 LECTOR ACTIVO — ESCANEE UN CARNET";


    mostrarResultado(
      "",
      "oculto"
    );


    ocultarContinuar();


    console.log(
      "LECTOR INICIADO CORRECTAMENTE"
    );


  } catch(error) {

    console.error(
      "ERROR INICIANDO LECTOR:",
      error
    );


    lectorActivo = false;


    document.getElementById("btnIniciar").disabled =
      false;


    document.getElementById("btnDetener").disabled =
      true;


    document.getElementById("estadoLector").innerHTML =
      "❌ NO SE PUDO INICIAR LA CÁMARA";


    mostrarResultado(

      "❌ " +

      escaparHTML(
        error.message ||
        "Error desconocido."
      ),

      "error"

    );

  }

}


/* =========================================================
   DETENER LECTOR MANUALMENTE
========================================================= */

async function detenerLector() {

  try {

    if (
      html5QrCode &&
      lectorActivo
    ) {

      await html5QrCode.stop();

    }

  } catch(error) {

    console.error(
      "ERROR DETENIENDO LECTOR:",
      error
    );

  }


  lectorActivo = false;

  carnetBloqueado = false;

  esperandoRespuesta = false;


  document.getElementById("btnIniciar").disabled =
    false;


  document.getElementById("btnDetener").disabled =
    true;


  document.getElementById("estadoLector").innerHTML =
    "🔴 LECTOR DETENIDO";

}


/* =========================================================
   PROCESAR QR
========================================================= */

async function procesarQR(decodedText) {

  /*
   * PROTECCIÓN PRINCIPAL
   */
  if (carnetBloqueado) {

    console.log(
      "QR IGNORADO: CARNET BLOQUEADO"
    );

    return;

  }


  /*
   * PROTECCIÓN ADICIONAL
   */
  if (esperandoRespuesta) {

    console.log(
      "QR IGNORADO: ESPERANDO RESPUESTA"
    );

    return;

  }


  const documento =
    String(decodedText || "").trim();


  if (!documento) {
    return;
  }


  /*
   * BLOQUEAMOS INMEDIATAMENTE.
   */
  carnetBloqueado = true;

  esperandoRespuesta = true;


  console.log(
    "================================"
  );

  console.log(
    "QR DETECTADO:",
    documento
  );

  console.log(
    "LECTOR BLOQUEADO"
  );

  console.log(
    "================================"
  );


  mostrarResultado(

    "🔎" +

    "<div class='jugador'>" +
    "QR DETECTADO" +
    "</div>" +

    "<strong>Documento:</strong> " +

    escaparHTML(documento) +

    "<br><br>" +

    "⏳ Procesando registro...",

    "diagnostico"

  );


  document.getElementById("estadoLector").innerHTML =
    "🟡 CARNET DETECTADO — DETENIENDO LECTOR";


  /*
   * DETENEMOS FÍSICAMENTE LA CÁMARA.
   */
  await detenerCamara();


  const tipo =
    document.getElementById("tipo").value;


  const actividad =
    document.getElementById("actividad").value.trim()
    || "Entrenamiento";


  /*
   * ENVIAMOS UNA SOLA VEZ.
   */
  enviarRegistro(
    documento,
    tipo,
    actividad
  );

}


/* =========================================================
   DETENER CÁMARA
========================================================= */

async function detenerCamara() {

  try {

    if (
      html5QrCode &&
      lectorActivo
    ) {

      console.log(
        "DETENIENDO CÁMARA..."
      );


      await html5QrCode.stop();


      console.log(
        "CÁMARA DETENIDA"
      );

    }

  } catch(error) {

    console.error(
      "ERROR DETENIENDO CÁMARA:",
      error
    );

  }


  lectorActivo = false;


  document.getElementById("btnIniciar").disabled =
    true;


  document.getElementById("btnDetener").disabled =
    true;

}


/* =========================================================
   ENVIAR REGISTRO
========================================================= */

function enviarRegistro(
  documento,
  tipo,
  actividad
) {

  try {

    console.log(
      "ENVIANDO AL SISTEMA BÚFALOS FC:",
      documento
    );


    document.getElementById("postAccion").value =
      "registrarAsistenciaQR";


    document.getElementById("postDocumento").value =
      documento;


    document.getElementById("postTipo").value =
      tipo;


    document.getElementById("postActividad").value =
      actividad;


    document.getElementById("postRegistradoPor").value =
      "Hub QR";


    /*
     * UN ÚNICO ENVÍO.
     */
    document
      .getElementById("formPostHub")
      .submit();


    /*
     * AHORA NO DECIMOS "REGISTRO ENVIADO"
     * COMO SI YA ESTUVIERA REGISTRADO.
     *
     * Esperamos la respuesta verdadera.
     */
    mostrarResultado(

      "📤" +

      "<div class='jugador'>" +
      "PROCESANDO..." +
      "</div>" +

      "Enviando información al sistema BÚFALOS FC." +

      "<br><br>" +

      "⏳ Esperando confirmación...",

      "diagnostico"

    );


    document.getElementById("estadoLector").innerHTML =
      "🟡 ESPERANDO CONFIRMACIÓN DEL SISTEMA";


    /*
     * IMPORTANTE:
     * Todavía NO mostramos CONTINUAR.
     *
     * Esperamos a que Code.gs responda.
     */


    console.log(
      "ENVÍO REALIZADO. ESPERANDO RESPUESTA."
    );


  } catch(error) {

    console.error(
      "ERROR ENVIANDO REGISTRO:",
      error
    );


    esperandoRespuesta = false;


    mostrarResultado(

      "❌" +

      "<div class='jugador'>" +
      "ERROR AL ENVIAR" +
      "</div>" +

      escaparHTML(
        error.message ||
        "Error desconocido."
      ),

      "error"

    );


    mostrarContinuar();

  }

}


/* =========================================================
   CONTINUAR CON SIGUIENTE CARNET
========================================================= */

async function continuarSiguiente() {

  console.log(
    "================================"
  );

  console.log(
    "CONTINUAR CON SIGUIENTE CARNET"
  );

  console.log(
    "================================"
  );


  ocultarContinuar();


  mostrarResultado(
    "",
    "oculto"
  );


  /*
   * DESBLOQUEAMOS.
   */
  carnetBloqueado = false;

  esperandoRespuesta = false;


  /*
   * Limpiamos formulario.
   */
  document.getElementById("postDocumento").value =
    "";

  document.getElementById("postAccion").value =
    "";


  document.getElementById("postTipo").value =
    "";


  document.getElementById("postActividad").value =
    "";


  document.getElementById("postRegistradoPor").value =
    "";


  document.getElementById("estadoLector").innerHTML =
    "🟡 PREPARANDO SIGUIENTE CARNET";


  await esperar(500);


  await iniciarLector();

}


/* =========================================================
   ESPERAR
========================================================= */

function esperar(milisegundos) {

  return new Promise(
    function(resolve) {

      setTimeout(
        resolve,
        milisegundos
      );

    }
  );

}


/* =========================================================
   MOSTRAR RESULTADO
========================================================= */

function mostrarResultado(
  contenido,
  tipo
) {

  const elemento =
    document.getElementById("resultado");


  elemento.className =
    "resultado " +
    tipo;


  elemento.innerHTML =
    contenido;


  if (tipo === "oculto") {

    elemento.classList.add(
      "oculto"
    );

  } else {

    elemento.classList.remove(
      "oculto"
    );

  }

}


/* =========================================================
   MOSTRAR BOTÓN CONTINUAR
========================================================= */

function mostrarContinuar() {

  document
    .getElementById("botonContinuar")
    .classList.remove(
      "oculto"
    );

}


/* =========================================================
   OCULTAR BOTÓN CONTINUAR
========================================================= */

function ocultarContinuar() {

  document
    .getElementById("botonContinuar")
    .classList.add(
      "oculto"
    );

}


/* =========================================================
   HTML SEGURO
========================================================= */

function escaparHTML(texto) {

  const div =
    document.createElement("div");


  div.textContent =
    String(texto || "");


  return div.innerHTML;

}

</script>

</body>
</html>
