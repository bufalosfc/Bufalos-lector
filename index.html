<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>BÚFALOS FC - Lector QR</title>

<script src="https://unpkg.com/html5-qrcode"
        type="text/javascript"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111;
  color: white;
}

.encabezado {
  background: #000;
  padding: 20px;
  text-align: center;
  font-size: 25px;
  font-weight: bold;
}

.contenedor {
  max-width: 600px;
  margin: auto;
  padding: 15px;
}

.tarjeta {
  background: #222;
  border-radius: 16px;
  padding: 20px;
}

button {
  width: 100%;
  padding: 16px;
  border: 0;
  border-radius: 10px;
  font-size: 18px;
  font-weight: bold;
  margin-top: 10px;
}

.verde {
  background: #16803c;
  color: white;
}

.rojo {
  background: #c62828;
  color: white;
}

.oculto {
  display: none !important;
}

#reader {
  width: 100%;
  margin-top: 20px;
  overflow: hidden;
  border-radius: 12px;
}

#resultado {
  margin-top: 20px;
  padding: 18px;
  border-radius: 12px;
  text-align: center;
  font-size: 18px;
  font-weight: bold;
}

.info {
  background: #1565c0;
}

.ok {
  background: #16803c;
}

.error {
  background: #b71c1c;
}

.jugador {
  font-size: 23px;
  margin-bottom: 8px;
}

.historial {
  margin-top: 20px;
}

.registro {
  background: #333;
  padding: 13px;
  margin-top: 8px;
  border-radius: 10px;
}

</style>

</head>


<body>


<div class="encabezado">

🐃 BÚFALOS FC

<br>

📷 LECTOR DE ASISTENCIA

</div>


<div class="contenedor">

<div class="tarjeta">


<button
  id="btnIniciar"
  class="verde"
  onclick="iniciarLector()">

▶️ INICIAR LECTOR

</button>


<button
  id="btnDetener"
  class="rojo oculto"
  onclick="detenerLector()">

⏹️ DETENER LECTOR

</button>


<div id="reader"></div>


<div id="resultado"
     class="info">

Pulsa INICIAR LECTOR para comenzar.

</div>


<div class="historial">

<h3>📋 Últimas asistencias</h3>

<div id="listaHistorial"></div>

</div>


</div>

</div>


<script>


/* =====================================================
   GOOGLE APPS SCRIPT DE BÚFALOS FC
===================================================== */

const URL_APPS_SCRIPT =
'https://script.google.com/macros/s/AKfycbwMw4Lbn8xo9JqZCpd7wJ_6cwNy-nswbErwbhkPWK2y26_ZwtVYZ9p1n2rrHsf60hs/exec';


let lector = null;

let lectorActivo = false;

let procesando = false;

let ultimoCodigo = '';

let ultimoTiempo = 0;


/* =====================================================
   INICIAR LECTOR
===================================================== */

function iniciarLector() {

  if (lectorActivo) {
    return;
  }


  mostrar(
    '📷 Solicitando acceso a la cámara...',
    'info'
  );


  lector =
    new Html5Qrcode('reader');


  /*
    IMPORTANTE:

    Ahora NO utilizamos getCameras().

    Le pedimos directamente al navegador
    la cámara trasera.
  */


  lector.start(

    {
      facingMode: {
        exact: "environment"
      }
    },

    {

      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      },

      aspectRatio: 1.0

    },

    function(codigo) {

      codigoEncontrado(codigo);

    },

    function(error) {

      /*
        Errores normales mientras busca
        un código QR.

        No hacemos nada aquí.
      */

    }

  )

  .then(function() {

    lectorActivo = true;


    document
      .getElementById('btnIniciar')
      .classList.add('oculto');


    document
      .getElementById('btnDetener')
      .classList.remove('oculto');


    mostrar(
      '📷 Lector activo.<br><br>' +
      'Presenta el QR del carnet.',
      'info'
    );

  })


  .catch(function(error) {

    console.error(
      'ERROR DE CÁMARA:',
      error
    );


    /*
      Si exact: environment falla,
      hacemos un segundo intento
      con environment normal.
    */

    iniciarCamaraAlternativa();

  });

}


/* =====================================================
   SEGUNDO INTENTO DE CÁMARA
===================================================== */

function iniciarCamaraAlternativa() {

  if (!lector) {
    lector =
      new Html5Qrcode('reader');
  }


  mostrar(
    '📷 Intentando abrir la cámara trasera...',
    'info'
  );


  lector.start(

    {
      facingMode: "environment"
    },

    {

      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      },

      aspectRatio: 1.0

    },

    function(codigo) {

      codigoEncontrado(codigo);

    },

    function(error) {

      /*
        No mostramos errores normales.
      */

    }

  )

  .then(function() {

    lectorActivo = true;


    document
      .getElementById('btnIniciar')
      .classList.add('oculto');


    document
      .getElementById('btnDetener')
      .classList.remove('oculto');


    mostrar(
      '📷 Lector activo.<br><br>' +
      'Presenta el QR del carnet.',
      'info'
    );

  })


  .catch(function(error) {

    console.error(
      'ERROR FINAL DE CÁMARA:',
      error
    );


    let mensaje =
      '❌ No se pudo abrir la cámara.';


    if (
      error &&
      error.name
    ) {

      mensaje +=
        '<br><br>' +
        'Código: ' +
        error.name;

    }


    mostrar(
      mensaje,
      'error'
    );


    lector = null;

  });

}


/* =====================================================
   QR DETECTADO
===================================================== */

function codigoEncontrado(codigo) {

  codigo =
    String(codigo || '').trim();


  if (!codigo) {
    return;
  }


  const ahora =
    Date.now();


  /*
    Evita leer el mismo QR
    varias veces seguidas.
  */

  if (
    codigo === ultimoCodigo &&
    ahora - ultimoTiempo < 5000
  ) {

    return;

  }


  ultimoCodigo =
    codigo;

  ultimoTiempo =
    ahora;


  if (procesando) {
    return;
  }


  procesando = true;


  mostrar(
    '🔎 QR detectado.<br>' +
    'Consultando jugador...',
    'info'
  );


  consultarJugador(codigo);

}


/* =====================================================
   OBTENER ID DEL QR
===================================================== */

function consultarJugador(codigo) {

  let jugadorID =
    codigo;


  /*
    Si el QR contiene el enlace completo
    del carnet, extraemos solamente
    el ID del jugador.
  */

  try {

    if (
      codigo.includes('?jugador=')
    ) {

      const url =
        new URL(codigo);


      jugadorID =
        url.searchParams.get(
          'jugador'
        ) || codigo;

    }

  }

  catch(error) {

    console.log(
      'QR recibido como texto.'
    );

  }


  jugadorID =
    String(jugadorID)
      .trim();


  registrarAsistencia(
    jugadorID
  );

}


/* =====================================================
   REGISTRAR ASISTENCIA
===================================================== */

function registrarAsistencia(
  jugadorID
) {

  const url =
    URL_APPS_SCRIPT +
    '?accion=qr&codigo=' +
    encodeURIComponent(
      jugadorID
    );


  fetch(url)

    .then(function(respuesta) {

      if (!respuesta.ok) {

        throw new Error(
          'Error de comunicación.'
        );

      }


      return respuesta.json();

    })


    .then(function(datos) {


      console.log(
        'Respuesta BÚFALOS:',
        datos
      );


      /*
        JUGADOR ENCONTRADO
      */

      if (
        datos.ok &&
        datos.encontrado
      ) {


        /*
          DUPLICADO
        */

        if (
          datos.duplicate
        ) {

          mostrar(

            '⚠️<br>' +

            '<div class="jugador">' +

            (
              datos.nombre ||
              ''
            ) +

            '</div>' +

            'Ya tenía asistencia registrada hoy.',

            'info'

          );

        }


        /*
          NUEVA ASISTENCIA
        */

        else {

          mostrar(

            '✅<br>' +

            '<div class="jugador">' +

            (
              datos.nombre ||
              ''
            ) +

            '</div>' +

            (
              datos.categoria ||
              ''
            ) +

            '<br><br>' +

            'Asistencia registrada<br>' +

            '🕐 ' +

            (
              datos.hora ||
              ''
            ),

            'ok'

          );


          agregarHistorial(
            datos
          );


          sonidoCorrecto();

        }

      }


      /*
        NO ENCONTRADO
      */

      else {

        mostrar(

          '❌<br>' +

          (
            datos.mensaje ||
            'Jugador no encontrado.'
          ),

          'error'

        );


        sonidoError();

      }


      /*
        Preparar siguiente QR.
      */

      setTimeout(function() {

        procesando = false;


        mostrar(

          '📷 Listo.<br>' +
          'Presenta el siguiente carnet.',

          'info'

        );

      }, 1800);

    })


    .catch(function(error) {

      console.error(
        error
      );


      mostrar(

        '❌ Error de comunicación con BÚFALOS FC.',

        'error'

      );


      procesando = false;

    });

}


/* =====================================================
   HISTORIAL
===================================================== */

function agregarHistorial(
  datos
) {

  const lista =
    document.getElementById(
      'listaHistorial'
    );


  const registro =
    document.createElement(
      'div'
    );


  registro.className =
    'registro';


  registro.innerHTML =

    '✅ <strong>' +

    (
      datos.nombre ||
      ''
    ) +

    '</strong><br>' +

    (
      datos.categoria ||
      ''
    ) +

    '<br>🕐 ' +

    (
      datos.hora ||
      ''
    );


  lista.prepend(
    registro
  );


  /*
    Mantener máximo 10.
  */

  while (
    lista.children.length > 10
  ) {

    lista.removeChild(
      lista.lastChild
    );

  }

}


/* =====================================================
   DETENER LECTOR
===================================================== */

function detenerLector() {

  if (!lector) {
    return;
  }


  lector.stop()

    .then(function() {

      lector.clear();


      lector = null;

      lectorActivo = false;

      procesando = false;


      document
        .getElementById('btnDetener')
        .classList.add('oculto');


      document
        .getElementById('btnIniciar')
        .classList.remove('oculto');


      mostrar(
        'Lector detenido.',
        'info'
      );

    })


    .catch(function(error) {

      console.error(
        error
      );

    });

}


/* =====================================================
   MENSAJES
===================================================== */

function mostrar(
  texto,
  tipo
) {

  const elemento =
    document.getElementById(
      'resultado'
    );


  elemento.className =
    tipo;


  elemento.innerHTML =
    texto;

}


/* =====================================================
   SONIDO CORRECTO
===================================================== */

function sonidoCorrecto() {

  try {

    const contexto =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();


    const oscilador =
      contexto.createOscillator();


    const ganancia =
      contexto.createGain();


    oscilador.connect(
      ganancia
    );


    ganancia.connect(
      contexto.destination
    );


    oscilador.frequency.value =
      900;


    ganancia.gain.value =
      0.15;


    oscilador.start();


    oscilador.stop(
      contexto.currentTime +
      0.15
    );

  }

  catch(e) {}

}


/* =====================================================
   SONIDO ERROR
===================================================== */

function sonidoError() {

  try {

    const contexto =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();


    const oscilador =
      contexto.createOscillator();


    const ganancia =
      contexto.createGain();


    oscilador.connect(
      ganancia
    );


    ganancia.connect(
      contexto.destination
    );


    oscilador.frequency.value =
      250;


    ganancia.gain.value =
      0.20;


    oscilador.start();


    oscilador.stop(
      contexto.currentTime +
      0.25
    );

  }

  catch(e) {}

}

</script>

</body>

</html>
