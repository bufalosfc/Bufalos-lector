<!DOCTYPE html>

<html>
<head>
  <base target="_top">

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>BÚFALOS FC - Lector QR</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .contenedor {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .panel {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.10);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 13px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-bottom: 12px;
    }

    button {
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-iniciar {
      background: #198754;
      color: white;
    }

    .btn-detener {
      background: #dc3545;
      color: white;
    }

    .btn-continuar {
      background: #0d6efd;
      color: white;
      font-size: 18px;
      padding: 16px;
      margin-top: 10px;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 15px auto;
    }

    .estado {
      text-align: center;
      font-weight: bold;
      padding: 12px;
      border-radius: 8px;
      margin-top: 10px;
      background: #eee;
    }

    .resultado {
      text-align: center;
      padding: 20px;
      border-radius: 12px;
      margin-top: 15px;
      font-size: 18px;
      line-height: 1.5;
    }

    .diagnostico {
      background: #fff3cd;
      color: #664d03;
    }

    .exito {
      background: #d1e7dd;
      color: #0f5132;
    }

    .error {
      background: #f8d7da;
      color: #842029;
    }

    .duplicado {
      background: #fff3cd;
      color: #664d03;
    }

    .jugador {
      font-size: 24px;
      font-weight: bold;
      margin: 10px 0;
    }

    .contador {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      margin-top: 10px;
    }

    .oculto {
      display: none !important;
    }

    .bloqueado {
      text-align: center;
      padding: 15px;
      background: #e9ecef;
      border-radius: 10px;
      font-weight: bold;
    }

  </style>

</head>

<body>

<div class="contenedor">

  <h1>⚽ BÚFALOS FC</h1>

  <div class="panel">

    <label for="tipo">
      Tipo de registro
    </label>

    <select id="tipo">

      <option value="PREASISTENCIA">
        PREASISTENCIA
      </option>

      <option value="ASISTENCIA">
        ASISTENCIA
      </option>

    </select>


    <label for="actividad">
      Actividad
    </label>

    <input
      type="text"
      id="actividad"
      value="Entrenamiento"
      placeholder="Nombre de la actividad"
    >


    <button
      class="btn-iniciar"
      id="btnIniciar"
      onclick="iniciarLector()">

      📷 INICIAR LECTOR

    </button>


    <button
      class="btn-detener"
      id="btnDetener"
      onclick="detenerLector()"
      disabled>

      ⛔ DETENER LECTOR

    </button>

  </div>


  <div class="panel">

    <div id="reader"></div>

    <div
      id="estadoLector"
      class="estado">

      🔴 LECTOR DETENIDO

    </div>


    <div
      id="contador"
      class="contador">

      Registros confirmados: 0

    </div>

  </div>


  <div
    id="resultado"
    class="resultado oculto">
  </div>


  <div
    id="botonContinuar"
    class="oculto">

    <button
      class="btn-continuar"
      onclick="continuarSiguiente()">

      🟢 CONTINUAR CON EL SIGUIENTE CARNET

    </button>

  </div>

</div>


<script>

/* =========================================================
   CONFIGURACIÓN
========================================================= */

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbwMw4Lbn8xo9JqZCpd7wJ_6cwNy-nswbErwbhkPWK2y26_ZwtVYZ9p1n2rrHsf60hs/exec";


/* =========================================================
   VARIABLES PRINCIPALES
========================================================= */

let html5QrCode = null;

let lectorActivo = false;

let carnetBloqueado = false;

let escaneosRegistrados = 0;

let contadorJSONP = 0;


/* =========================================================
   INICIAR LECTOR
========================================================= */

async function iniciarLector() {

  if (carnetBloqueado) {

    console.log("LECTOR BLOQUEADO");

    return;

  }


  if (lectorActivo) {

    return;

  }


  try {

    document.getElementById("estadoLector").innerHTML =
      "🟡 INICIANDO CÁMARA...";


    html5QrCode =
      new Html5Qrcode("reader");


    const cameras =
      await Html5Qrcode.getCameras();


    if (!cameras || cameras.length === 0) {

      throw new Error(
        "No se encontró ninguna cámara."
      );

    }


    let camaraSeleccionada =
      cameras[0].id;


    const camaraTrasera =
      cameras.find(function(camara) {

        const nombre =
          String(camara.label || "").toLowerCase();

        return (
          nombre.includes("back") ||
          nombre.includes("rear") ||
          nombre.includes("trasera") ||
          nombre.includes("environment")
        );

      });


    if (camaraTrasera) {

      camaraSeleccionada =
        camaraTrasera.id;

    }


    await html5QrCode.start(

      camaraSeleccionada,

      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        },

        aspectRatio: 1.0,

        rememberLastUsedCamera: true
      },

      procesarQR,

      function(errorMessage) {

        /*
         * Errores normales de lectura.
         * No hacemos nada.
         */

      }

    );


    lectorActivo = true;


    document.getElementById("btnIniciar").disabled =
      true;

    document.getElementById("btnDetener").disabled =
      false;


    document.getElementById("estadoLector").innerHTML =
      "🟢 LECTOR ACTIVO — ESCANEE UN CARNET";


    mostrarResultado(
      "",
      "oculto"
    );


    ocultarContinuar();


    console.log(
      "LECTOR INICIADO CORRECTAMENTE"
    );

  } catch(error) {

    console.error(
      "ERROR INICIANDO LECTOR:",
      error
    );


    lectorActivo = false;


    document.getElementById("btnIniciar").disabled =
      false;

    document.getElementById("btnDetener").disabled =
      true;


    document.getElementById("estadoLector").innerHTML =
      "❌ NO SE PUDO INICIAR LA CÁMARA";


    mostrarResultado(

      "❌ " +
      escaparHTML(
        error.message ||
        "Error desconocido."
      ),

      "error"

    );

  }

}


/* =========================================================
   DETENER LECTOR MANUALMENTE
========================================================= */

async function detenerLector() {

  try {

    if (html5QrCode && lectorActivo) {

      await html5QrCode.stop();

    }

  } catch(error) {

    console.error(
      "ERROR DETENIENDO LECTOR:",
      error
    );

  }


  lectorActivo = false;

  carnetBloqueado = false;


  document.getElementById("btnIniciar").disabled =
    false;

  document.getElementById("btnDetener").disabled =
    true;


  document.getElementById("estadoLector").innerHTML =
    "🔴 LECTOR DETENIDO";

}


/* =========================================================
   PROCESAR QR
========================================================= */

async function procesarQR(decodedText) {

  if (carnetBloqueado) {

    console.log(
      "QR IGNORADO: CARNET BLOQUEADO"
    );

    return;

  }


  const documento =
    String(decodedText || "").trim();


  if (!documento) {

    return;

  }


  /*
   * BLOQUEAMOS INMEDIATAMENTE.
   */
  carnetBloqueado = true;


  console.log(
    "================================"
  );

  console.log(
    "QR DETECTADO:",
    documento
  );

  console.log(
    "LECTOR BLOQUEADO"
  );

  console.log(
    "================================"
  );


  mostrarResultado(

    "🔎" +

    "<div class='jugador'>" +
    "QR DETECTADO" +
    "</div>" +

    "<strong>Documento:</strong> " +
    escaparHTML(documento) +

    "<br><br>" +

    "⏳ Procesando registro...",

    "diagnostico"

  );


  document.getElementById("estadoLector").innerHTML =
    "🟡 CARNET DETECTADO — DETENIENDO LECTOR";


  await detenerCamara();


  const tipo =
    document.getElementById("tipo").value;


  const actividad =
    document.getElementById("actividad").value.trim()
    || "Entrenamiento";


  /*
   * AHORA ESPERAMOS LA RESPUESTA REAL.
   */
  enviarRegistro(
    documento,
    tipo,
    actividad
  );

}


/* =========================================================
   DETENER CÁMARA
========================================================= */

async function detenerCamara() {

  try {

    if (html5QrCode && lectorActivo) {

      console.log(
        "DETENIENDO CÁMARA..."
      );


      await html5QrCode.stop();


      console.log(
        "CÁMARA DETENIDA"
      );

    }

  } catch(error) {

    console.error(
      "ERROR DETENIENDO CÁMARA:",
      error
    );

  }


  lectorActivo = false;


  document.getElementById("btnIniciar").disabled =
    true;

  document.getElementById("btnDetener").disabled =
    true;

}


/* =========================================================
   ENVIAR REGISTRO Y RECIBIR RESPUESTA
========================================================= */

function enviarRegistro(
  documento,
  tipo,
  actividad
) {

  console.log(
    "ENVIANDO AL SISTEMA BÚFALOS FC:",
    documento
  );


  mostrarResultado(

    "📤" +

    "<div class='jugador'>" +
    "PROCESANDO REGISTRO" +
    "</div>" +

    "Esperando confirmación del sistema...",

    "diagnostico"

  );


  contadorJSONP++;


  const callback =
    "bufalosRespuesta_" +
    Date.now() +
    "_" +
    contadorJSONP;


  let terminado = false;


  /*
   * Creamos la función callback global.
   */
  window[callback] = function(respuesta) {

    if (terminado) {

      return;

    }


    terminado = true;


    console.log(
      "RESPUESTA RECIBIDA:",
      respuesta
    );


    try {

      if (!respuesta) {

        mostrarErrorRespuesta();

        return;

      }


      procesarRespuestaServidor(
        respuesta,
        documento,
        tipo
      );

    } finally {

      limpiarJSONP(
        callback,
        script
      );

    }

  };


  /*
   * Creamos el script JSONP.
   */
  const script =
    document.createElement("script");


  script.src =
    APPS_SCRIPT_URL +

    "?accion=registrarAsistenciaQR" +

    "&documento=" +
    encodeURIComponent(documento) +

    "&tipo=" +
    encodeURIComponent(tipo) +

    "&actividad=" +
    encodeURIComponent(actividad) +

    "&registradoPor=" +
    encodeURIComponent("Hub QR") +

    "&callback=" +
    encodeURIComponent(callback) +

    "&_=" +
    Date.now();


  /*
   * Error de conexión.
   */
  script.onerror = function() {

    if (terminado) {

      return;

    }


    terminado = true;


    console.error(
      "ERROR RECIBIENDO RESPUESTA DEL SERVIDOR"
    );


    mostrarResultado(

      "❌" +

      "<div class='jugador'>" +
      "NO SE RECIBIÓ CONFIRMACIÓN" +
      "</div>" +

      "El registro pudo haberse enviado," +

      "<br>" +

      "pero el navegador no recibió la respuesta del sistema.",

      "error"

    );


    mostrarContinuar();


    limpiarJSONP(
      callback,
      script
    );

  };


  /*
   * Seguridad: timeout.
   */
  const temporizador =
    setTimeout(function() {

      if (terminado) {

        return;

      }


      terminado = true;


      console.error(
        "TIEMPO DE ESPERA AGOTADO"
      );


      mostrarResultado(

        "⚠️" +

        "<div class='jugador'>" +
        "SIN CONFIRMACIÓN" +
        "</div>" +

        "El sistema tardó demasiado en responder." +

        "<br><br>" +

        "No se realizará otro escaneo hasta continuar.",

        "error"

      );


      mostrarContinuar();


      limpiarJSONP(
        callback,
        script
      );

    }, 15000);


  /*
   * Guardamos el timeout en el script.
   */
  script._bufalosTimeout =
    temporizador;


  document.body.appendChild(script);

}


/* =========================================================
   PROCESAR RESPUESTA DEL SERVIDOR
========================================================= */

function procesarRespuestaServidor(
  respuesta,
  documento,
  tipo
) {

  const estado =
    String(
      respuesta.estado || ""
    ).toUpperCase();


  /*
   * REGISTRO NUEVO
   */
  if (
    respuesta.ok === true &&
    estado === "REGISTRADO"
  ) {

    escaneosRegistrados++;

    document.getElementById("contador").innerHTML =
      "Registros confirmados: " +
      escaneosRegistrados;


    const jugador =
      respuesta.jugador || {};


    const nombre =
      jugador.nombre ||
      respuesta.nombre ||
      "";


    mostrarResultado(

      "🟢" +

      "<div class='jugador'>" +

      (
        tipo === "PREASISTENCIA"
          ? "PREASISTENCIA REGISTRADA"
          : "ASISTENCIA REGISTRADA"
      ) +

      "</div>" +

      (
        nombre
          ? "<strong>" +
            escaparHTML(nombre) +
            "</strong><br><br>"
          : ""
      ) +

      "<strong>Documento:</strong> " +
      escaparHTML(documento) +

      "<br><br>" +

      "El sistema BÚFALOS FC confirmó el registro." +

      "<br><br>" +

      "<strong>El lector está detenido.</strong>" +

      "<br>" +

      "No se realizará otro escaneo hasta continuar.",

      "exito"

    );


    mostrarContinuar();


    return;

  }


  /*
   * DUPLICADO
   */
  if (
    respuesta.duplicado === true ||
    estado === "DUPLICADO"
  ) {

    const nombre =
      respuesta.nombre ||
      (
        respuesta.jugador &&
        respuesta.jugador.nombre
      ) ||
      "";


    mostrarResultado(

      "🟡" +

      "<div class='jugador'>" +
      "YA REGISTRADO" +
      "</div>" +

      (
        nombre
          ? "<strong>" +
            escaparHTML(nombre) +
            "</strong><br><br>"
          : ""
      ) +

      escaparHTML(
        respuesta.mensaje ||
        "Este jugador ya tiene registrado este evento."
      ) +

      "<br><br>" +

      "<strong>El lector está detenido.</strong>" +

      "<br>" +

      "No se realizará otro escaneo hasta continuar.",

      "duplicado"

    );


    mostrarContinuar();


    return;

  }


  /*
   * JUGADOR NO ENCONTRADO
   */
  if (
    estado === "NO_ENCONTRADO"
  ) {

    mostrarResultado(

      "🔴" +

      "<div class='jugador'>" +
      "JUGADOR NO ENCONTRADO" +
      "</div>" +

      "<strong>Documento:</strong> " +
      escaparHTML(documento) +

      "<br><br>" +

      escaparHTML(
        respuesta.mensaje ||
        "No existe un jugador con este documento."
      ) +

      "<br><br>" +

      "<strong>El lector está detenido.</strong>" +

      "<br>" +

      "No se realizará otro escaneo hasta continuar.",

      "error"

    );


    mostrarContinuar();


    return;

  }


  /*
   * CUALQUIER OTRO ERROR
   */
  mostrarResultado(

    "❌" +

    "<div class='jugador'>" +
    "ERROR EN EL REGISTRO" +
    "</div>" +

    escaparHTML(
      respuesta.mensaje ||
      "El sistema devolvió una respuesta inesperada."
    ) +

    "<br><br>" +

    "<strong>El lector está detenido.</strong>" +

    "<br>" +

    "No se realizará otro escaneo hasta continuar.",

    "error"

  );


  mostrarContinuar();

}


/* =========================================================
   ERROR DE RESPUESTA
========================================================= */

function mostrarErrorRespuesta() {

  mostrarResultado(

    "❌" +

    "<div class='jugador'>" +
    "NO SE RECIBIÓ CONFIRMACIÓN" +
    "</div>" +

    "El servidor no devolvió una respuesta válida." +

    "<br><br>" +

    "<strong>El lector está detenido.</strong>" +

    "<br>" +

    "No se realizará otro escaneo hasta continuar.",

    "error"

  );


  mostrarContinuar();

}


/* =========================================================
   LIMPIAR JSONP
========================================================= */

function limpiarJSONP(
  callback,
  script
) {

  try {

    if (
      script &&
      script._bufalosTimeout
    ) {

      clearTimeout(
        script._bufalosTimeout
      );

    }

  } catch(error) {}


  try {

    if (
      script &&
      script.parentNode
    ) {

      script.parentNode.removeChild(
        script
      );

    }

  } catch(error) {}


  try {

    delete window[callback];

  } catch(error) {

    window[callback] =
      undefined;

  }

}


/* =========================================================
   CONTINUAR CON SIGUIENTE CARNET
========================================================= */

async function continuarSiguiente() {

  console.log(
    "================================"
  );

  console.log(
    "CONTINUAR CON SIGUIENTE CARNET"
  );

  console.log(
    "================================"
  );


  ocultarContinuar();


  mostrarResultado(
    "",
    "oculto"
  );


  carnetBloqueado = false;


  document.getElementById("estadoLector").innerHTML =
    "🟡 PREPARANDO SIGUIENTE CARNET...";


  await esperar(500);


  await iniciarLector();

}


/* =========================================================
   ESPERAR
========================================================= */

function esperar(milisegundos) {

  return new Promise(function(resolve) {

    setTimeout(
      resolve,
      milisegundos
    );

  });

}


/* =========================================================
   MOSTRAR RESULTADO
========================================================= */

function mostrarResultado(
  contenido,
  tipo
) {

  const elemento =
    document.getElementById("resultado");


  elemento.className =
    "resultado " +
    tipo;


  elemento.innerHTML =
    contenido;


  if (tipo === "oculto") {

    elemento.classList.add(
      "oculto"
    );

  } else {

    elemento.classList.remove(
      "oculto"
    );

  }

}


/* =========================================================
   MOSTRAR CONTINUAR
========================================================= */

function mostrarContinuar() {

  document
    .getElementById("botonContinuar")
    .classList.remove(
      "oculto"
    );

}


/* =========================================================
   OCULTAR CONTINUAR
========================================================= */

function ocultarContinuar() {

  document
    .getElementById("botonContinuar")
    .classList.add(
      "oculto"
    );

}


/* =========================================================
   HTML SEGURO
========================================================= */

function escaparHTML(texto) {

  const div =
    document.createElement("div");


  div.textContent =
    String(texto || "");


  return div.innerHTML;

}

</script>

</body>
</html>
