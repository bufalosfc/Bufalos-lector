<!DOCTYPE html>
<html><head><base target="_top"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>BÚFALOS FC - HUB QR</title>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<style>
*{box-sizing:border-box}body{margin:0;padding:20px;font-family:Arial,sans-serif;background:#f4f6f8;color:#222}.contenedor{max-width:700px;margin:auto}h1{text-align:center;margin-bottom:20px}.panel{background:#fff;border-radius:14px;padding:20px;margin-bottom:15px;box-shadow:0 3px 12px rgba(0,0,0,.10)}button{width:100%;padding:13px;font-size:16px;border-radius:8px;border:none;margin-bottom:12px;cursor:pointer;font-weight:bold}button:disabled{opacity:.5;cursor:not-allowed}.btn-iniciar{background:#198754;color:#fff}.btn-detener{background:#dc3545;color:#fff}.btn-cambiar{background:#0d6efd;color:#fff}#reader{width:100%;max-width:500px;margin:15px auto}.estado{text-align:center;font-weight:bold;padding:12px;border-radius:8px;margin-top:10px;background:#eee}.actividad{background:#e7f1ff;border:2px solid #0d6efd;border-radius:12px;padding:15px;margin-bottom:15px}.actividad-titulo{text-align:center;font-size:20px;font-weight:bold;margin-bottom:12px}.dato{padding:6px 0;font-size:16px}.dato strong{display:inline-block;min-width:90px}.resultado{text-align:center;padding:20px;border-radius:12px;margin-top:15px;font-size:18px;line-height:1.5}.diagnostico{background:#fff3cd;color:#664d03}.exito{background:#d1e7dd;color:#0f5132}.error{background:#f8d7da;color:#842029}.duplicado{background:#fff3cd;color:#664d03}.jugador{font-size:24px;font-weight:bold;margin:10px 0}.contador{text-align:center;font-size:18px;font-weight:bold;margin-top:10px}.oculto{display:none!important}.selector-actividad{margin-top:15px}.opcion-actividad{width:100%;text-align:left;background:#f8f9fa;border:2px solid #dee2e6;color:#222;padding:14px;border-radius:10px;margin-bottom:10px}.opcion-actividad:hover{border-color:#0d6efd;background:#e7f1ff}.opcion-actividad strong{display:block;font-size:18px;margin-bottom:6px}.opcion-actividad span{display:block;font-size:14px;line-height:1.45;font-weight:normal}.nota-selector{text-align:center;margin:0 0 15px}.cargando{text-align:center;padding:15px}
</style></head><body><div class="contenedor"><h1>⚽ BÚFALOS FC</h1>
<div id="modoJugadorPanel" class="panel oculto">
<div id="jugadorIdentidad" class="actividad"><div class="actividad-titulo">⚽ MODO USUARIO</div><div class="dato"><strong>Documento:</strong> <span id="jugadorDocumento">-</span></div><p style="margin:12px 0 0;text-align:center;">Primero debes escanear el <strong>QR</strong>. Después podrás seleccionar la actividad y registrar solamente tu propia asistencia.</p></div>
<button class="btn-iniciar" id="btnEscanearQRParque" onclick="iniciarEscanerQRParque()">📷 ESCANEAR QR</button>
<button class="btn-detener oculto" id="btnDetenerJugador" onclick="detenerLectorJugador()">⛔ CANCELAR ESCANEO</button>
</div>
<div class="panel"><div id="actividadSeleccionada" class="actividad oculto"><div class="actividad-titulo">📋 ACTIVIDAD SELECCIONADA</div><div class="dato"><strong>Fecha:</strong> <span id="actividadFecha">-</span></div><div class="dato"><strong>Hora:</strong> <span id="actividadHora">-</span></div><div class="dato"><strong>Actividad:</strong> <span id="actividadNombre">-</span></div><div class="dato"><strong>Tipo:</strong> <span id="actividadTipo">-</span></div><div class="dato"><strong>Estado:</strong> <span id="actividadEstado">-</span></div></div>
<button class="btn-iniciar" id="btnIniciar" onclick="iniciarLector()">📷 INICIAR LECTOR</button><button class="btn-detener" id="btnDetener" onclick="detenerLector()" disabled>⛔ DETENER LECTOR</button><button class="btn-cambiar oculto" id="btnCambiar" onclick="cambiarActividad()">🔄 CAMBIAR ACTIVIDAD</button>
<button class="btn-iniciar oculto" id="btnConfirmarJugador" onclick="registrarMiAsistencia()">✅ CONFIRMAR MI ASISTENCIA</button></div>
<div class="panel"><div id="reader"></div><div id="estadoLector" class="estado">🔴 LECTOR DETENIDO</div><div id="contador" class="contador">Registros confirmados: 0</div></div><div id="resultado" class="resultado oculto"></div></div>
<script>
const APPS_SCRIPT_URL="https://script.google.com/macros/s/AKfycbx18G_rLYrqsriwsx-hSGYqsTUlfdfBCqVQ6vNTIzDvXLWUVS1V7Ojl54wMe8Vm51Zb/exec";
const TIEMPO_ENTRE_ESCANEOS=2000;
let html5QrCode=null,lectorActivo=false,carnetBloqueado=false,escaneosRegistrados=0,contadorJSONP=0,actividadSeleccionada=null,procesandoActividad=false,consultandoQRGeneral=false;
const parametrosURL=new URLSearchParams(window.location.search);
const jugadorModo=String(parametrosURL.get("jugador")||"").trim();
const modoJugador=!!jugadorModo;
let accesoParqueToken="";
let qrParqueValidado=false;

function inicializarModoJugador(){
  if(!modoJugador)return;
  document.getElementById("modoJugadorPanel").classList.remove("oculto");
  document.getElementById("jugadorDocumento").textContent=jugadorModo;
  document.getElementById("btnIniciar").classList.add("oculto");
  document.getElementById("btnDetener").classList.add("oculto");
  document.getElementById("btnCambiar").classList.add("oculto");
  document.getElementById("btnConfirmarJugador").classList.add("oculto");
  document.getElementById("estadoLector").innerHTML="🔐 ESPERANDO QR";
  mostrarResultado("🔐<div class='jugador'>MODO USUARIO</div>Escanea ahora el QR GENERAL físico del parque.","diagnostico");
}

window.addEventListener("DOMContentLoaded",inicializarModoJugador);

async function iniciarEscanerQRParque(){
  if(!modoJugador||qrParqueValidado)return;
  if(lectorActivo)return;
  try{
    document.getElementById("estadoLector").innerHTML="🟡 INICIANDO CÁMARA...";
    document.getElementById("btnEscanearQRParque").disabled=true;
    document.getElementById("btnDetenerJugador").classList.remove("oculto");
    html5QrCode=new Html5Qrcode("reader");
    const cameras=await Html5Qrcode.getCameras();
    if(!cameras||!cameras.length)throw new Error("No se encontró ninguna cámara.");
    let camaraSeleccionada=cameras[0].id;
    const trasera=cameras.find(c=>{const n=String(c.label||"").toLowerCase();return n.includes("back")||n.includes("rear")||n.includes("trasera")||n.includes("environment")});
    if(trasera)camaraSeleccionada=trasera.id;
    await html5QrCode.start(camaraSeleccionada,{fps:10,qrbox:{width:250,height:250},aspectRatio:1,rememberLastUsedCamera:true},procesarQRParque,function(){});
    lectorActivo=true;carnetBloqueado=false;
    document.getElementById("estadoLector").innerHTML="🟢 ESCANEE EL QR GENERAL DEL PARQUE";
  }catch(error){
    console.error(error);lectorActivo=false;
    document.getElementById("btnEscanearQRParque").disabled=false;
    document.getElementById("btnDetenerJugador").classList.add("oculto");
    document.getElementById("estadoLector").innerHTML="❌ NO SE PUDO INICIAR LA CÁMARA";
    mostrarResultado("❌ "+escaparHTML(error&&error.message?error.message:"Error desconocido."),"error");
  }
}

async function detenerLectorJugador(){
  try{if(html5QrCode&&lectorActivo)await html5QrCode.stop()}catch(e){console.error(e)}
  lectorActivo=false;carnetBloqueado=false;
  document.getElementById("btnEscanearQRParque").disabled=false;
  document.getElementById("btnDetenerJugador").classList.add("oculto");
  document.getElementById("estadoLector").innerHTML="🔐 ESPERANDO QR";
}

function procesarQRParque(decodedText){
  if(!modoJugador||carnetBloqueado||qrParqueValidado||!lectorActivo)return;
  const texto=String(decodedText||"").trim();if(!texto)return;
  if(!esQRGeneralPermanente(texto)){
    carnetBloqueado=true;
    mostrarResultado("⚠️<div class='jugador'>QR INCORRECTO</div>Debes escanear el QR GENERAL de BÚFALOS FC que está instalado en el parque.","diagnostico");
    setTimeout(()=>{carnetBloqueado=false;mostrarResultado("","oculto")},2000);
    return;
  }
  carnetBloqueado=true;
  mostrarResultado("🔐<div class='jugador'>QR DEL PARQUE VALIDADO</div>⏳ Preparando tu acceso...","diagnostico");
  document.getElementById("estadoLector").innerHTML="🟡 VALIDANDO ACCESO...";
  solicitarAccesoParque();
}

function solicitarAccesoParque(){
  contadorJSONP++;const callback="bufalosAccesoParque_"+Date.now()+"_"+contadorJSONP;let terminado=false,script=null;const limpiar=()=>limpiarJSONP(callback,script);
  window[callback]=r=>{if(terminado)return;terminado=true;try{if(r&&r.ok&&r.token){accesoParqueToken=r.token;qrParqueValidado=true;detenerLectorJugador();mostrarResultado("🟢<div class='jugador'>ACCESO VALIDADO</div>Ahora selecciona la actividad en la que estás presente.","exito");document.getElementById("btnConfirmarJugador").classList.add("oculto");consultarActividadesQRGeneralJugador();}else{mostrarResultado("❌<div class='jugador'>NO SE PUDO VALIDAR EL ACCESO</div>"+escaparHTML(r&&r.mensaje||"Inténtalo nuevamente."),"error");carnetBloqueado=false}}finally{limpiar()}};
  script=document.createElement("script");script.src=APPS_SCRIPT_URL+"?accion=iniciarAccesoQRGeneral&documento="+encodeURIComponent(jugadorModo)+"&callback="+encodeURIComponent(callback)+"&_="+Date.now();script.onerror=()=>{if(terminado)return;terminado=true;mostrarResultado("❌<div class='jugador'>ERROR DE CONEXIÓN</div>No se pudo validar el acceso.","error");carnetBloqueado=false;limpiar()};document.body.appendChild(script);
}

function consultarActividadesQRGeneralJugador(){
  contadorJSONP++;const callback="bufalosActividadesJugador_"+Date.now()+"_"+contadorJSONP;let terminado=false,script=null;const limpiar=()=>limpiarJSONP(callback,script);
  window[callback]=r=>{if(terminado)return;terminado=true;try{if(!r||r.ok!==true){mostrarResultado("❌<div class='jugador'>NO SE PUDIERON CARGAR LAS ACTIVIDADES</div>"+escaparHTML(r&&r.mensaje||"Error."),"error");return}const lista=Array.isArray(r.actividades)?r.actividades:[];if(!lista.length){mostrarResultado("⚠️<div class='jugador'>NO HAY ACTIVIDADES DISPONIBLES</div>No hay actividades programadas pendientes para registrar.","diagnostico");return}mostrarSelectorActividadesJugador(lista)}finally{limpiar()}};
  script=document.createElement("script");script.src=APPS_SCRIPT_URL+"?accion=actividadesQRGeneral&callback="+encodeURIComponent(callback)+"&_="+Date.now();script.onerror=()=>{if(terminado)return;terminado=true;mostrarResultado("❌<div class='jugador'>ERROR DE CONEXIÓN</div>No se pudieron cargar las actividades.","error");limpiar()};document.body.appendChild(script);
}

function mostrarSelectorActividadesJugador(lista){
  let html="<div class='jugador'>SELECCIONA TU ACTIVIDAD</div><p class='nota-selector'>Solo puedes registrar tu propia asistencia.</p><div class='selector-actividad'>";
  lista.forEach(a=>{html+="<button class='opcion-actividad' onclick=\"seleccionarActividadJugador('"+escapeJS(a.actividadId)+"')\"><strong>"+escaparHTML(a.actividad||"Actividad")+"</strong><span>📅 "+escaparHTML(a.fecha||"")+" · 🕐 "+escaparHTML(a.hora||"")+"<br>🏷️ "+escaparHTML(a.tipo||"")+"</span></button>"});
  html+="</div>";mostrarResultado(html,"diagnostico");window._bufalosActividadesJugador=lista;
}

function seleccionarActividadJugador(id){
  const lista=window._bufalosActividadesJugador||[];const a=lista.find(x=>String(x.actividadId)===String(id));if(!a)return;
  actividadSeleccionada={actividadId:a.actividadId||"",fecha:a.fecha||"",hora:a.hora||"",actividad:a.actividad||"",tipo:a.tipo||"",estado:a.estado||""};
  mostrarActividadSeleccionada();document.getElementById("btnConfirmarJugador").classList.remove("oculto");document.getElementById("btnCambiar").classList.add("oculto");
  mostrarResultado("🟢<div class='jugador'>ACTIVIDAD SELECCIONADA</div><strong>"+escaparHTML(actividadSeleccionada.actividad)+"</strong><br><br>Confirma solamente si estás físicamente en el parque.","exito");
}

function registrarMiAsistencia(){
  if(!modoJugador||!qrParqueValidado||!accesoParqueToken||!actividadSeleccionada)return;
  carnetBloqueado=true;document.getElementById("btnConfirmarJugador").disabled=true;
  mostrarResultado("🔐<div class='jugador'>CONFIRMANDO ASISTENCIA...</div>"+escaparHTML(actividadSeleccionada.actividad),"diagnostico");
  contadorJSONP++;const callback="bufalosAsistenciaJugador_"+Date.now()+"_"+contadorJSONP;let terminado=false,script=null;const limpiar=()=>limpiarJSONP(callback,script);
  window[callback]=r=>{if(terminado)return;terminado=true;try{const estado=String(r&&r.estado||"").toUpperCase();if(r&&r.ok&&estado==="REGISTRADO"){mostrarResultado("🟢<div class='jugador'>ASISTENCIA CONFIRMADA</div><strong>"+escaparHTML(r.jugador&&r.jugador.nombre||"")+"</strong><br><br>"+escaparHTML(actividadSeleccionada.actividad),"exito");document.getElementById("btnConfirmarJugador").classList.add("oculto");}else if(estado==="DUPLICADO"){mostrarResultado("🟡<div class='jugador'>YA ESTÁS REGISTRADO</div>"+escaparHTML(r.mensaje||"Ya tienes asistencia en esta actividad."),"duplicado");}else{mostrarResultado("❌<div class='jugador'>NO SE PUDO REGISTRAR</div>"+escaparHTML(r&&r.mensaje||"Error."),"error");document.getElementById("btnConfirmarJugador").disabled=false} }finally{limpiar()}};
  script=document.createElement("script");script.src=APPS_SCRIPT_URL+"?accion=registrarAsistenciaJugador&documento="+encodeURIComponent(jugadorModo)+"&id="+encodeURIComponent(actividadSeleccionada.actividadId)+"&token="+encodeURIComponent(accesoParqueToken)+"&callback="+encodeURIComponent(callback)+"&_="+Date.now();script.onerror=()=>{if(terminado)return;terminado=true;mostrarResultado("❌<div class='jugador'>NO SE RECIBIÓ CONFIRMACIÓN</div>Revisa la hoja Asistencia antes de intentarlo nuevamente.","error");document.getElementById("btnConfirmarJugador").disabled=false;limpiar()};document.body.appendChild(script);
}

async function iniciarLector(){if(modoJugador)return;if(lectorActivo)return;try{document.getElementById("estadoLector").innerHTML="🟡 INICIANDO CÁMARA...";html5QrCode=new Html5Qrcode("reader");const cameras=await Html5Qrcode.getCameras();if(!cameras||!cameras.length)throw new Error("No se encontró ninguna cámara.");let camaraSeleccionada=cameras[0].id;const trasera=cameras.find(c=>{const n=String(c.label||"").toLowerCase();return n.includes("back")||n.includes("rear")||n.includes("trasera")||n.includes("environment")});if(trasera)camaraSeleccionada=trasera.id;await html5QrCode.start(camaraSeleccionada,{fps:10,qrbox:{width:250,height:250},aspectRatio:1,rememberLastUsedCamera:true},procesarQR,function(){});lectorActivo=true;carnetBloqueado=false;document.getElementById("btnIniciar").disabled=true;document.getElementById("btnDetener").disabled=false;document.getElementById("estadoLector").innerHTML=actividadSeleccionada?"🟢 LECTOR ACTIVO — ESCANEE CARNET":"🟢 LECTOR ACTIVO — ESCANEE QR GENERAL";if(actividadSeleccionada)document.getElementById("btnCambiar").classList.remove("oculto");mostrarResultado("","oculto");}catch(error){console.error(error);lectorActivo=false;carnetBloqueado=false;document.getElementById("btnIniciar").disabled=false;document.getElementById("btnDetener").disabled=true;document.getElementById("estadoLector").innerHTML="❌ NO SE PUDO INICIAR LA CÁMARA";mostrarResultado("❌ "+escaparHTML(error&&error.message?error.message:"Error desconocido."),"error")}}
async function detenerLector(){try{if(html5QrCode&&lectorActivo)await html5QrCode.stop()}catch(e){console.error(e)}lectorActivo=false;carnetBloqueado=false;procesandoActividad=false;consultandoQRGeneral=false;document.getElementById("btnIniciar").disabled=false;document.getElementById("btnDetener").disabled=true;document.getElementById("btnCambiar").classList.add("oculto");document.getElementById("actividadSeleccionada").classList.add("oculto");actividadSeleccionada=null;mostrarResultado("","oculto");document.getElementById("estadoLector").innerHTML="🔴 LECTOR DETENIDO"}

function procesarQR(decodedText){if(modoJugador)return;if(carnetBloqueado||!lectorActivo)return;const texto=String(decodedText||"").trim();if(!texto)return;
const qrGeneral=esQRGeneralPermanente(texto);if(qrGeneral){if(consultandoQRGeneral||procesandoActividad)return;carnetBloqueado=true;consultandoQRGeneral=true;mostrarResultado("🔎<div class='jugador'>QR GENERAL DETECTADO</div>⏳ Consultando actividades disponibles...","diagnostico");document.getElementById("estadoLector").innerHTML="🟡 CONSULTANDO ACTIVIDADES...";consultarActividadesQRGeneral();return;}
const actividadQR=extraerActividadDesdeQR(texto);if(actividadQR){if(procesandoActividad||consultandoQRGeneral)return;carnetBloqueado=true;procesandoActividad=true;mostrarResultado("🔎<div class='jugador'>QR DE ACTIVIDAD DETECTADO</div>⏳ Consultando actividad...","diagnostico");document.getElementById("estadoLector").innerHTML="🟡 CONSULTANDO ACTIVIDAD...";consultarActividad(actividadQR);return;}
if(!actividadSeleccionada){carnetBloqueado=true;mostrarResultado("⚠️<div class='jugador'>PRIMERO ESCANEE EL QR GENERAL</div>Debe seleccionar una actividad antes de escanear los carnets.","diagnostico");document.getElementById("estadoLector").innerHTML="🟡 ESCANEE QR GENERAL";setTimeout(()=>{carnetBloqueado=false;if(lectorActivo)document.getElementById("estadoLector").innerHTML="🟢 LECTOR ACTIVO — ESCANEE QR GENERAL"},TIEMPO_ENTRE_ESCANEOS);return;}registrarJugadorEnActividad(texto)}
function esQRGeneralPermanente(texto){try{const u=new URL(texto);return String(u.searchParams.get("accion")||"").trim().toLowerCase()==="qrgeneral"}catch(e){return false}}
function extraerActividadDesdeQR(texto){try{const u=new URL(texto);const accion=String(u.searchParams.get("accion")||"").trim().toLowerCase();const id=String(u.searchParams.get("id")||"").trim();if(accion!=="actividadqr"||!id)return null;return{actividadId:id}}catch(e){return null}}

function consultarActividadesQRGeneral(){contadorJSONP++;const callback="bufalosQRGeneral_"+Date.now()+"_"+contadorJSONP;let terminado=false,script=null;const limpiar=()=>limpiarJSONP(callback,script);window[callback]=r=>{if(terminado)return;terminado=true;try{if(!r){mostrarErrorQRGeneral();return}procesarRespuestaQRGeneral(r)}finally{limpiar()}};script=document.createElement("script");script.src=APPS_SCRIPT_URL+"?accion=actividadesQRGeneral&callback="+encodeURIComponent(callback)+"&_="+Date.now();script.onerror=()=>{if(terminado)return;terminado=true;mostrarErrorQRGeneral();limpiar()};script._bufalosTimeout=setTimeout(()=>{if(terminado)return;terminado=true;mostrarResultado("⚠️<div class='jugador'>SIN RESPUESTA</div>El sistema tardó demasiado en responder.","error");document.getElementById("estadoLector").innerHTML="🟡 ESCANEE EL QR GENERAL NUEVAMENTE";carnetBloqueado=false;consultandoQRGeneral=false;limpiar()},15000);document.body.appendChild(script)}
function procesarRespuestaQRGeneral(r){const lista=Array.isArray(r.actividades)?r.actividades:[];if(r.ok!==true){mostrarErrorQRGeneral(r.mensaje);return}if(lista.length===0){mostrarResultado("⚠️<div class='jugador'>NO HAY ACTIVIDADES PROGRAMADAS HOY</div>El QR GENERAL funciona, pero no hay una actividad disponible para seleccionar.","diagnostico");document.getElementById("estadoLector").innerHTML="🟡 ESPERE A LA ACTIVIDAD PROGRAMADA";carnetBloqueado=false;consultandoQRGeneral=false;return}if(lista.length===1){seleccionarActividad(lista[0]);return}mostrarSelectorActividades(lista)}
function mostrarSelectorActividades(lista){let html="<div class='jugador'>SELECCIONE LA ACTIVIDAD</div><p class='nota-selector'>Hay varias actividades programadas para hoy.</p><div class='selector-actividad'>";lista.forEach(a=>{html+="<button class='opcion-actividad' onclick=\"seleccionarActividadDesdeSelector('"+escapeJS(a.actividadId)+"')\"><strong>"+escaparHTML(a.actividad||"Actividad")+"</strong><span>📅 "+escaparHTML(a.fecha||"")+" · 🕐 "+escaparHTML(a.hora||"")+"<br>🏷️ "+escaparHTML(a.tipo||"")+"</span></button>"});html+="</div>";mostrarResultado(html,"diagnostico");document.getElementById("estadoLector").innerHTML="🟡 SELECCIONE LA ACTIVIDAD";window._bufalosActividadesDisponibles=lista;consultandoQRGeneral=false}
function seleccionarActividadDesdeSelector(id){const lista=window._bufalosActividadesDisponibles||[];const a=lista.find(x=>String(x.actividadId)===String(id));if(a)seleccionarActividad(a)}
function seleccionarActividad(a){actividadSeleccionada={actividadId:a.actividadId||"",fecha:a.fecha||"",hora:a.hora||"",actividad:a.actividad||a.nombre||"",tipo:a.tipo||"",estado:a.estado||""};mostrarActividadSeleccionada();document.getElementById("btnCambiar").classList.remove("oculto");document.getElementById("estadoLector").innerHTML="🟢 ACTIVIDAD LISTA — ESCANEE CARNETS";mostrarResultado("🟢<div class='jugador'>ACTIVIDAD SELECCIONADA</div><strong>"+escaparHTML(actividadSeleccionada.actividad)+"</strong><br><br>Ahora puede escanear los carnets de los jugadores.","exito");carnetBloqueado=false;consultandoQRGeneral=false;procesandoActividad=false}

function consultarActividad(datosQR){contadorJSONP++;const callback="bufalosActividad_"+Date.now()+"_"+contadorJSONP;let terminado=false,script=null;const limpiar=()=>limpiarJSONP(callback,script);window[callback]=r=>{if(terminado)return;terminado=true;try{if(!r){mostrarErrorActividad();return}procesarRespuestaActividad(r)}finally{limpiar()}};script=document.createElement("script");script.src=APPS_SCRIPT_URL+"?accion=actividadQR&id="+encodeURIComponent(datosQR.actividadId)+"&callback="+encodeURIComponent(callback)+"&_="+Date.now();script.onerror=()=>{if(terminado)return;terminado=true;mostrarResultado("❌<div class='jugador'>NO SE PUDO CONSULTAR LA ACTIVIDAD</div>No se recibió respuesta del sistema.","error");document.getElementById("estadoLector").innerHTML="🔴 ERROR CONSULTANDO ACTIVIDAD";carnetBloqueado=false;procesandoActividad=false;limpiar()};script._bufalosTimeout=setTimeout(()=>{if(terminado)return;terminado=true;mostrarResultado("⚠️<div class='jugador'>SIN RESPUESTA</div>El sistema tardó demasiado en responder.","error");document.getElementById("estadoLector").innerHTML="🔴 ERROR CONSULTANDO ACTIVIDAD";carnetBloqueado=false;procesandoActividad=false;limpiar()},15000);document.body.appendChild(script)}
function procesarRespuestaActividad(r){if(r.ok===true&&(String(r.estado||"").toUpperCase()==="OK"||String(r.estado||"").toUpperCase()==="ACTIVA"||r.actividad)){seleccionarActividad(r.actividad||r);return}mostrarResultado("❌<div class='jugador'>ACTIVIDAD NO ENCONTRADA</div>"+escaparHTML(r.mensaje||"El QR no corresponde a una actividad válida."),"error");document.getElementById("estadoLector").innerHTML="🟡 ESCANEE OTRO QR GENERAL";carnetBloqueado=false;procesandoActividad=false}
function mostrarActividadSeleccionada(){const p=document.getElementById("actividadSeleccionada");p.classList.remove("oculto");document.getElementById("actividadFecha").textContent=actividadSeleccionada.fecha||"-";document.getElementById("actividadHora").textContent=actividadSeleccionada.hora||"-";document.getElementById("actividadNombre").textContent=actividadSeleccionada.actividad||"-";document.getElementById("actividadTipo").textContent=actividadSeleccionada.tipo||"-";document.getElementById("actividadEstado").textContent=actividadSeleccionada.estado||"-"}

function registrarJugadorEnActividad(documento){if(!actividadSeleccionada){mostrarResultado("⚠️<div class='jugador'>NO HAY ACTIVIDAD SELECCIONADA</div>","error");return}carnetBloqueado=true;mostrarResultado("🔎<div class='jugador'>QR DETECTADO</div><strong>Documento:</strong> "+escaparHTML(documento)+"<br><br>⏳ Procesando asistencia...","diagnostico");document.getElementById("estadoLector").innerHTML="🟡 PROCESANDO CARNET...";contadorJSONP++;const callback="bufalosAsistencia_"+Date.now()+"_"+contadorJSONP;let terminado=false,script=null;const limpiar=()=>limpiarJSONP(callback,script);window[callback]=r=>{if(terminado)return;terminado=true;try{if(!r){mostrarErrorRespuesta();return}procesarRespuestaAsistencia(r,documento)}finally{limpiar()}};script=document.createElement("script");script.src=APPS_SCRIPT_URL+"?accion=registrarAsistenciaActividad&documento="+encodeURIComponent(documento)+"&id="+encodeURIComponent(actividadSeleccionada.actividadId)+"&callback="+encodeURIComponent(callback)+"&_="+Date.now();script.onerror=()=>{if(terminado)return;terminado=true;mostrarResultado("❌<div class='jugador'>NO SE RECIBIÓ CONFIRMACIÓN</div>El registro pudo haberse enviado, pero el navegador no recibió la respuesta.<br><br>Por seguridad, el lector fue detenido.","error");detenerLector();limpiar()};script._bufalosTimeout=setTimeout(()=>{if(terminado)return;terminado=true;mostrarResultado("⚠️<div class='jugador'>SIN CONFIRMACIÓN</div>El sistema tardó demasiado en responder.<br><br>Por seguridad, el lector fue detenido.<br>Revise la hoja Asistencia antes de continuar.","error");detenerLector();limpiar()},15000);document.body.appendChild(script)}
function procesarRespuestaAsistencia(r,documento){const estado=String(r.estado||"").toUpperCase();if(r.ok===true&&estado==="REGISTRADO"){escaneosRegistrados++;document.getElementById("contador").innerHTML="Registros confirmados: "+escaneosRegistrados;const j=r.jugador||{},nombre=j.nombre||r.nombre||"";mostrarResultado("🟢<div class='jugador'>ASISTENCIA REGISTRADA</div>"+(nombre?"<strong>"+escaparHTML(nombre)+"</strong><br><br>":"")+"<strong>Documento:</strong> "+escaparHTML(documento)+"<br><br>Actividad: "+escaparHTML(actividadSeleccionada.actividad),"exito");prepararSiguienteEscaneo();return}if(r.duplicado===true||estado==="DUPLICADO"){const n=r.nombre||(r.jugador&&r.jugador.nombre)||"";mostrarResultado("🟡<div class='jugador'>DUPLICADO</div>"+(n?"<strong>"+escaparHTML(n)+"</strong><br><br>":"")+escaparHTML(r.mensaje||"Este jugador ya tiene registrada la asistencia para esta actividad."),"duplicado");prepararSiguienteEscaneo();return}if(estado==="NO_ENCONTRADO"){mostrarResultado("🔴<div class='jugador'>JUGADOR NO ENCONTRADO</div><strong>Documento:</strong> "+escaparHTML(documento)+"<br><br>"+escaparHTML(r.mensaje||"No existe un jugador con este documento."),"error");prepararSiguienteEscaneo();return}mostrarResultado("❌<div class='jugador'>ERROR EN EL REGISTRO</div>"+escaparHTML(r.mensaje||"El sistema devolvió una respuesta inesperada.")+"<br><br>Por seguridad, el lector fue detenido.","error");detenerLector()}
function prepararSiguienteEscaneo(){if(!lectorActivo)return;document.getElementById("estadoLector").innerHTML="🟢 REGISTRO PROCESADO — PREPARE SIGUIENTE CARNET";setTimeout(()=>{if(!lectorActivo)return;carnetBloqueado=false;mostrarResultado("","oculto");document.getElementById("estadoLector").innerHTML="🟢 LECTOR ACTIVO — ESCANEE SIGUIENTE CARNET"},TIEMPO_ENTRE_ESCANEOS)}
function cambiarActividad(){if(modoJugador)return;actividadSeleccionada=null;carnetBloqueado=false;procesandoActividad=false;consultandoQRGeneral=false;document.getElementById("actividadSeleccionada").classList.add("oculto");document.getElementById("btnCambiar").classList.add("oculto");mostrarResultado("🔄<div class='jugador'>ACTIVIDAD CAMBIADA</div>Escanee ahora el QR GENERAL permanente de BÚFALOS FC.","diagnostico");if(lectorActivo)document.getElementById("estadoLector").innerHTML="🟢 LECTOR ACTIVO — ESCANEE QR GENERAL"}
function mostrarErrorActividad(){mostrarResultado("❌<div class='jugador'>NO SE RECIBIÓ CONFIRMACIÓN</div>El servidor no devolvió una respuesta válida.","error");document.getElementById("estadoLector").innerHTML="🟡 ESCANEE NUEVAMENTE EL QR GENERAL";carnetBloqueado=false;procesandoActividad=false}
function mostrarErrorQRGeneral(mensaje){mostrarResultado("❌<div class='jugador'>NO SE PUDO CONSULTAR EL QR GENERAL</div>"+escaparHTML(mensaje||"El servidor no devolvió una respuesta válida."),"error");document.getElementById("estadoLector").innerHTML="🟡 ESCANEE EL QR GENERAL NUEVAMENTE";carnetBloqueado=false;consultandoQRGeneral=false;procesandoActividad=false}
function mostrarErrorRespuesta(){mostrarResultado("❌<div class='jugador'>NO SE RECIBIÓ CONFIRMACIÓN</div>El servidor no devolvió una respuesta válida.<br><br>Por seguridad, el lector fue detenido.","error");detenerLector()}
function limpiarJSONP(callback,script){try{if(script&&script._bufalosTimeout)clearTimeout(script._bufalosTimeout)}catch(e){}try{if(script&&script.parentNode)script.parentNode.removeChild(script)}catch(e){}try{delete window[callback]}catch(e){window[callback]=undefined}}
function mostrarResultado(contenido,tipo){const e=document.getElementById("resultado");e.className="resultado "+tipo;e.innerHTML=contenido;if(tipo==="oculto")e.classList.add("oculto");else e.classList.remove("oculto")}
function escaparHTML(texto){const d=document.createElement("div");d.textContent=String(texto||"");return d.innerHTML}
function escapeJS(texto){return String(texto||"").replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/\n/g,"\\n").replace(/\r/g,"\\r")}
</script></body></html>
