<!DOCTYPE html>

<html>
<head>
  <base target="_top">

  <meta charset="UTF-8">

<meta name="viewport"
     content="width=device-width, initial-scale=1.0">

  <title>BÚFALOS FC - Lector QR</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .contenedor {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .panel {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.10);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 13px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-bottom: 12px;
    }

    button {
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-iniciar {
      background: #198754;
      color: white;
    }

    .btn-detener {
      background: #dc3545;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 15px auto;
    }

    .estado {
      text-align: center;
      font-weight: bold;
      padding: 12px;
      border-radius: 8px;
      margin-top: 10px;
      background: #eee;
    }

    .resultado {
      text-align: center;
      padding: 20px;
      border-radius: 12px;
      margin-top: 15px;
      font-size: 18px;
      line-height: 1.5;
    }

    .diagnostico {
      background: #fff3cd;
      color: #664d03;
    }

    .exito {
      background: #d1e7dd;
      color: #0f5132;
    }

    .error {
      background: #f8d7da;
      color: #842029;
    }

    .duplicado {
      background: #fff3cd;
      color: #664d03;
    }

    .jugador {
      font-size: 24px;
      font-weight: bold;
      margin: 10px 0;
    }

    .contador {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      margin-top: 10px;
    }

    .oculto {
      display: none !important;
    }

  </style>

</head>

<body>

<div class="contenedor">

  <h1>⚽ BÚFALOS FC</h1>

  <div class="panel">

```
<label for="tipo">
  Tipo de registro
</label>

<select id="tipo">

  <option value="PREASISTENCIA">
    PREASISTENCIA
  </option>

  <option value="ASISTENCIA">
    ASISTENCIA
  </option>

</select>


<label for="actividad">
  Actividad
</label>

<input
  type="text"
  id="actividad"
  value="Entrenamiento"
  placeholder="Nombre de la actividad"
>


<button
  class="btn-iniciar"
  id="btnIniciar"
  onclick="iniciarLector()">

  📷 INICIAR LECTOR

</button>


<button
  class="btn-detener"
  id="btnDetener"
  onclick="detenerLector()"
  disabled>

  ⛔ DETENER LECTOR

</button>
```

  </div>

  <div class="panel">

```
<div id="reader"></div>

<div
  id="estadoLector"
  class="estado">

  🔴 LECTOR DETENIDO

</div>


<div
  id="contador"
  class="contador">

  Registros confirmados: 0

</div>
```

  </div>

  <div
    id="resultado"
    class="resultado oculto">
  </div>

</div>

<script>

/* =========================================================
   CONFIGURACIÓN
========================================================= */

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbwMw4Lbn8xo9JqZCpd7wJ_6cwNy-nswbErwbhkPWK2y26_ZwtVYZ9p1n2rrHsf60hs/exec";


/*
 * Tiempo de espera entre un resultado y el siguiente escaneo.
 *
 * 2000 = 2 segundos
 */
const TIEMPO_ENTRE_ESCANEOS = 2000;


/* =========================================================
   VARIABLES PRINCIPALES
========================================================= */

let html5QrCode = null;

let lectorActivo = false;

let carnetBloqueado = false;

let escaneosRegistrados = 0;

let contadorJSONP = 0;


/* =========================================================
   INICIAR LECTOR
========================================================= */

async function iniciarLector() {

  if (lectorActivo) {

    return;

  }


  try {

    document.getElementById("estadoLector").innerHTML =
      "🟡 INICIANDO CÁMARA...";


    /*
     * Creamos una nueva instancia solamente
     * cuando realmente iniciamos el lector.
     */
    html5QrCode =
      new Html5Qrcode("reader");


    const cameras =
      await Html5Qrcode.getCameras();


    if (!cameras || cameras.length === 0) {

      throw new Error(
        "No se encontró ninguna cámara."
      );

    }


    /*
     * Buscamos preferiblemente la cámara trasera.
     */
    let camaraSeleccionada =
      cameras[0].id;


    const camaraTrasera =
      cameras.find(function(camara) {

        const nombre =
          String(camara.label || "").toLowerCase();

        return (
          nombre.includes("back") ||
          nombre.includes("rear") ||
          nombre.includes("trasera") ||
          nombre.includes("environment")
        );

      });


    if (camaraTrasera) {

      camaraSeleccionada =
        camaraTrasera.id;

    }


    await html5QrCode.start(

      camaraSeleccionada,

      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        },

        aspectRatio: 1.0,

        rememberLastUsedCamera: true
      },

      procesarQR,

      function(errorMessage) {

        /*
         * Los errores normales de lectura
         * se ignoran.
         */

      }

    );


    lectorActivo = true;

    carnetBloqueado = false;


    document.getElementById("btnIniciar").disabled =
      true;

    document.getElementById("btnDetener").disabled =
      false;


    document.getElementById("estadoLector").innerHTML =
      "🟢 LECTOR ACTIVO — ESCANEE UN CARNET";


    mostrarResultado(
      "",
      "oculto"
    );


    console.log(
      "LECTOR CONTINUO INICIADO CORRECTAMENTE"
    );

  } catch(error) {

    console.error(
      "ERROR INICIANDO LECTOR:",
      error
    );


    lectorActivo = false;

    carnetBloqueado = false;


    document.getElementById("btnIniciar").disabled =
      false;

    document.getElementById("btnDetener").disabled =
      true;


    document.getElementById("estadoLector").innerHTML =
      "❌ NO SE PUDO INICIAR LA CÁMARA";


    mostrarResultado(

      "❌ " +
      escaparHTML(
        error.message ||
        "Error desconocido."
      ),

      "error"

    );

  }

}


/* =========================================================
   DETENER LECTOR MANUALMENTE
========================================================= */

async function detenerLector() {

  try {

    if (html5QrCode && lectorActivo) {

      await html5QrCode.stop();

    }

  } catch(error) {

    console.error(
      "ERROR DETENIENDO LECTOR:",
      error
    );

  }


  lectorActivo = false;

  carnetBloqueado = false;


  document.getElementById("btnIniciar").disabled =
    false;

  document.getElementById("btnDetener").disabled =
    true;


  document.getElementById("estadoLector").innerHTML =
    "🔴 LECTOR DETENIDO";


  mostrarResultado(
    "",
    "oculto"
  );


  console.log(
    "LECTOR DETENIDO MANUALMENTE"
  );

}


/* =========================================================
   PROCESAR QR
========================================================= */

function procesarQR(decodedText) {

  /*
   * SI ESTAMOS PROCESANDO OTRO CARNET,
   * IGNORAMOS CUALQUIER NUEVA LECTURA.
   */
  if (carnetBloqueado) {

    console.log(
      "QR IGNORADO: PROCESANDO CARNET ANTERIOR"
    );

    return;

  }


  /*
   * SI EL LECTOR NO ESTÁ ACTIVO,
   * NO PROCESAMOS.
   */
  if (!lectorActivo) {

    return;

  }


  const documento =
    String(decodedText || "").trim();


  if (!documento) {

    return;

  }


  /*
   * BLOQUEAMOS INMEDIATAMENTE.
   *
   * MUY IMPORTANTE:
   * NO DETENEMOS LA CÁMARA.
   *
   * La cámara seguirá encendida,
   * pero ignoraremos nuevos QR
   * mientras esperamos la respuesta.
   */
  carnetBloqueado = true;


  console.log(
    "================================"
  );

  console.log(
    "QR DETECTADO:",
    documento
  );

  console.log(
    "LECTOR CONTINUO: CARNET BLOQUEADO TEMPORALMENTE"
  );

  console.log(
    "================================"
  );


  mostrarResultado(

    "🔎" +

    "<div class='jugador'>" +
    "QR DETECTADO" +
    "</div>" +

    "<strong>Documento:</strong> " +
    escaparHTML(documento) +

    "<br><br>" +

    "⏳ Procesando registro...",

    "diagnostico"

  );


  document.getElementById("estadoLector").innerHTML =
    "🟡 PROCESANDO CARNET...";


  const tipo =
    document.getElementById("tipo").value;


  const actividad =
    document.getElementById("actividad").value.trim()
    || "Entrenamiento";


  /*
   * ENVIAMOS EL REGISTRO.
   */
  enviarRegistro(
    documento,
    tipo,
    actividad
  );

}


/* =========================================================
   ENVIAR REGISTRO Y RECIBIR RESPUESTA
========================================================= */

function enviarRegistro(
  documento,
  tipo,
  actividad
) {

  console.log(
    "ENVIANDO AL SISTEMA BÚFALOS FC:",
    documento
  );


  mostrarResultado(

    "📤" +

    "<div class='jugador'>" +
    "PROCESANDO REGISTRO" +
    "</div>" +

    "Esperando confirmación del sistema...",

    "diagnostico"

  );


  contadorJSONP++;


  const callback =
    "bufalosRespuesta_" +
    Date.now() +
    "_" +
    contadorJSONP;


  let terminado = false;


  /*
   * Creamos la función callback global.
   */
  window[callback] = function(respuesta) {

    if (terminado) {

      return;

    }


    terminado = true;


    console.log(
      "RESPUESTA RECIBIDA:",
      respuesta
    );


    try {

      if (!respuesta) {

        mostrarErrorRespuesta();

        return;

      }


      procesarRespuestaServidor(
        respuesta,
        documento,
        tipo
      );

    } finally {

      limpiarJSONP(
        callback,
        script
      );

    }

  };


  /*
   * Creamos el script JSONP.
   */
  const script =
    document.createElement("script");


  script.src =
    APPS_SCRIPT_URL +

    "?accion=registrarAsistenciaQR" +

    "&documento=" +
    encodeURIComponent(documento) +

    "&tipo=" +
    encodeURIComponent(tipo) +

    "&actividad=" +
    encodeURIComponent(actividad) +

    "&registradoPor=" +
    encodeURIComponent("Hub QR") +

    "&callback=" +
    encodeURIComponent(callback) +

    "&_=" +
    Date.now();


  /*
   * Error de conexión.
   *
   * En este caso NO desbloqueamos automáticamente,
   * porque no sabemos si el registro llegó al servidor.
   */
  script.onerror = function() {

    if (terminado) {

      return;

    }


    terminado = true;


    console.error(
      "ERROR RECIBIENDO RESPUESTA DEL SERVIDOR"
    );


    mostrarResultado(

      "❌" +

      "<div class='jugador'>" +
      "NO SE RECIBIÓ CONFIRMACIÓN" +
      "</div>" +

      "El registro pudo haberse enviado," +

      "<br>" +

      "pero el navegador no recibió la respuesta del sistema.",

      "error"

    );


    document.getElementById("estadoLector").innerHTML =
      "🔴 LECTOR DETENIDO — REVISE EL REGISTRO";


    /*
     * Detenemos el lector por seguridad.
     */
    detenerLector();


    limpiarJSONP(
      callback,
      script
    );

  };


  /*
   * Timeout de seguridad.
   */
  const temporizador =
    setTimeout(function() {

      if (terminado) {

        return;

      }


      terminado = true;


      console.error(
        "TIEMPO DE ESPERA AGOTADO"
      );


      mostrarResultado(

        "⚠️" +

        "<div class='jugador'>" +
        "SIN CONFIRMACIÓN" +
        "</div>" +

        "El sistema tardó demasiado en responder." +

        "<br><br>" +

        "Por seguridad, el lector fue detenido." +

        "<br>" +

        "Revise la hoja Asistencia antes de continuar.",

        "error"

      );


      detenerLector();


      limpiarJSONP(
        callback,
        script
      );

    }, 15000);


  /*
   * Guardamos el timeout.
   */
  script._bufalosTimeout =
    temporizador;


  document.body.appendChild(script);

}


/* =========================================================
   PROCESAR RESPUESTA DEL SERVIDOR
========================================================= */

function procesarRespuestaServidor(
  respuesta,
  documento,
  tipo
) {

  const estado =
    String(
      respuesta.estado || ""
    ).toUpperCase();


  /*
   * =======================================================
   * REGISTRO NUEVO
   * =======================================================
   */

  if (
    respuesta.ok === true &&
    estado === "REGISTRADO"
  ) {

    escaneosRegistrados++;


    document.getElementById("contador").innerHTML =
      "Registros confirmados: " +
      escaneosRegistrados;


    const jugador =
      respuesta.jugador || {};


    const nombre =
      jugador.nombre ||
      respuesta.nombre ||
      "";


    mostrarResultado(

      "🟢" +

      "<div class='jugador'>" +

      (
        tipo === "PREASISTENCIA"
          ? "PREASISTENCIA REGISTRADA"
          : "ASISTENCIA REGISTRADA"
      ) +

      "</div>" +

      (
        nombre
          ? "<strong>" +
            escaparHTML(nombre) +
            "</strong><br><br>"
          : ""
      ) +

      "<strong>Documento:</strong> " +
      escaparHTML(documento) +

      "<br><br>" +

      "El sistema BÚFALOS FC confirmó el registro.",

      "exito"

    );


    /*
     * ESPERAMOS 2 SEGUNDOS Y VOLVEMOS
     * AUTOMÁTICAMENTE A ESCANEAR.
     */
    prepararSiguienteEscaneo();


    return;

  }


  /*
   * =======================================================
   * DUPLICADO
   * =======================================================
   */

  if (
    respuesta.duplicado === true ||
    estado === "DUPLICADO"
  ) {

    const nombre =
      respuesta.nombre ||
      (
        respuesta.jugador &&
        respuesta.jugador.nombre
      ) ||
      "";


    mostrarResultado(

      "🟡" +

      "<div class='jugador'>" +
      "YA REGISTRADO" +
      "</div>" +

      (
        nombre
          ? "<strong>" +
            escaparHTML(nombre) +
            "</strong><br><br>"
          : ""
      ) +

      escaparHTML(
        respuesta.mensaje ||
        "Este jugador ya tiene registrado este evento."
      ),

      "duplicado"

    );


    /*
     * TAMBIÉN CONTINUAMOS AUTOMÁTICAMENTE.
     */
    prepararSiguienteEscaneo();


    return;

  }


  /*
   * =======================================================
   * JUGADOR NO ENCONTRADO
   * =======================================================
   */

  if (
    estado === "NO_ENCONTRADO"
  ) {

    mostrarResultado(

      "🔴" +

      "<div class='jugador'>" +
      "JUGADOR NO ENCONTRADO" +
      "</div>" +

      "<strong>Documento:</strong> " +
      escaparHTML(documento) +

      "<br><br>" +

      escaparHTML(
        respuesta.mensaje ||
        "No existe un jugador con este documento."
      ),

      "error"

    );


    /*
     * Un documento desconocido no representa
     * un riesgo de duplicar un registro válido.
     *
     * Por eso continuamos automáticamente.
     */
    prepararSiguienteEscaneo();


    return;

  }


  /*
   * =======================================================
   * ERROR DESCONOCIDO
   * =======================================================
   *
   * En errores inesperados detenemos el lector
   * para seguridad.
   */

  mostrarResultado(

    "❌" +

    "<div class='jugador'>" +
    "ERROR EN EL REGISTRO" +
    "</div>" +

    escaparHTML(
      respuesta.mensaje ||
      "El sistema devolvió una respuesta inesperada."
    ) +

    "<br><br>" +

    "Por seguridad, el lector fue detenido.",

    "error"

  );


  detenerLector();

}


/* =========================================================
   PREPARAR SIGUIENTE ESCANEO
========================================================= */

function prepararSiguienteEscaneo() {

  /*
   * Verificamos que el lector siga activo.
   */
  if (!lectorActivo) {

    return;

  }


  document.getElementById("estadoLector").innerHTML =
    "🟢 LECTOR ACTIVO — PREPARE EL SIGUIENTE CARNET";


  /*
   * Esperamos un pequeño tiempo para:
   *
   * 1. Evitar que la misma imagen del QR
   *    vuelva a detectarse inmediatamente.
   *
   * 2. Dar tiempo al usuario para retirar
   *    el carnet anterior.
   */
  setTimeout(function() {

    if (!lectorActivo) {

      return;

    }


    carnetBloqueado = false;


    mostrarResultado(
      "",
      "oculto"
    );


    document.getElementById("estadoLector").innerHTML =
      "🟢 LECTOR ACTIVO — ESCANEE EL SIGUIENTE CARNET";


    console.log(
      "LECTOR DESBLOQUEADO — LISTO PARA SIGUIENTE CARNET"
    );

  }, TIEMPO_ENTRE_ESCANEOS);

}


/* =========================================================
   ERROR DE RESPUESTA
========================================================= */

function mostrarErrorRespuesta() {

  mostrarResultado(

    "❌" +

    "<div class='jugador'>" +
    "NO SE RECIBIÓ CONFIRMACIÓN" +
    "</div>" +

    "El servidor no devolvió una respuesta válida." +

    "<br><br>" +

    "Por seguridad, el lector fue detenido.",

    "error"

  );


  detenerLector();

}


/* =========================================================
   LIMPIAR JSONP
========================================================= */

function limpiarJSONP(
  callback,
  script
) {

  try {

    if (
      script &&
      script._bufalosTimeout
    ) {

      clearTimeout(
        script._bufalosTimeout
      );

    }

  } catch(error) {}


  try {

    if (
      script &&
      script.parentNode
    ) {

      script.parentNode.removeChild(
        script
      );

    }

  } catch(error) {}


  try {

    delete window[callback];

  } catch(error) {

    window[callback] =
      undefined;

  }

}


/* =========================================================
   MOSTRAR RESULTADO
========================================================= */

function mostrarResultado(
  contenido,
  tipo
) {

  const elemento =
    document.getElementById("resultado");


  elemento.className =
    "resultado " +
    tipo;


  elemento.innerHTML =
    contenido;


  if (tipo === "oculto") {

    elemento.classList.add(
      "oculto"
    );

  } else {

    elemento.classList.remove(
      "oculto"
    );

  }

}


/* =========================================================
   ESPERAR
========================================================= */

function esperar(milisegundos) {

  return new Promise(function(resolve) {

    setTimeout(
      resolve,
      milisegundos
    );

  });

}


/* =========================================================
   HTML SEGURO
========================================================= */

function escaparHTML(texto) {

  const div =
    document.createElement("div");


  div.textContent =
    String(texto || "");


  return div.innerHTML;

}

</script>

</body>
</html>
