<!DOCTYPE html>

<html>
<head>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:20px;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#222;
}

.contenedor{

.panel{

button{

  font-weight:bold;
}

  opacity:.5;

}

}

.btn-cambiar{
  background:#0d6efd;
  color:#fff;
}

.btn-confirmar{
  background:#198754;
  color:#fff;
}

#reader{
  width:100%;
  max-width:500px;
  margin:15px auto;
}

.estado{
  text-align:center;
  font-weight:bold;
  padding:12px;
  border-radius:8px;
  margin-top:10px;
  background:#eee;
}

.actividad{
  background:#e7f1ff;
  border:2px solid #0d6efd;
  border-radius:12px;
  padding:15px;
  margin-bottom:15px;
}

.actividad-titulo{
  text-align:center;
  font-size:20px;

  margin-bottom:12px;
}

.dato{
  padding:6px 0;
  font-size:16px;
}

.dato strong{
  display:inline-block;

}

.resultado{
  text-align:center;
  padding:20px;
  border-radius:12px;
  margin-top:15px;
  font-size:18px;
  line-height:1.5;
}

.diagnostico{
  background:#fff3cd;
  color:#664d03;
}

.exito{
  background:#d1e7dd;
  color:#0f5132;
}

.error{
  background:#f8d7da;
  color:#842029;
}

.duplicado{
  background:#fff3cd;

}

.jugador{
  font-size:24px;
  font-weight:bold;

}

.contador{
  text-align:center;

}

.oculto{
  display:none!important;
}

.selector-actividad{
  margin-top:15px;
}

.opcion-actividad{

  background:#f8f9fa;
  border:2px solid #dee2e6;

  border-radius:10px;
  margin-bottom:10px;
}

.opcion-actividad:hover{
  border-color:#0d6efd;

}

.opcion-actividad.seleccionada{
  border-color:#198754!important;

}

.opcion-actividad strong{

}

.opcion-actividad span{
  display:block;

}

.nota-selector{
  text-align:center;
  margin:0 0 15px;
}

.cargando{
  text-align:center;
  padding:15px;
}

.modo{
  text-align:center;
  font-size:14px;
  font-weight:bold;
  margin-top:5px;
  color:#555;
}

.separador{
  margin:18px 0;
  border:0;
  border-top:1px solid #ddd;
}

</style>

</head>

<body>

<div class="contenedor">

<h1>⚽ BÚFALOS FC</h1>

<!-- ==========================================
     ACTIVIDAD CONFIRMADA
========================================== -->

<div class="panel">

<div id="actividadSeleccionada" class="actividad oculto">

<div class="actividad-titulo">
📋 ACTIVIDAD CONFIRMADA
</div>

<div class="dato">
<strong>Fecha:</strong>
<span id="actividadFecha">-</span>
</div>

<div class="dato">
<strong>Hora:</strong>
<span id="actividadHora">-</span>
</div>

<div class="dato">
<strong>Actividad:</strong>
<span id="actividadNombre">-</span>
</div>

<div class="dato">
<strong>Tipo:</strong>
<span id="actividadTipo">-</span>
</div>

<div class="dato">
<strong>Estado:</strong>
<span id="actividadEstado">-</span>
</div>

</div>

<!-- BOTÓN INICIAR -->

<button
class="btn-iniciar"
id="btnIniciar"
onclick="iniciarLector()"
disabled>
📷 INICIAR LECTOR </button>

<!-- BOTÓN DETENER -->

<button
class="btn-detener"
id="btnDetener"
onclick="detenerLector()"
disabled>
⛔ DETENER LECTOR </button>

<!-- BOTÓN CAMBIAR -->

<button
class="btn-cambiar oculto"
id="btnCambiar"
onclick="cambiarActividad()">
🔄 CAMBIAR ACTIVIDAD </button>

</div>

<!-- ==========================================
     SELECCIÓN DE ACTIVIDAD
========================================== -->

<div class="panel" id="panelActividades">

<div id="selectorActividades">

<div class="cargando">
🔎 Cargando actividades...
</div>

</div>

</div>

<!-- ==========================================
     LECTOR
========================================== -->

<div class="panel">

<div id="reader"></div>

<div id="estadoLector" class="estado">
🟡 CARGANDO ACTIVIDADES...
</div>

<div id="contador" class="contador">
Registros confirmados: 0
</div>

</div>

<!-- ==========================================
     RESULTADO
========================================== -->

<div id="resultado" class="resultado oculto"></div>

</div>

<script>

/* =================================================
   CONFIGURACIÓN
================================================= */

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbx18G_rLYrqsriwsx-hSGYqsTUlfdfBCqVQ6vNTIzDvXLWUVS1V7Ojl54wMe8Vm51Zb/exec";

const TIEMPO_ENTRE_ESCANEOS = 2000;


/* =================================================
   VARIABLES
================================================= */

let html5QrCode = null;

let lectorActivo = false;

let carnetBloqueado = false;

let escaneosRegistrados = 0;

let contadorJSONP = 0;

let actividadSeleccionada = null;

let actividadesDisponibles = [];

let actividadIndiceSeleccionada = -1;

let consultandoActividades = false;


/* =================================================
   AL CARGAR HUB
================================================= */

document.addEventListener("DOMContentLoaded",function(){

  cargarActividades();

});


/* =================================================
   CARGAR ACTIVIDADES
================================================= */

function cargarActividades(){

  if(consultandoActividades)return;

  consultandoActividades = true;

  actividadIndiceSeleccionada = -1;

  document.getElementById("selectorActividades").innerHTML =
    "<div class='cargando'>"+
    "🔎<div class='jugador'>ACTIVIDADES</div>"+
    "⏳ Consultando actividades disponibles..."+
    "</div>";

  document.getElementById("estadoLector").innerHTML =
    "🟡 CONSULTANDO ACTIVIDADES...";

  document.getElementById("btnIniciar").disabled = true;

  contadorJSONP++;

  const callback =
    "bufalosActividades_"+
    Date.now()+
    "_"+
    contadorJSONP;

  let terminado = false;
  let script = null;

  const limpiar = () =>
    limpiarJSONP(callback,script);


  window[callback] = function(r){

    if(terminado)return;

    terminado = true;

    try{

      if(!r){

        mostrarErrorActividades(
          "El servidor no devolvió información."
        );

        return;
      }

      procesarRespuestaActividades(r);

    }finally{

      limpiar();

    }

  };


  script = document.createElement("script");

  script.src =
    APPS_SCRIPT_URL+
    "?accion=actividadesQRGeneral"+
    "&callback="+
    encodeURIComponent(callback)+
    "&_="+
    Date.now();


  script.onerror = function(){

    if(terminado)return;

    terminado = true;

    mostrarErrorActividades(
      "No se pudo conectar con el servidor."
    );

    limpiar();

  };


  script._bufalosTimeout =
    setTimeout(function(){

      if(terminado)return;

      terminado = true;

      mostrarErrorActividades(
        "El sistema tardó demasiado en responder."
      );

      limpiar();

    },15000);


  document.body.appendChild(script);

}


/* =================================================
   RESPUESTA ACTIVIDADES
================================================= */

function procesarRespuestaActividades(r){

  consultandoActividades = false;

  const lista =
    Array.isArray(r.actividades)
      ? r.actividades
      : [];


  if(r.ok !== true){

    mostrarErrorActividades(
      r.mensaje ||
      "El servidor devolvió un error."
    );

    return;

  }


  actividadesDisponibles = lista;


  if(lista.length === 0){

    document.getElementById("selectorActividades").innerHTML =
      "<div class='resultado diagnostico'>"+
      "⚠️<div class='jugador'>NO HAY ACTIVIDADES</div>"+
      "No hay actividades programadas para hoy."+
      "<br><br>"+
      "<button class='btn-cambiar' onclick='cargarActividades()'>"+
      "🔄 ACTUALIZAR ACTIVIDADES"+
      "</button>"+
      "</div>";

    document.getElementById("estadoLector").innerHTML =
      "🟡 NO HAY ACTIVIDADES PARA HOY";

    document.getElementById("btnIniciar").disabled = true;

    return;

  }


  mostrarSelectorActividades(lista);

}


/* =================================================
   MOSTRAR SELECTOR
================================================= */

function mostrarSelectorActividades(lista){

  let html =

    "<div class='jugador'>"+
    "📋 SELECCIONE LA ACTIVIDAD"+
    "</div>"+

    "<p class='nota-selector'>"+
    "Seleccione la actividad a la que desea registrar asistencia."+
    "</p>"+

    "<div class='selector-actividad'>";


  lista.forEach(function(a,i){

    const nombre =
      a.actividad ||
      a.nombre ||
      "Actividad";


    html +=

      "<button "+
      "type='button' "+
      "class='opcion-actividad' "+
      "id='actividadOpcion_"+i+"' "+
      "onclick='seleccionarActividad("+i+")'>"+

      "<strong>"+
      escaparHTML(nombre)+
      "</strong>"+

      "<span>"+
      "📅 "+
      escaparHTML(a.fecha || "-")+
      " · 🕐 "+
      escaparHTML(a.hora || "-")+
      "<br>"+
      "🏷️ "+
      escaparHTML(a.tipo || "-")+
      "<br>"+
      "📌 Estado: "+
      escaparHTML(a.estado || "-")+
      "</span>"+

      "</button>";

  });


  html +=

    "</div>"+

    "<hr class='separador'>"+

    "<button "+
    "type='button' "+
    "class='btn-confirmar' "+
    "id='btnConfirmarActividad' "+
    "onclick='confirmarActividad()' "+
    "disabled>"+

    "✅ CONFIRMAR ACTIVIDAD"+

    "</button>";


  document.getElementById("selectorActividades").innerHTML =
    html;


  document.getElementById("estadoLector").innerHTML =
    "🟡 SELECCIONE UNA ACTIVIDAD";


  document.getElementById("btnIniciar").disabled = true;

}


/* =================================================
   SELECCIONAR ACTIVIDAD
================================================= */

function seleccionarActividad(indice){

  const a =
    actividadesDisponibles[indice];

  if(!a)return;


  actividadIndiceSeleccionada = indice;


  document
    .querySelectorAll(".opcion-actividad")
    .forEach(function(b){

      b.classList.remove("seleccionada");

    });


  const boton =
    document.getElementById(
      "actividadOpcion_"+indice
    );


  if(boton)
    boton.classList.add("seleccionada");


  const confirmar =
    document.getElementById(
      "btnConfirmarActividad"
    );


  if(confirmar)
    confirmar.disabled = false;


  document.getElementById("estadoLector").innerHTML =
    "🟢 ACTIVIDAD SELECCIONADA — CONFIRME";


  mostrarResultado(

    "🟢<div class='jugador'>ACTIVIDAD SELECCIONADA</div>"+

    "<strong>"+
    escaparHTML(
      a.actividad ||
      a.nombre ||
      "Actividad"
    )+
    "</strong>"+

    "<br><br>"+

    "Pulse <strong>CONFIRMAR ACTIVIDAD</strong> para continuar.",

    "diagnostico"

  );

}


/* =================================================
   CONFIRMAR ACTIVIDAD
================================================= */

function confirmarActividad(){

  if(
    actividadIndiceSeleccionada < 0 ||
    !actividadesDisponibles[
      actividadIndiceSeleccionada
    ]
  ){

    mostrarResultado(

      "⚠️<div class='jugador'>SELECCIONE UNA ACTIVIDAD</div>"+
      "Debe seleccionar una actividad antes de confirmar.",

      "diagnostico"

    );

    return;

  }


  const a =
    actividadesDisponibles[
      actividadIndiceSeleccionada
    ];


  actividadSeleccionada = {

    actividadId:
      a.actividadId || "",

    fecha:
      a.fecha || "",

    hora:
      a.hora || "",

    actividad:
      a.actividad ||
      a.nombre ||
      "",

    tipo:
      a.tipo || "",

    estado:
      a.estado || ""

  };


  if(!actividadSeleccionada.actividadId){

    mostrarResultado(

      "❌<div class='jugador'>ACTIVIDAD INVÁLIDA</div>"+
      "La actividad seleccionada no tiene un identificador válido.",

      "error"

    );

    return;

  }


  mostrarActividadSeleccionada();


  document.getElementById("panelActividades")
    .classList.add("oculto");


  document.getElementById("btnIniciar")
    .disabled = false;


  document.getElementById("btnCambiar")
    .classList.remove("oculto");


  document.getElementById("estadoLector")
    .innerHTML =
    "🟢 ACTIVIDAD CONFIRMADA — PUEDE INICIAR EL LECTOR";


  mostrarResultado(

    "🟢<div class='jugador'>ACTIVIDAD CONFIRMADA</div>"+

    "<strong>"+
    escaparHTML(
      actividadSeleccionada.actividad
    )+
    "</strong>"+

    "<br><br>"+

    "Ahora pulse <strong>INICIAR LECTOR</strong> para comenzar a escanear los carnets.",

    "exito"

  );

}


/* =================================================
   MOSTRAR ACTIVIDAD CONFIRMADA
================================================= */

function mostrarActividadSeleccionada(){

  const p =
    document.getElementById(
      "actividadSeleccionada"
    );


  p.classList.remove("oculto");


  document.getElementById("actividadFecha")
    .textContent =
      actividadSeleccionada.fecha || "-";


  document.getElementById("actividadHora")
    .textContent =
      actividadSeleccionada.hora || "-";


  document.getElementById("actividadNombre")
    .textContent =
      actividadSeleccionada.actividad || "-";


  document.getElementById("actividadTipo")
    .textContent =
      actividadSeleccionada.tipo || "-";


  document.getElementById("actividadEstado")
    .textContent =
      actividadSeleccionada.estado || "-";

}


/* =================================================
   INICIAR LECTOR
================================================= */

async function iniciarLector(){

  if(lectorActivo)return;


  if(!actividadSeleccionada){

    mostrarResultado(

      "⚠️<div class='jugador'>SELECCIONE UNA ACTIVIDAD</div>"+
      "Primero seleccione y confirme una actividad.",

      "diagnostico"

    );

    return;

  }


  try{

    document.getElementById("estadoLector")
      .innerHTML =
      "🟡 INICIANDO CÁMARA...";


    html5QrCode =
      new Html5Qrcode("reader");


    const cameras =
      await Html5Qrcode.getCameras();


    if(
      !cameras ||
      !cameras.length
    ){

      throw new Error(
        "No se encontró ninguna cámara."
      );

    }


    let camaraSeleccionada =
      cameras[0].id;


    const trasera =
      cameras.find(function(c){

        const n =
          String(
            c.label || ""
          ).toLowerCase();


        return (
          n.includes("back") ||
          n.includes("rear") ||
          n.includes("trasera") ||
          n.includes("environment")
        );

      });


    if(trasera)
      camaraSeleccionada =
        trasera.id;


    await html5QrCode.start(

      camaraSeleccionada,

      {
        fps:10,
        qrbox:{
          width:250,
          height:250
        },
        aspectRatio:1,
        rememberLastUsedCamera:true
      },

      procesarQR,

      function(){}

    );


    lectorActivo = true;

    carnetBloqueado = false;


    document.getElementById("btnIniciar")
      .disabled = true;


    document.getElementById("btnDetener")
      .disabled = false;


    document.getElementById("estadoLector")
      .innerHTML =
      "🟢 LECTOR ACTIVO — ESCANEE CARNETS";


    mostrarResultado(

      "🟢<div class='jugador'>LECTOR ACTIVO</div>"+
      "Escanee el carnet del jugador.",

      "exito"

    );


  }catch(error){

    console.error(error);


    lectorActivo = false;

    carnetBloqueado = false;


    document.getElementById("btnIniciar")
      .disabled = false;


    document.getElementById("btnDetener")
      .disabled = true;


    document.getElementById("estadoLector")
      .innerHTML =
      "❌ NO SE PUDO INICIAR LA CÁMARA";


    mostrarResultado(

      "❌<div class='jugador'>ERROR</div>"+
      escaparHTML(
        error &&
        error.message
          ? error.message
          : "Error desconocido."
      ),

      "error"

    );

  }

}


/* =================================================
   DETENER LECTOR
================================================= */

async function detenerLector(){

  try{

    if(
      html5QrCode &&
      lectorActivo
    ){

      await html5QrCode.stop();

    }

  }catch(e){

    console.error(e);

  }


  lectorActivo = false;

  carnetBloqueado = false;


  document.getElementById("btnIniciar")
    .disabled =
      !actividadSeleccionada;


  document.getElementById("btnDetener")
    .disabled = true;


  document.getElementById("estadoLector")
    .innerHTML =
      actividadSeleccionada
        ? "🟢 ACTIVIDAD CONFIRMADA — PUEDE INICIAR EL LECTOR"
        : "🔴 LECTOR DETENIDO";


  if(actividadSeleccionada){

    mostrarResultado(

      "🟢<div class='jugador'>LECTOR DETENIDO</div>"+
      "La actividad continúa seleccionada."+
      "<br><br>"+
      "Puede iniciar nuevamente el lector.",

      "diagnostico"

    );

  }else{

    mostrarResultado("","oculto");

  }

}


/* =================================================
   PROCESAR QR
================================================= */

function procesarQR(decodedText){

  if(
    carnetBloqueado ||
    !lectorActivo
  )
    return;


  const texto =
    String(
      decodedText || ""
    ).trim();


  if(!texto)return;


  /*
     EL QR GENERAL NO SE UTILIZA
     PARA REGISTRAR ASISTENCIA.

     LA ACTIVIDAD YA DEBE ESTAR
     CONFIRMADA EN PANTALLA.
  */


  const actividadQR =
    extraerActividadDesdeQR(texto);


  if(actividadQR){

    carnetBloqueado = true;


    mostrarResultado(

      "ℹ️<div class='jugador'>QR DE ACTIVIDAD</div>"+
      "Esta actividad ya se selecciona desde la pantalla del HUB.",

      "diagnostico"

    );


    setTimeout(function(){

      carnetBloqueado = false;

      if(lectorActivo){

        document.getElementById("estadoLector")
          .innerHTML =
          "🟢 LECTOR ACTIVO — ESCANEE CARNETS";

      }

    },TIEMPO_ENTRE_ESCANEOS);


    return;

  }


  if(!actividadSeleccionada){

    carnetBloqueado = true;


    mostrarResultado(

      "⚠️<div class='jugador'>SELECCIONE UNA ACTIVIDAD</div>"+
      "Primero seleccione y confirme la actividad.",

      "diagnostico"

    );


    setTimeout(function(){

      carnetBloqueado = false;

    },TIEMPO_ENTRE_ESCANEOS);


    return;

  }


  registrarJugadorEnActividad(texto);

}


/* =================================================
   REGISTRAR JUGADOR
================================================= */

function registrarJugadorEnActividad(documento){

  if(!actividadSeleccionada){

    mostrarResultado(

      "⚠️<div class='jugador'>NO HAY ACTIVIDAD SELECCIONADA</div>",

      "error"

    );

    return;

  }


  carnetBloqueado = true;


  mostrarResultado(

    "🔎<div class='jugador'>QR DETECTADO</div>"+

    "<strong>Documento:</strong> "+
    escaparHTML(documento)+

    "<br><br>"+
    "⏳ Procesando asistencia...",

    "diagnostico"

  );


  document.getElementById("estadoLector")
    .innerHTML =
    "🟡 PROCESANDO CARNET...";


  contadorJSONP++;


  const callback =
    "bufalosAsistencia_"+
    Date.now()+
    "_"+
    contadorJSONP;


  let terminado = false;

  let script = null;


  const limpiar = () =>
    limpiarJSONP(
      callback,
      script
    );


  window[callback] = function(r){

    if(terminado)return;

    terminado = true;


    try{

      if(!r){

        mostrarErrorRespuesta();

        return;

      }


      procesarRespuestaAsistencia(
        r,
        documento
      );

    }finally{

      limpiar();

    }

  };


  script =
    document.createElement("script");


  script.src =
    APPS_SCRIPT_URL+
    "?accion=registrarAsistenciaActividad"+
    "&documento="+
    encodeURIComponent(documento)+
    "&id="+
    encodeURIComponent(
      actividadSeleccionada.actividadId
    )+
    "&callback="+
    encodeURIComponent(callback)+
    "&_="+
    Date.now();


  script.onerror = function(){

    if(terminado)return;

    terminado = true;


    mostrarResultado(

      "❌<div class='jugador'>NO SE RECIBIÓ CONFIRMACIÓN</div>"+
      "El navegador no recibió respuesta del servidor."+
      "<br><br>"+
      "Por seguridad, el lector fue detenido.",

      "error"

    );


    detenerLector();

    limpiar();

  };


  script._bufalosTimeout =
    setTimeout(function(){

      if(terminado)return;

      terminado = true;


      mostrarResultado(

        "⚠️<div class='jugador'>SIN CONFIRMACIÓN</div>"+
        "El sistema tardó demasiado en responder."+
        "<br><br>"+
        "Por seguridad, el lector fue detenido."+
        "<br>"+
        "Revise la hoja Asistencia antes de continuar.",

        "error"

      );


      detenerLector();

      limpiar();

    },15000);


  document.body.appendChild(script);

}


/* =================================================
   RESPUESTA ASISTENCIA
================================================= */

function procesarRespuestaAsistencia(
  r,
  documento
){

  const estado =
    String(
      r.estado || ""
    ).toUpperCase();


  if(
    r.ok === true &&
    estado === "REGISTRADO"
  ){

    escaneosRegistrados++;


    document.getElementById("contador")
      .innerHTML =
      "Registros confirmados: "+
      escaneosRegistrados;


    const j =
      r.jugador || {};


    const nombre =
      j.nombre ||
      r.nombre ||
      "";


    mostrarResultado(

      "🟢<div class='jugador'>ASISTENCIA REGISTRADA</div>"+

      (
        nombre
          ?
          "<strong>"+
          escaparHTML(nombre)+
          "</strong><br><br>"
          :
          ""
      )+

      "<strong>Documento:</strong> "+
      escaparHTML(documento)+

      "<br><br>"+

      "<strong>Actividad:</strong> "+
      escaparHTML(
        actividadSeleccionada.actividad
      ),

      "exito"

    );


    prepararSiguienteEscaneo();

    return;

  }


  if(
    r.duplicado === true ||
    estado === "DUPLICADO"
  ){

    const n =
      r.nombre ||
      (
        r.jugador &&
        r.jugador.nombre
      ) ||
      "";


    mostrarResultado(

      "🟡<div class='jugador'>DUPLICADO</div>"+

      (
        n
          ?
          "<strong>"+
          escaparHTML(n)+
          "</strong><br><br>"
          :
          ""
      )+

      escaparHTML(
        r.mensaje ||
        "Este jugador ya tiene registrada la asistencia para esta actividad."
      ),

      "duplicado"

    );


    prepararSiguienteEscaneo();

    return;

  }


  if(
    estado === "NO_ENCONTRADO"
  ){

    mostrarResultado(

      "🔴<div class='jugador'>JUGADOR NO ENCONTRADO</div>"+

      "<strong>Documento:</strong> "+
      escaparHTML(documento)+

      "<br><br>"+

      escaparHTML(
        r.mensaje ||
        "No existe un jugador con este documento."
      ),

      "error"

    );


    prepararSiguienteEscaneo();

    return;

  }


  mostrarResultado(

    "❌<div class='jugador'>ERROR EN EL REGISTRO</div>"+

    escaparHTML(
      r.mensaje ||
      "El sistema devolvió una respuesta inesperada."
    )+

    "<br><br>"+
    "Por seguridad, el lector fue detenido.",

    "error"

  );


  detenerLector();

}


/* =================================================
   SIGUIENTE ESCANEO
================================================= */

function prepararSiguienteEscaneo(){

  if(!lectorActivo)return;


  document.getElementById("estadoLector")
    .innerHTML =
    "🟢 REGISTRO PROCESADO — PREPARE SIGUIENTE CARNET";


  setTimeout(function(){

    if(!lectorActivo)return;


    carnetBloqueado = false;


    mostrarResultado(
      "",
      "oculto"
    );


    document.getElementById("estadoLector")
      .innerHTML =
      "🟢 LECTOR ACTIVO — ESCANEE SIGUIENTE CARNET";

  },TIEMPO_ENTRE_ESCANEOS);

}


/* =================================================
   CAMBIAR ACTIVIDAD
================================================= */

async function cambiarActividad(){

  if(lectorActivo){

    try{

      if(html5QrCode)
        await html5QrCode.stop();

    }catch(e){

      console.error(e);

    }

  }


  lectorActivo = false;

  carnetBloqueado = false;

  actividadSeleccionada = null;

  actividadIndiceSeleccionada = -1;


  document.getElementById("btnIniciar")
    .disabled = true;


  document.getElementById("btnDetener")
    .disabled = true;


  document.getElementById("btnCambiar")
    .classList.add("oculto");


  document.getElementById("actividadSeleccionada")
    .classList.add("oculto");


  document.getElementById("panelActividades")
    .classList.remove("oculto");


  document.getElementById("estadoLector")
    .innerHTML =
    "🟡 CARGANDO ACTIVIDADES...";


  mostrarResultado(
    "",
    "oculto"
  );


  cargarActividades();

}


/* =================================================
   ERROR ACTIVIDADES
================================================= */

function mostrarErrorActividades(mensaje){

  consultandoActividades = false;


  document.getElementById("selectorActividades")
    .innerHTML =

    "<div class='resultado error'>"+

    "❌<div class='jugador'>"+

}


/* =================================================
   QR ACTIVIDAD
================================================= */

function extraerActividadDesdeQR(texto){

  try{

    const u =
      new URL(texto);


    const accion =
      String(
        u.searchParams.get(
          "accion"
        ) ||
        ""
      )
      .trim()
      .toLowerCase();


    const id =
      String(
        u.searchParams.get(
          "id"
        ) ||
        ""
      )
      .trim();


    if(
      accion !== "actividadqr" ||
      !id
    )
      return null;


    return {
      actividadId:id
    };


  }catch(e){

    return null;

  }

}

/* =================================================
   JSONP
================================================= */

function limpiarJSONP(
  callback,
  script
){

  try{

    if(
      script &&
      script._bufalosTimeout
    ){

      clearTimeout(
        script._bufalosTimeout
      );

    }

  }catch(e){}


  try{

    if(
      script &&
      script.parentNode
    ){

      script.parentNode.removeChild(
        script
      );

    }

  }catch(e){}


  try{

    delete window[callback];

  }catch(e){

    window[callback] =
      undefined;

  }

}


/* =================================================
   RESULTADO
================================================= */

function mostrarResultado(
  contenido,
  tipo
){

  const e =
    document.getElementById(
      "resultado"
    );


  e.className =
    "resultado "+
    tipo;


  e.innerHTML =
    contenido;


  if(tipo === "oculto"){

    e.classList.add(
      "oculto"
    );

  }else{

    e.classList.remove(
      "oculto"
    );

  }

}


/* =================================================
   SEGURIDAD HTML
================================================= */

function escaparHTML(texto){

  const d =
    document.createElement(
      "div"
    );


  d.textContent =
    String(
      texto || ""
    );


  return d.innerHTML;

}
