<!DOCTYPE html>
<html>
<head>
  <base target="_top">

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>BÚFALOS FC - Lector QR</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .contenedor {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .panel {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.10);
    }

    button {
      width: 100%;
      padding: 13px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      margin-bottom: 12px;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-iniciar {
      background: #198754;
      color: white;
    }

    .btn-detener {
      background: #dc3545;
      color: white;
    }

    .btn-cambiar {
      background: #0d6efd;
      color: white;
    }

    .btn-secundario {
      background: #6c757d;
      color: white;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 15px auto;
    }

    .estado {
      text-align: center;
      font-weight: bold;
      padding: 12px;
      border-radius: 8px;
      margin-top: 10px;
      background: #eee;
    }

    .actividad {
      border: 2px solid #198754;
      background: #f1f8f4;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 15px;
    }

    .actividad-titulo {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 14px;
    }

    .actividad-dato {
      padding: 7px 0;
      border-bottom: 1px solid #ddd;
    }

    .actividad-dato:last-child {
      border-bottom: none;
    }

    .actividad-label {
      font-weight: bold;
    }

    .actividad-valor {
      margin-left: 5px;
    }

    .resultado {
      text-align: center;
      padding: 20px;
      border-radius: 12px;
      margin-top: 15px;
      font-size: 18px;
      line-height: 1.5;
    }

    .diagnostico {
      background: #fff3cd;
      color: #664d03;
    }

    .exito {
      background: #d1e7dd;
      color: #0f5132;
    }

    .error {
      background: #f8d7da;
      color: #842029;
    }

    .duplicado {
      background: #fff3cd;
      color: #664d03;
    }

    .jugador {
      font-size: 24px;
      font-weight: bold;
      margin: 10px 0;
    }

    .contador {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      margin-top: 10px;
    }

    .modo {
      text-align: center;
      font-weight: bold;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 12px;
      background: #e9ecef;
    }

    .modo-actividad {
      background: #cff4fc;
      color: #055160;
    }

    .modo-jugadores {
      background: #d1e7dd;
      color: #0f5132;
    }

    .oculto {
      display: none !important;
    }

  </style>

</head>

<body>

<div class="contenedor">

  <h1>⚽ BÚFALOS FC</h1>

  <div class="panel">

    <div
      id="modoLector"
      class="modo modo-actividad">

      📋 PRIMERO ESCANEE EL QR GENERAL DE LA ACTIVIDAD

    </div>


    <div
      id="actividadSeleccionada"
      class="actividad oculto">

      <div class="actividad-titulo">
        ✅ ACTIVIDAD SELECCIONADA
      </div>

      <div class="actividad-dato">
        <span class="actividad-label">
          📅 Fecha:
        </span>

        <span
          id="actividadFecha"
          class="actividad-valor">
        </span>
      </div>

      <div class="actividad-dato">
        <span class="actividad-label">
          🕐 Hora:
        </span>

        <span
          id="actividadHora"
          class="actividad-valor">
        </span>
      </div>

      <div class="actividad-dato">
        <span class="actividad-label">
          ⚽ Actividad:
        </span>

        <span
          id="actividadNombre"
          class="actividad-valor">
        </span>
      </div>

      <div class="actividad-dato">
        <span class="actividad-label">
          📌 Tipo:
        </span>

        <span
          id="actividadTipo"
          class="actividad-valor">
        </span>
      </div>

      <div class="actividad-dato">
        <span class="actividad-label">
          🔵 Estado:
        </span>

        <span
          id="actividadEstado"
          class="actividad-valor">
        </span>
      </div>

    </div>


    <button
      class="btn-cambiar oculto"
      id="btnCambiarActividad"
      onclick="cambiarActividad()">

      🔄 CAMBIAR ACTIVIDAD

    </button>


    <button
      class="btn-iniciar"
      id="btnIniciar"
      onclick="iniciarLector()">

      📷 INICIAR LECTOR

    </button>


    <button
      class="btn-detener"
      id="btnDetener"
      onclick="detenerLector()"
      disabled>

      ⛔ DETENER LECTOR

    </button>

  </div>


  <div class="panel">

    <div id="reader"></div>

    <div
      id="estadoLector"
      class="estado">

      🔴 LECTOR DETENIDO

    </div>


    <div
      id="contador"
      class="contador">

      Registros confirmados: 0

    </div>

  </div>


  <div
    id="resultado"
    class="resultado oculto">
  </div>

</div>


<script>

/* =========================================================
   CONFIGURACIÓN
========================================================= */

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbwMw4Lbn8xo9JqZCpd7wJ_6cwNy-nswbErwbhkPWK2y26_ZwtVYZ9p1n2rrHsf60hs/exec";


const TIEMPO_ENTRE_ESCANEOS = 2000;


/* =========================================================
   VARIABLES PRINCIPALES
========================================================= */

let html5QrCode = null;

let lectorActivo = false;

let carnetBloqueado = false;

let escaneosRegistrados = 0;

let contadorJSONP = 0;


/*
 * Actividad actualmente seleccionada.
 *
 * Cuando es null, el lector está esperando
 * un QR GENERAL.
 */
let actividadSeleccionada = null;


/*
 * Modo actual del lector:
 *
 * ACTIVIDAD = esperando QR GENERAL
 * JUGADORES = esperando carnets
 */
let modoLector = "ACTIVIDAD";


/* =========================================================
   INICIAR LECTOR
========================================================= */

async function iniciarLector() {

  if (lectorActivo) {

    return;

  }


  try {

    document.getElementById("estadoLector").innerHTML =
      "🟡 INICIANDO CÁMARA...";


    html5QrCode =
      new Html5Qrcode("reader");


    const cameras =
      await Html5Qrcode.getCameras();


    if (!cameras || cameras.length === 0) {

      throw new Error(
        "No se encontró ninguna cámara."
      );

    }


    let camaraSeleccionada =
      cameras[0].id;


    const camaraTrasera =
      cameras.find(function(camara) {

        const nombre =
          String(camara.label || "").toLowerCase();

        return (
          nombre.includes("back") ||
          nombre.includes("rear") ||
          nombre.includes("trasera") ||
          nombre.includes("environment")
        );

      });


    if (camaraTrasera) {

      camaraSeleccionada =
        camaraTrasera.id;

    }


    await html5QrCode.start(

      camaraSeleccionada,

      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        },

        aspectRatio: 1.0,

        rememberLastUsedCamera: true
      },

      procesarQR,

      function(errorMessage) {

        /*
         * Los errores normales de lectura
         * se ignoran.
         */

      }

    );


    lectorActivo = true;

    carnetBloqueado = false;


    document.getElementById("btnIniciar").disabled =
      true;

    document.getElementById("btnDetener").disabled =
      false;


    actualizarEstadoInicial();


    mostrarResultado(
      "",
      "oculto"
    );


    console.log(
      "LECTOR CONTINUO INICIADO CORRECTAMENTE"
    );

  } catch(error) {

    console.error(
      "ERROR INICIANDO LECTOR:",
      error
    );


    lectorActivo = false;

    carnetBloqueado = false;


    document.getElementById("btnIniciar").disabled =
      false;

    document.getElementById("btnDetener").disabled =
      true;


    document.getElementById("estadoLector").innerHTML =
      "❌ NO SE PUDO INICIAR LA CÁMARA";


    mostrarResultado(

      "❌ " +
      escaparHTML(
        error.message ||
        "Error desconocido."
      ),

      "error"

    );

  }

}


/* =========================================================
   ACTUALIZAR ESTADO INICIAL
========================================================= */

function actualizarEstadoInicial() {

  if (!lectorActivo) {

    return;

  }


  if (actividadSeleccionada) {

    document.getElementById("modoLector").className =
      "modo modo-jugadores";


    document.getElementById("modoLector").innerHTML =
      "👤 LECTOR DE CARNETS — ESCANEE UN JUGADOR";


    document.getElementById("estadoLector").innerHTML =
      "🟢 LECTOR ACTIVO — ESCANEE UN CARNET";


    document.getElementById("btnCambiarActividad")
      .classList.remove("oculto");


  } else {

    document.getElementById("modoLector").className =
      "modo modo-actividad";


    document.getElementById("modoLector").innerHTML =
      "📋 ESCANEE EL QR GENERAL DE LA ACTIVIDAD";


    document.getElementById("estadoLector").innerHTML =
      "🟢 LECTOR ACTIVO — ESCANEE EL QR GENERAL";


    document.getElementById("btnCambiarActividad")
      .classList.add("oculto");

  }

}


/* =========================================================
   DETENER LECTOR MANUALMENTE
========================================================= */

async function detenerLector() {

  try {

    if (html5QrCode && lectorActivo) {

      await html5QrCode.stop();

    }

  } catch(error) {

    console.error(
      "ERROR DETENIENDO LECTOR:",
      error
    );

  }


  lectorActivo = false;

  carnetBloqueado = false;


  document.getElementById("btnIniciar").disabled =
    false;

  document.getElementById("btnDetener").disabled =
    true;


  document.getElementById("estadoLector").innerHTML =
    "🔴 LECTOR DETENIDO";


  mostrarResultado(
    "",
    "oculto"
  );


  console.log(
    "LECTOR DETENIDO MANUALMENTE"
  );

}


/* =========================================================
   PROCESAR CUALQUIER QR
========================================================= */

function procesarQR(decodedText) {

  if (carnetBloqueado) {

    console.log(
      "QR IGNORADO: PROCESANDO LECTURA ANTERIOR"
    );

    return;

  }


  if (!lectorActivo) {

    return;

  }


  const texto =
    String(decodedText || "").trim();


  if (!texto) {

    return;

  }


  /*
   * BLOQUEAMOS INMEDIATAMENTE.
   */
  carnetBloqueado = true;


  console.log(
    "================================"
  );

  console.log(
    "QR DETECTADO:",
    texto
  );

  console.log(
    "MODO:",
    modoLector
  );

  console.log(
    "================================"
  );


  /*
   * =======================================================
   * MODO ACTIVIDAD
   * =======================================================
   *
   * El primer QR debe ser el QR GENERAL.
   */

  if (!actividadSeleccionada) {

    const actividadQR =
      extraerActividadDesdeQR(texto);


    if (!actividadQR) {

      mostrarResultado(

        "⚠️" +

        "<div class='jugador'>" +
        "QR NO VÁLIDO" +
        "</div>" +

        "Primero debe escanear el " +
        "<strong>QR GENERAL DE LA ACTIVIDAD</strong>.",

        "error"

      );


      prepararSiguienteEscaneoActividad();

      return;

    }


    mostrarResultado(

      "🔎" +

      "<div class='jugador'>" +
      "QR GENERAL DETECTADO" +
      "</div>" +

      "<strong>ActividadID:</strong> " +

      escaparHTML(
        actividadQR.id
      ) +

      "<br><br>" +

      "⏳ Consultando actividad...",

      "diagnostico"

    );


    document.getElementById("estadoLector").innerHTML =
      "🟡 CONSULTANDO ACTIVIDAD...";


    procesarQRActividad(
      actividadQR.id
    );


    return;

  }


  /*
   * =======================================================
   * MODO JUGADORES
   * =======================================================
   *
   * Desde este punto cualquier QR válido
   * se interpreta como Documento.
   */

  registrarJugadorEnActividad(texto);

}


/* =========================================================
   EXTRAER ACTIVIDAD DESDE QR GENERAL
========================================================= */

function extraerActividadDesdeQR(texto) {

  try {

    const url =
      new URL(texto);


    const accion =
      String(
        url.searchParams.get("accion") || ""
      ).trim();


    const id =
      String(
        url.searchParams.get("id") || ""
      ).trim();


    if (
      accion !== "actividadQR" ||
      !id
    ) {

      return null;

    }


    return {
      id: id
    };

  } catch(error) {

    /*
     * Si el QR no contiene una URL válida,
     * no es un QR GENERAL.
     */

    return null;

  }

}


/* =========================================================
   CONSULTAR ACTIVIDAD
========================================================= */

function procesarQRActividad(
  actividadId
) {

  console.log(
    "CONSULTANDO ACTIVIDAD:",
    actividadId
  );


  contadorJSONP++;


  const callback =
    "bufalosActividad_" +
    Date.now() +
    "_" +
    contadorJSONP;


  let terminado = false;


  const script =
    document.createElement("script");


  window[callback] =
    function(respuesta) {

      if (terminado) {

        return;

      }


      terminado = true;


      console.log(
        "RESPUESTA ACTIVIDAD:",
        respuesta
      );


      try {

        if (!respuesta) {

          mostrarErrorActividad();

          return;

        }


        procesarRespuestaActividad(
          respuesta
        );

      } finally {

        limpiarJSONP(
          callback,
          script
        );

      }

    };


  script.src =
    APPS_SCRIPT_URL +

    "?accion=actividadQR" +

    "&id=" +
    encodeURIComponent(actividadId) +

    "&callback=" +
    encodeURIComponent(callback) +

    "&_=" +
    Date.now();


  script.onerror =
    function() {

      if (terminado) {

        return;

      }


      terminado = true;


      console.error(
        "ERROR CONSULTANDO ACTIVIDAD"
      );


      mostrarResultado(

        "❌" +

        "<div class='jugador'>" +
        "NO SE PUDO CONSULTAR LA ACTIVIDAD" +
        "</div>" +

        "No se recibió confirmación del sistema.",

        "error"

      );


      document.getElementById("estadoLector").innerHTML =
        "🔴 ERROR CONSULTANDO ACTIVIDAD";


      detenerLector();


      limpiarJSONP(
        callback,
        script
      );

    };


  const temporizador =
    setTimeout(function() {

      if (terminado) {

        return;

      }


      terminado = true;


      console.error(
        "TIMEOUT CONSULTANDO ACTIVIDAD"
      );


      mostrarResultado(

        "⚠️" +

        "<div class='jugador'>" +
        "SIN RESPUESTA" +
        "</div>" +

        "El sistema tardó demasiado en responder." +

        "<br><br>" +

        "Por seguridad, el lector fue detenido.",

        "error"

      );


      detenerLector();


      limpiarJSONP(
        callback,
        script
      );

    }, 15000);


  script._bufalosTimeout =
    temporizador;


  document.body.appendChild(script);

}


/* =========================================================
   PROCESAR RESPUESTA ACTIVIDAD
========================================================= */

function procesarRespuestaActividad(
  respuesta
) {

  const estado =
    String(
      respuesta.estado || ""
    ).toUpperCase();


  /*
   * =======================================================
   * ACTIVIDAD ENCONTRADA
   * =======================================================
   */

  if (
    respuesta.ok === true &&
    (
      estado === "OK" ||
      estado === "ACTIVA" ||
      estado === "ENCONTRADA" ||
      respuesta.actividad
    )
  ) {

    seleccionarActividad(
      respuesta
    );

    return;

  }


  /*
   * =======================================================
   * ACTIVIDAD NO ENCONTRADA
   * =======================================================
   */

  if (
    estado === "NO_ENCONTRADO" ||
    estado === "NO ENCONTRADA"
  ) {

    mostrarResultado(

      "🔴" +

      "<div class='jugador'>" +
      "ACTIVIDAD NO ENCONTRADA" +
      "</div>" +

      escaparHTML(
        respuesta.mensaje ||
        "No existe la actividad indicada por este QR."
      ),

      "error"

    );


    prepararSiguienteEscaneoActividad();

    return;

  }


  /*
   * =======================================================
   * ACTIVIDAD CERRADA / INACTIVA
   * =======================================================
   */

  if (
    estado === "CERRADA" ||
    estado === "INACTIVA" ||
    estado === "FINALIZADA"
  ) {

    mostrarResultado(

      "⚠️" +

      "<div class='jugador'>" +
      "ACTIVIDAD NO DISPONIBLE" +
      "</div>" +

      escaparHTML(
        respuesta.mensaje ||
        "La actividad no está disponible para registrar asistencia."
      ),

      "duplicado"

    );


    prepararSiguienteEscaneoActividad();

    return;

  }


  /*
   * =======================================================
   * ERROR DESCONOCIDO
   * =======================================================
   */

  mostrarResultado(

    "❌" +

    "<div class='jugador'>" +
    "ERROR CONSULTANDO ACTIVIDAD" +
    "</div>" +

    escaparHTML(
      respuesta.mensaje ||
      "El sistema devolvió una respuesta inesperada."
    ),

    "error"

  );


  detenerLector();

}


/* =========================================================
   SELECCIONAR ACTIVIDAD
========================================================= */

function seleccionarActividad(
  respuesta
) {

  const actividad =
    respuesta.actividad || {};


  actividadSeleccionada = {

    actividadId:
      String(
        respuesta.actividadId ||
        actividad.actividadId ||
        respuesta.id ||
        actividad.id ||
        ""
      ).trim(),

    actividad:
      String(
        respuesta.nombre ||
        respuesta.actividadNombre ||
        actividad.nombre ||
        actividad.actividad ||
        respuesta.actividad ||
        ""
      ).trim(),

    tipo:
      String(
        respuesta.tipo ||
        actividad.tipo ||
        ""
      ).trim(),

    fecha:
      String(
        respuesta.fecha ||
        actividad.fecha ||
        ""
      ).trim(),

    hora:
      String(
        respuesta.hora ||
        actividad.hora ||
        ""
      ).trim(),

    estado:
      String(
        respuesta.estado ||
        actividad.estado ||
        "ACTIVA"
      ).trim()

  };


  /*
   * Si por alguna razón no llegó ActividadID,
   * detenemos para evitar registros incorrectos.
   */

  if (!actividadSeleccionada.actividadId) {

    actividadSeleccionada = null;


    mostrarResultado(

      "❌" +

      "<div class='jugador'>" +
      "ACTIVIDAD INVÁLIDA" +
      "</div>" +

      "El QR fue leído, pero el sistema no devolvió un " +
      "<strong>ActividadID</strong> válido.",

      "error"

    );


    detenerLector();

    return;

  }


  modoLector = "JUGADORES";


  mostrarActividadSeleccionada();


  document.getElementById("btnCambiarActividad")
    .classList.remove("oculto");


  document.getElementById("modoLector").className =
    "modo modo-jugadores";


  document.getElementById("modoLector").innerHTML =
    "👤 LECTOR DE CARNETS — ACTIVIDAD SELECCIONADA";


  document.getElementById("estadoLector").innerHTML =
    "🟢 LECTOR ACTIVO — ESCANEE UN CARNET";


  mostrarResultado(

    "🟢" +

    "<div class='jugador'>" +
    "ACTIVIDAD LISTA" +
    "</div>" +

    (
      actividadSeleccionada.actividad
        ? "<strong>" +
          escaparHTML(
            actividadSeleccionada.actividad
          ) +
          "</strong><br><br>"
        : ""
    ) +

    "Ya puede comenzar a escanear los carnets.",

    "exito"

  );


  carnetBloqueado = false;


  console.log(
    "ACTIVIDAD SELECCIONADA:",
    actividadSeleccionada
  );

}


/* =========================================================
   MOSTRAR ACTIVIDAD SELECCIONADA
========================================================= */

function mostrarActividadSeleccionada() {

  const panel =
    document.getElementById(
      "actividadSeleccionada"
    );


  document.getElementById(
    "actividadFecha"
  ).textContent =
    actividadSeleccionada.fecha || "—";


  document.getElementById(
    "actividadHora"
  ).textContent =
    actividadSeleccionada.hora || "—";


  document.getElementById(
    "actividadNombre"
  ).textContent =
    actividadSeleccionada.actividad || "—";


  document.getElementById(
    "actividadTipo"
  ).textContent =
    actividadSeleccionada.tipo || "—";


  document.getElementById(
    "actividadEstado"
  ).textContent =
    actividadSeleccionada.estado || "—";


  panel.classList.remove(
    "oculto"
  );

}


/* =========================================================
   REGISTRAR JUGADOR EN ACTIVIDAD
========================================================= */

function registrarJugadorEnActividad(
  documento
) {

  if (!actividadSeleccionada) {

    carnetBloqueado = false;

    return;

  }


  documento =
    String(
      documento || ""
    ).trim();


  if (!documento) {

    carnetBloqueado = false;

    return;

  }


  mostrarResultado(

    "🔎" +

    "<div class='jugador'>" +
    "CARNET DETECTADO" +
    "</div>" +

    "<strong>Documento:</strong> " +

    escaparHTML(
      documento
    ) +

    "<br><br>" +

    "⏳ Registrando asistencia...",

    "diagnostico"

  );


  document.getElementById("estadoLector").innerHTML =
    "🟡 PROCESANDO CARNET...";


  console.log(
    "REGISTRANDO JUGADOR:",
    documento
  );


  console.log(
    "ACTIVIDAD:",
    actividadSeleccionada.actividadId
  );


  enviarRegistroActividad(
    documento,
    actividadSeleccionada.actividadId
  );

}


/* =========================================================
   ENVIAR REGISTRO DE JUGADOR
========================================================= */

function enviarRegistroActividad(
  documento,
  actividadId
) {

  contadorJSONP++;


  const callback =
    "bufalosAsistencia_" +
    Date.now() +
    "_" +
    contadorJSONP;


  let terminado = false;


  const script =
    document.createElement("script");


  window[callback] =
    function(respuesta) {

      if (terminado) {

        return;

      }


      terminado = true;


      console.log(
        "RESPUESTA ASISTENCIA:",
        respuesta
      );


      try {

        if (!respuesta) {

          mostrarErrorRespuesta();

          return;

        }


        procesarRespuestaAsistencia(
          respuesta,
          documento
        );

      } finally {

        limpiarJSONP(
          callback,
          script
        );

      }

    };


  script.src =
    APPS_SCRIPT_URL +

    "?accion=registrarAsistenciaActividad" +

    "&documento=" +
    encodeURIComponent(documento) +

    "&id=" +
    encodeURIComponent(actividadId) +

    "&callback=" +
    encodeURIComponent(callback) +

    "&_=" +
    Date.now();


  script.onerror =
    function() {

      if (terminado) {

        return;

      }


      terminado = true;


      console.error(
        "ERROR RECIBIENDO RESPUESTA DEL SERVIDOR"
      );


      mostrarResultado(

        "❌" +

        "<div class='jugador'>" +
        "NO SE RECIBIÓ CONFIRMACIÓN" +
        "</div>" +

        "El registro pudo haberse enviado," +

        "<br>" +

        "pero el navegador no recibió la respuesta del sistema.",

        "error"

      );


      document.getElementById("estadoLector").innerHTML =
        "🔴 LECTOR DETENIDO — REVISE EL REGISTRO";


      detenerLector();


      limpiarJSONP(
        callback,
        script
      );

    };


  const temporizador =
    setTimeout(function() {

      if (terminado) {

        return;

      }


      terminado = true;


      console.error(
        "TIEMPO DE ESPERA AGOTADO"
      );


      mostrarResultado(

        "⚠️" +

        "<div class='jugador'>" +
        "SIN CONFIRMACIÓN" +
        "</div>" +

        "El sistema tardó demasiado en responder." +

        "<br><br>" +

        "Por seguridad, el lector fue detenido." +

        "<br>" +

        "Revise la hoja Asistencia antes de continuar.",

        "error"

      );


      detenerLector();


      limpiarJSONP(
        callback,
        script
      );

    }, 15000);


  script._bufalosTimeout =
    temporizador;


  document.body.appendChild(script);

}


/* =========================================================
   PROCESAR RESPUESTA ASISTENCIA
========================================================= */

function procesarRespuestaAsistencia(
  respuesta,
  documento
) {

  const estado =
    String(
      respuesta.estado || ""
    ).toUpperCase();


  /*
   * =======================================================
   * REGISTRO NUEVO
   * =======================================================
   */

  if (
    respuesta.ok === true &&
    estado === "REGISTRADO"
  ) {

    escaneosRegistrados++;


    document.getElementById("contador").innerHTML =
      "Registros confirmados: " +
      escaneosRegistrados;


    const jugador =
      respuesta.jugador || {};


    const nombre =
      respuesta.nombre ||
      jugador.nombre ||
      "";


    mostrarResultado(

      "🟢" +

      "<div class='jugador'>" +
      "ASISTENCIA REGISTRADA" +
      "</div>" +

      (
        nombre
          ? "<strong>" +
            escaparHTML(nombre) +
            "</strong><br><br>"
          : ""
      ) +

      "<strong>Documento:</strong> " +

      escaparHTML(
        documento
      ) +

      "<br><br>" +

      (
        actividadSeleccionada.actividad
          ? "<strong>Actividad:</strong> " +
            escaparHTML(
              actividadSeleccionada.actividad
            ) +
            "<br><br>"
          : ""
      ) +

      "El sistema BÚFALOS FC confirmó el registro.",

      "exito"

    );


    prepararSiguienteEscaneo();


    return;

  }


  /*
   * =======================================================
   * DUPLICADO
   * =======================================================
   */

  if (
    respuesta.duplicado === true ||
    estado === "DUPLICADO"
  ) {

    const jugador =
      respuesta.jugador || {};


    const nombre =
      respuesta.nombre ||
      jugador.nombre ||
      "";


    mostrarResultado(

      "🟡" +

      "<div class='jugador'>" +
      "DUPLICADO" +
      "</div>" +

      (
        nombre
          ? "<strong>" +
            escaparHTML(nombre) +
            "</strong><br><br>"
          : ""
      ) +

      escaparHTML(
        respuesta.mensaje ||
        "Este jugador ya tiene registrada asistencia para esta actividad."
      ),

      "duplicado"

    );


    prepararSiguienteEscaneo();


    return;

  }


  /*
   * =======================================================
   * JUGADOR NO ENCONTRADO
   * =======================================================
   */

  if (
    estado === "NO_ENCONTRADO"
  ) {

    mostrarResultado(

      "🔴" +

      "<div class='jugador'>" +
      "JUGADOR NO ENCONTRADO" +
      "</div>" +

      "<strong>Documento:</strong> " +

      escaparHTML(
        documento
      ) +

      "<br><br>" +

      escaparHTML(
        respuesta.mensaje ||
        "No existe un jugador con este documento."
      ),

      "error"

    );


    prepararSiguienteEscaneo();


    return;

  }


  /*
   * =======================================================
   * ACTIVIDAD NO ENCONTRADA
   * =======================================================
   */

  if (
    estado === "ACTIVIDAD_NO_ENCONTRADA" ||
    estado === "ACTIVIDAD_INEXISTENTE"
  ) {

    mostrarResultado(

      "🔴" +

      "<div class='jugador'>" +
      "ACTIVIDAD NO ENCONTRADA" +
      "</div>" +

      escaparHTML(
        respuesta.mensaje ||
        "La actividad ya no existe."
      ),

      "error"

    );


    actividadSeleccionada = null;

    actualizarActividadVisual();


    prepararSiguienteEscaneoActividad();


    return;

  }


  /*
   * =======================================================
   * ERROR DESCONOCIDO
   * =======================================================
   */

  mostrarResultado(

    "❌" +

    "<div class='jugador'>" +
    "ERROR EN EL REGISTRO" +
    "</div>" +

    escaparHTML(
      respuesta.mensaje ||
      "El sistema devolvió una respuesta inesperada."
    ) +

    "<br><br>" +

    "Por seguridad, el lector fue detenido.",

    "error"

  );


  detenerLector();

}


/* =========================================================
   PREPARAR SIGUIENTE CARNET
========================================================= */

function prepararSiguienteEscaneo() {

  if (!lectorActivo) {

    return;

  }


  document.getElementById("estadoLector").innerHTML =
    "🟢 LECTOR ACTIVO — PREPARE EL SIGUIENTE CARNET";


  setTimeout(function() {

    if (!lectorActivo) {

      return;

    }


    carnetBloqueado = false;


    mostrarResultado(
      "",
      "oculto"
    );


    document.getElementById("estadoLector").innerHTML =
      "🟢 LECTOR ACTIVO — ESCANEE EL SIGUIENTE CARNET";


    console.log(
      "LECTOR DESBLOQUEADO — LISTO PARA SIGUIENTE CARNET"
    );

  }, TIEMPO_ENTRE_ESCANEOS);

}


/* =========================================================
   PREPARAR SIGUIENTE QR GENERAL
========================================================= */

function prepararSiguienteEscaneoActividad() {

  if (!lectorActivo) {

    return;

  }


  document.getElementById("estadoLector").innerHTML =
    "🟢 LECTOR ACTIVO — ESCANEE EL QR GENERAL";


  setTimeout(function() {

    if (!lectorActivo) {

      return;

    }


    carnetBloqueado = false;


    mostrarResultado(
      "",
      "oculto"
    );


    document.getElementById("estadoLector").innerHTML =
      "🟢 LECTOR ACTIVO — ESCANEE EL QR GENERAL";


    console.log(
      "LECTOR LISTO PARA OTRO QR GENERAL"
    );

  }, TIEMPO_ENTRE_ESCANEOS);

}


/* =========================================================
   CAMBIAR ACTIVIDAD
========================================================= */

function cambiarActividad() {

  /*
   * No apagamos la cámara.
   *
   * Simplemente eliminamos la actividad seleccionada
   * y regresamos al modo QR GENERAL.
   */

  actividadSeleccionada = null;

  modoLector = "ACTIVIDAD";

  carnetBloqueado = false;


  actualizarActividadVisual();


  document.getElementById("modoLector").className =
    "modo modo-actividad";


  document.getElementById("modoLector").innerHTML =
    "📋 ESCANEE EL QR GENERAL DE LA ACTIVIDAD";


  if (lectorActivo) {

    document.getElementById("estadoLector").innerHTML =
      "🟢 LECTOR ACTIVO — ESCANEE EL QR GENERAL";

  }


  mostrarResultado(

    "🔄" +

    "<div class='jugador'>" +
    "ACTIVIDAD CAMBIADA" +
    "</div>" +

    "Ahora escanee el QR GENERAL de la nueva actividad.",

    "diagnostico"

  );


  document.getElementById("btnCambiarActividad")
    .classList.add("oculto");


  console.log(
    "ACTIVIDAD ELIMINADA — ESPERANDO NUEVO QR GENERAL"
  );

}


/* =========================================================
   ACTUALIZAR VISUAL ACTIVIDAD
========================================================= */

function actualizarActividadVisual() {

  const panel =
    document.getElementById(
      "actividadSeleccionada"
    );


  panel.classList.add(
    "oculto"
  );


  document.getElementById(
    "actividadFecha"
  ).textContent = "";


  document.getElementById(
    "actividadHora"
  ).textContent = "";


  document.getElementById(
    "actividadNombre"
  ).textContent = "";


  document.getElementById(
    "actividadTipo"
  ).textContent = "";


  document.getElementById(
    "actividadEstado"
  ).textContent = "";

}


/* =========================================================
   ERROR ACTIVIDAD
========================================================= */

function mostrarErrorActividad() {

  mostrarResultado(

    "❌" +

    "<div class='jugador'>" +
    "NO SE RECIBIÓ CONFIRMACIÓN" +
    "</div>" +

    "El servidor no devolvió una respuesta válida." +

    "<br><br>" +

    "Por seguridad, el lector fue detenido.",

    "error"

  );


  detenerLector();

}


/* =========================================================
   ERROR RESPUESTA
========================================================= */

function mostrarErrorRespuesta() {

  mostrarResultado(

    "❌" +

    "<div class='jugador'>" +
    "NO SE RECIBIÓ CONFIRMACIÓN" +
    "</div>" +

    "El servidor no devolvió una respuesta válida." +

    "<br><br>" +

    "Por seguridad, el lector fue detenido.",

    "error"

  );


  detenerLector();

}


/* =========================================================
   LIMPIAR JSONP
========================================================= */

function limpiarJSONP(
  callback,
  script
) {

  try {

    if (
      script &&
      script._bufalosTimeout
    ) {

      clearTimeout(
        script._bufalosTimeout
      );

    }

  } catch(error) {}


  try {

    if (
      script &&
      script.parentNode
    ) {

      script.parentNode.removeChild(
        script
      );

    }

  } catch(error) {}


  try {

    delete window[callback];

  } catch(error) {

    window[callback] =
      undefined;

  }

}


/* =========================================================
   MOSTRAR RESULTADO
========================================================= */

function mostrarResultado(
  contenido,
  tipo
) {

  const elemento =
    document.getElementById(
      "resultado"
    );


  elemento.className =
    "resultado " +
    tipo;


  elemento.innerHTML =
    contenido;


  if (tipo === "oculto") {

    elemento.classList.add(
      "oculto"
    );

  } else {

    elemento.classList.remove(
      "oculto"
    );

  }

}


/* =========================================================
   ESPERAR
========================================================= */

function esperar(
  milisegundos
) {

  return new Promise(
    function(resolve) {

      setTimeout(
        resolve,
        milisegundos
      );

    }
  );

}


/* =========================================================
   HTML SEGURO
========================================================= */

function escaparHTML(
  texto
) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    String(
      texto || ""
    );


  return div.innerHTML;

}
