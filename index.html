<!DOCTYPE html>

<html>
<head>

  <base target="_top">

  <meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

  <title>BÚFALOS FC - Lector QR</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .contenedor {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .panel {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.10);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 13px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-bottom: 12px;
    }

    button {
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-iniciar {
      background: #198754;
      color: white;
    }

    .btn-detener {
      background: #dc3545;
      color: white;
    }

    .btn-continuar {
      background: #0d6efd;
      color: white;
      font-size: 18px;
      padding: 16px;
      margin-top: 10px;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 15px auto;
    }

    .estado {
      text-align: center;
      font-weight: bold;
      padding: 12px;
      border-radius: 8px;
      margin-top: 10px;
      background: #eee;
    }

    .resultado {
      text-align: center;
      padding: 20px;
      border-radius: 12px;
      margin-top: 15px;
      font-size: 18px;
      line-height: 1.5;
    }

    .diagnostico {
      background: #fff3cd;
      color: #664d03;
    }

    .exito {
      background: #d1e7dd;
      color: #0f5132;
    }

    .error {
      background: #f8d7da;
      color: #842029;
    }

    .duplicado {
      background: #fff3cd;
      color: #664d03;
    }

    .jugador {
      font-size: 24px;
      font-weight: bold;
      margin: 10px 0;
    }

    .documento {
      font-size: 17px;
      font-weight: bold;
    }

    .contador {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      margin-top: 10px;
    }

    .oculto {
      display: none !important;
    }

  </style>

</head>

<body>

<div class="contenedor">

  <h1>⚽ BÚFALOS FC</h1>

  <div class="panel">

```
<label for="tipo">
  Tipo de registro
</label>

<select id="tipo">

  <option value="PREASISTENCIA">
    PREASISTENCIA
  </option>

  <option value="ASISTENCIA">
    ASISTENCIA
  </option>

</select>


<label for="actividad">
  Actividad
</label>

<input
  type="text"
  id="actividad"
  value="Entrenamiento"
  placeholder="Nombre de la actividad"
>


<button
  class="btn-iniciar"
  id="btnIniciar"
  onclick="iniciarLector()"
>
  📷 INICIAR LECTOR
</button>


<button
  class="btn-detener"
  id="btnDetener"
  onclick="detenerLector()"
  disabled
>
  ⛔ DETENER LECTOR
</button>
```

  </div>

  <div class="panel">

```
<div id="reader"></div>

<div
  id="estadoLector"
  class="estado"
>
  🔴 LECTOR DETENIDO
</div>

<div
  id="contador"
  class="contador"
>
  Registros enviados: 0
</div>
```

  </div>

  <div
    id="resultado"
    class="resultado oculto"
  >
  </div>

  <div
    id="botonContinuar"
    class="oculto"
  >

```
<button
  class="btn-continuar"
  onclick="continuarSiguiente()"
>
  🟢 CONTINUAR CON EL SIGUIENTE CARNET
</button>
```

  </div>

</div>

<script>

/* =========================================================
   URL DEL SISTEMA
========================================================= */

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbwMw4Lbn8xo9JqZCpd7wJ_6cwNy-nswbErwbhkPWK2y26_ZwtVYZ9p1n2rrHsf60hs/exec";


/* =========================================================
   VARIABLES
========================================================= */

let html5QrCode = null;

let lectorActivo = false;

let carnetBloqueado = false;

let escaneosRegistrados = 0;

let esperandoRespuesta = false;

let scriptRespuestaPendiente = null;


/* =========================================================
   INICIAR LECTOR
========================================================= */

async function iniciarLector() {

  if (carnetBloqueado) {

    return;

  }


  if (lectorActivo) {

    return;

  }


  try {

    document.getElementById(
      "estadoLector"
    ).innerHTML =
      "🟡 INICIANDO CÁMARA...";


    if (html5QrCode) {

      try {

        await html5QrCode.clear();

      }

      catch(error) {

        console.log(
          "Lector anterior no requería limpieza."
        );

      }

    }


    html5QrCode =
      new Html5Qrcode(
        "reader"
      );


    const cameras =
      await Html5Qrcode.getCameras();


    if (
      !cameras ||
      cameras.length === 0
    ) {

      throw new Error(
        "No se encontró ninguna cámara."
      );

    }


    let camaraSeleccionada =
      cameras[0].id;


    const camaraTrasera =
      cameras.find(
        function(camara) {

          const nombre =
            String(
              camara.label || ""
            ).toLowerCase();


          return (

            nombre.includes("back") ||

            nombre.includes("rear") ||

            nombre.includes("trasera") ||

            nombre.includes("environment")

          );

        }
      );


    if (camaraTrasera) {

      camaraSeleccionada =
        camaraTrasera.id;

    }


    await html5QrCode.start(

      camaraSeleccionada,

      {

        fps: 10,

        qrbox: {

          width: 250,

          height: 250

        },

        aspectRatio: 1.0,

        rememberLastUsedCamera: true

      },

      procesarQR,

      function(errorMessage) {

        /*
         * Errores normales de lectura.
         */

      }

    );


    lectorActivo = true;


    document.getElementById(
      "btnIniciar"
    ).disabled = true;


    document.getElementById(
      "btnDetener"
    ).disabled = false;


    document.getElementById(
      "estadoLector"
    ).innerHTML =
      "🟢 LECTOR ACTIVO — ESCANEE UN CARNET";


    ocultarContinuar();


    mostrarResultado(
      "",
      "oculto"
    );

  }

  catch(error) {

    console.error(
      "ERROR INICIANDO LECTOR:",
      error
    );


    lectorActivo = false;


    document.getElementById(
      "btnIniciar"
    ).disabled = false;


    document.getElementById(
      "btnDetener"
    ).disabled = true;


    document.getElementById(
      "estadoLector"
    ).innerHTML =
      "❌ NO SE PUDO INICIAR LA CÁMARA";


    mostrarResultado(

      "❌" +

      "<div class='jugador'>" +
      "ERROR DE CÁMARA" +
      "</div>" +

      "<br>" +

      escaparHTML(
        error.message ||
        "No se pudo iniciar la cámara."
      ),

      "error"

    );

  }

}


/* =========================================================
   DETENER LECTOR MANUALMENTE
========================================================= */

async function detenerLector() {

  cancelarSolicitud();


  try {

    if (
      html5QrCode &&
      lectorActivo
    ) {

      await html5QrCode.stop();

    }

  }

  catch(error) {

    console.error(
      "ERROR DETENIENDO LECTOR:",
      error
    );

  }


  lectorActivo = false;

  carnetBloqueado = false;

  esperandoRespuesta = false;


  document.getElementById(
    "btnIniciar"
  ).disabled = false;


  document.getElementById(
    "btnDetener"
  ).disabled = true;


  document.getElementById(
    "estadoLector"
  ).innerHTML =
    "🔴 LECTOR DETENIDO";

}


/* =========================================================
   PROCESAR QR
========================================================= */

async function procesarQR(
  decodedText
) {

  if (carnetBloqueado) {

    return;

  }


  if (esperandoRespuesta) {

    return;

  }


  const documento =
    String(
      decodedText || ""
    ).trim();


  if (!documento) {

    return;

  }


  /*
   * Bloqueamos inmediatamente.
   */

  carnetBloqueado = true;

  esperandoRespuesta = true;


  console.log(
    "QR DETECTADO:",
    documento
  );


  mostrarResultado(

    "🔎" +

    "<div class='jugador'>" +
    "QR DETECTADO" +
    "</div>" +

    "<strong>Documento:</strong> " +

    escaparHTML(
      documento
    ) +

    "<br><br>" +

    "⏳ Procesando registro...",

    "diagnostico"

  );


  document.getElementById(
    "estadoLector"
  ).innerHTML =
    "🟡 CARNET DETECTADO — DETENIENDO LECTOR";


  await detenerCamara();


  const tipo =
    document.getElementById(
      "tipo"
    ).value;


  const actividad =
    document.getElementById(
      "actividad"
    ).value.trim() ||
    "Entrenamiento";


  enviarRegistro(
    documento,
    tipo,
    actividad
  );

}


/* =========================================================
   DETENER CÁMARA
========================================================= */

async function detenerCamara() {

  try {

    if (
      html5QrCode &&
      lectorActivo
    ) {

      await html5QrCode.stop();

    }

  }

  catch(error) {

    console.error(
      "ERROR DETENIENDO CÁMARA:",
      error
    );

  }


  lectorActivo = false;


  document.getElementById(
    "btnIniciar"
  ).disabled = true;


  document.getElementById(
    "btnDetener"
  ).disabled = true;

}


/* =========================================================
   ENVIAR REGISTRO MEDIANTE JSONP
========================================================= */

function enviarRegistro(
  documento,
  tipo,
  actividad
) {

  cancelarSolicitud();


  mostrarResultado(

    "📤" +

    "<div class='jugador'>" +
    "PROCESANDO..." +
    "</div>" +

    "Enviando información al sistema BÚFALOS FC." +

    "<br><br>" +

    "⏳ Esperando confirmación...",

    "diagnostico"

  );


  document.getElementById(
    "estadoLector"
  ).innerHTML =
    "🟡 ENVIANDO AL SISTEMA BÚFALOS FC";


  /*
   * Creamos un callback único.
   */

  const nombreCallback =
    "bufalosRespuesta_" +
    Date.now();


  /*
   * Creamos función global.
   */

  window[nombreCallback] =
    function(resultado) {

      console.log(
        "RESPUESTA RECIBIDA:",
        resultado
      );


      cancelarSolicitud();


      try {

        delete window[
          nombreCallback
        ];

      }

      catch(error) {

        console.log(error);

      }


      esperandoRespuesta = false;


      mostrarResultadoReal(
        resultado,
        tipo
      );

    };


  /*
   * Creamos script dinámico.
   */

  const script =
    document.createElement(
      "script"
    );


  scriptRespuestaPendiente =
    script;


  /*
   * Construimos URL.
   */

  const parametros =

    "?accion=" +
    encodeURIComponent(
      "registrarAsistenciaQR"
    ) +

    "&documento=" +
    encodeURIComponent(
      documento
    ) +

    "&tipo=" +
    encodeURIComponent(
      tipo
    ) +

    "&actividad=" +
    encodeURIComponent(
      actividad
    ) +

    "&registradoPor=" +
    encodeURIComponent(
      "Hub QR"
    ) +

    "&callback=" +
    encodeURIComponent(
      nombreCallback
    ) +

    "&_=" +
    Date.now();


  script.src =
    APPS_SCRIPT_URL +
    parametros;


  script.async = true;


  /*
   * Si el navegador informa error.
   */

  script.onerror =
    function() {

      console.error(
        "ERROR CARGANDO RESPUESTA JSONP"
      );


      esperandoRespuesta = false;


      try {

        delete window[
          nombreCallback
        ];

      }

      catch(error) {}

      
      mostrarResultado(

        "❌" +

        "<div class='jugador'>" +
        "ERROR DE COMUNICACIÓN" +
        "</div>" +

        "<br>" +

        "El registro pudo haber llegado al sistema, " +
        "pero no fue posible recibir la respuesta.",

        "error"

      );


      document.getElementById(
        "estadoLector"
      ).innerHTML =
        "❌ ERROR DE COMUNICACIÓN";


      mostrarContinuar();

    };


  document.head.appendChild(
    script
  );


  /*
   * Seguridad:
   * si no llega respuesta en 10 segundos,
   * mostramos aviso.
   */

  script.dataset.temporizador =
    setTimeout(
      function() {

        if (!esperandoRespuesta) {

          return;

        }


        console.warn(
          "TIEMPO DE ESPERA JSONP AGOTADO"
        );


        esperandoRespuesta = false;


        try {

          delete window[
            nombreCallback
          ];

        }

        catch(error) {}


        if (script.parentNode) {

          script.parentNode.removeChild(
            script
          );

        }


        mostrarResultado(

          "⚠️" +

          "<div class='jugador'>" +
          "REGISTRO ENVIADO" +
          "</div>" +

          "<br>" +

          "El sistema no devolvió la confirmación " +
          "al navegador.",

          "diagnostico"

        );


        document.getElementById(
          "estadoLector"
        ).innerHTML =
          "⚠️ SIN CONFIRMACIÓN VISUAL";


        mostrarContinuar();

      },
      10000
    );

}


/* =========================================================
   CANCELAR SOLICITUD
========================================================= */

function cancelarSolicitud() {

  if (
    scriptRespuestaPendiente
  ) {

    const temporizador =
      scriptRespuestaPendiente
        .dataset
        .temporizador;


    if (temporizador) {

      clearTimeout(
        Number(
          temporizador
        )
      );

    }


    if (
      scriptRespuestaPendiente.parentNode
    ) {

      scriptRespuestaPendiente.parentNode
        .removeChild(
          scriptRespuestaPendiente
        );

    }


    scriptRespuestaPendiente =
      null;

  }

}


/* =========================================================
   MOSTRAR RESULTADO REAL
========================================================= */

function mostrarResultadoReal(
  resultado,
  tipoSeleccionado
) {

  /*
   * REGISTRADO
   */

  if (
    resultado &&
    resultado.ok === true &&
    resultado.estado === "REGISTRADO"
  ) {

    escaneosRegistrados++;


    document.getElementById(
      "contador"
    ).innerHTML =
      "Registros enviados: " +
      escaneosRegistrados;


    const jugador =
      resultado.jugador || {};


    const nombre =
      jugador.nombre ||
      resultado.nombre ||
      "Jugador";


    const documento =
      jugador.documento ||
      resultado.documento ||
      "";


    mostrarResultado(

      "✅" +

      "<div class='jugador'>" +

      (
        String(
          tipoSeleccionado
        ).toUpperCase() ===
        "PREASISTENCIA"

          ? "PREASISTENCIA REGISTRADA"

          : "ASISTENCIA REGISTRADA"

      ) +

      "</div>" +

      "<strong>" +

      escaparHTML(
        nombre
      ) +

      "</strong>" +

      "<br><br>" +

      "<span class='documento'>" +

      "Documento: " +

      escaparHTML(
        documento
      ) +

      "</span>" +

      "<br><br>" +

      "🎉 Registro realizado correctamente.",

      "exito"

    );


    document.getElementById(
      "estadoLector"
    ).innerHTML =
      "🟢 REGISTRO REALIZADO — LECTOR DETENIDO";


    mostrarContinuar();


    return;

  }


  /*
   * DUPLICADO
   */

  if (
    resultado &&
    (
      resultado.duplicado === true ||
      resultado.estado === "DUPLICADO"
    )
  ) {

    const jugador =
      resultado.jugador || {};


    const nombre =
      jugador.nombre ||
      resultado.nombre ||
      "Jugador";


    const documento =
      jugador.documento ||
      resultado.documento ||
      "";


    mostrarResultado(

      "⚠️" +

      "<div class='jugador'>" +
      "YA REGISTRADO" +
      "</div>" +

      "<strong>" +

      escaparHTML(
        nombre
      ) +

      "</strong>" +

      "<br><br>" +

      "<span class='documento'>" +

      "Documento: " +

      escaparHTML(
        documento
      ) +

      "</span>" +

      "<br><br>" +

      escaparHTML(
        resultado.mensaje ||
        "Este jugador ya tiene registrada esta asistencia para esta actividad."
      ),

      "duplicado"

    );


    document.getElementById(
      "estadoLector"
    ).innerHTML =
      "⚠️ YA REGISTRADO — LECTOR DETENIDO";


    mostrarContinuar();


    return;

  }


  /*
   * JUGADOR NO ENCONTRADO
   */

  if (
    resultado &&
    (
      resultado.estado ===
      "NO_ENCONTRADO" ||

      (
        resultado.ok === false &&

        String(
          resultado.mensaje || ""
        )
        .toLowerCase()
        .includes(
          "jugador no encontrado"
        )
      )
    )
  ) {

    mostrarResultado(

      "❌" +

      "<div class='jugador'>" +
      "JUGADOR NO ENCONTRADO" +
      "</div>" +

      "<br>" +

      (
        resultado.documento

          ? "<span class='documento'>" +
            "Documento: " +
            escaparHTML(
              resultado.documento
            ) +
            "</span><br><br>"

          : ""
      ) +

      "El documento no aparece registrado en BÚFALOS FC.",

      "error"

    );


    document.getElementById(
      "estadoLector"
    ).innerHTML =
      "❌ JUGADOR NO ENCONTRADO — LECTOR DETENIDO";


    mostrarContinuar();


    return;

  }


  /*
   * ERROR
   */

  mostrarResultado(

    "❌" +

    "<div class='jugador'>" +
    "ERROR" +
    "</div>" +

    "<br>" +

    escaparHTML(
      resultado &&
      resultado.mensaje
        ? resultado.mensaje
        : "No se pudo completar el registro."
    ),

    "error"

  );


  document.getElementById(
    "estadoLector"
  ).innerHTML =
    "❌ ERROR — LECTOR DETENIDO";


  mostrarContinuar();

}


/* =========================================================
   CONTINUAR
========================================================= */

async function continuarSiguiente() {

  cancelarSolicitud();


  carnetBloqueado = false;

  esperandoRespuesta = false;


  ocultarContinuar();


  mostrarResultado(
    "",
    "oculto"
  );


  document.getElementById(
    "estadoLector"
  ).innerHTML =
    "🟡 PREPARANDO SIGUIENTE CARNET";


  await esperar(
    500
  );


  await iniciarLector();

}


/* =========================================================
   MOSTRAR RESULTADO
========================================================= */

function mostrarResultado(
  contenido,
  tipo
) {

  const elemento =
    document.getElementById(
      "resultado"
    );


  elemento.className =
    "resultado " +
    tipo;


  elemento.innerHTML =
    contenido;


  if (
    tipo === "oculto"
  ) {

    elemento.classList.add(
      "oculto"
    );

  }

  else {

    elemento.classList.remove(
      "oculto"
    );

  }

}


/* =========================================================
   CONTINUAR
========================================================= */

function mostrarContinuar() {

  document
    .getElementById(
      "botonContinuar"
    )
    .classList.remove(
      "oculto"
    );

}


function ocultarContinuar() {

  document
    .getElementById(
      "botonContinuar"
    )
    .classList.add(
      "oculto"
    );

}


/* =========================================================
   ESPERAR
========================================================= */

function esperar(
  milisegundos
) {

  return new Promise(
    function(resolve) {

      setTimeout(
        resolve,
        milisegundos
      );

    }
  );

}


/* =========================================================
   HTML SEGURO
========================================================= */

function escaparHTML(
  texto
) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    String(
      texto || ""
    );


  return div.innerHTML;

}

</script>

</body>
</html>
