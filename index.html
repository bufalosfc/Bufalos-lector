<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>BÚFALOS FC - Lector QR</title>

  <!-- LECTOR QR -->
  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    .encabezado {
      background: #000;
      padding: 20px;
      text-align: center;
      font-size: 25px;
      font-weight: bold;
    }

    .contenedor {
      max-width: 600px;
      margin: auto;
      padding: 15px;
    }

    .tarjeta {
      background: #222;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,.4);
    }

    button {
      width: 100%;
      padding: 16px;
      border: 0;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      margin-top: 10px;
      cursor: pointer;
    }

    .verde {
      background: #16803c;
      color: white;
    }

    .rojo {
      background: #c62828;
      color: white;
    }

    .azul {
      background: #1565c0;
      color: white;
    }

    .oculto {
      display: none !important;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
      overflow: hidden;
      border-radius: 12px;
    }

    #resultado {
      margin-top: 20px;
      padding: 18px;
      border-radius: 12px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
    }

    .info {
      background: #1565c0;
    }

    .ok {
      background: #16803c;
    }

    .error {
      background: #b71c1c;
    }

    .jugador {
      font-size: 23px;
      margin-bottom: 8px;
    }

    .historial {
      margin-top: 20px;
    }

    .registro {
      background: #333;
      padding: 13px;
      margin-top: 8px;
      border-radius: 10px;
    }

    .pequeno {
      font-size: 14px;
      opacity: .8;
    }

  </style>

</head>

<body>

<div class="encabezado">

  🐃 BÚFALOS FC

  <br>

  📷 LECTOR DE ASISTENCIA

</div>


<div class="contenedor">

  <div class="tarjeta">

    <button
      id="btnIniciar"
      class="verde"
      onclick="iniciarLector()">

      ▶️ INICIAR LECTOR

    </button>


    <button
      id="btnDetener"
      class="rojo oculto"
      onclick="detenerLector()">

      ⏹️ DETENER LECTOR

    </button>


    <div id="reader"></div>


    <div
      id="resultado"
      class="info">

      Pulsa INICIAR LECTOR para comenzar.

    </div>


    <div class="historial">

      <h3>📋 Últimas asistencias</h3>

      <div id="listaHistorial"></div>

    </div>

  </div>

</div>


<script>

/* =====================================================
   CONFIGURACIÓN
===================================================== */

/*
   ESTE ES EL GOOGLE APPS SCRIPT
   QUE YA ESTAMOS UTILIZANDO PARA BÚFALOS FC.
*/

const URL_APPS_SCRIPT =
'https://script.google.com/macros/s/AKfycbwMw4Lbn8xo9JqZCpd7wJ_6cwNy-nswbErwbhkPWK2y26_ZwtVYZ9p1n2rrHsf60hs/exec';


let lector = null;

let lectorActivo = false;

let procesando = false;

let ultimoCodigo = '';

let ultimoTiempo = 0;


/* =====================================================
   INICIAR LECTOR
===================================================== */

function iniciarLector() {

  if (lectorActivo) {
    return;
  }


  mostrar(
    '📷 Solicitando permiso para utilizar la cámara...',
    'info'
  );


  lector =
    new Html5Qrcode('reader');


  Html5Qrcode.getCameras()

    .then(function(camaras) {

      if (!camaras || camaras.length === 0) {

        throw new Error(
          'No se encontró ninguna cámara.'
        );

      }


      /*
        Primero intentamos encontrar
        la cámara trasera.
      */

      let camaraSeleccionada =
        camaras[0].id;


      for (
        let i = 0;
        i < camaras.length;
        i++
      ) {

        const nombre =
          String(
            camaras[i].label || ''
          ).toLowerCase();


        if (
          nombre.includes('back') ||
          nombre.includes('rear') ||
          nombre.includes('trasera') ||
          nombre.includes('environment')
        ) {

          camaraSeleccionada =
            camaras[i].id;

          break;

        }

      }


      return lector.start(

        camaraSeleccionada,

        {
          fps: 10,

          qrbox: {
            width: 250,
            height: 250
          }

        },

        function(codigo) {

          codigoEncontrado(codigo);

        },

        function(error) {

          /*
            Los errores normales de búsqueda
            del QR no se muestran.
          */

        }

      );

    })


    .then(function() {

      lectorActivo = true;


      document
        .getElementById('btnIniciar')
        .classList.add('oculto');


      document
        .getElementById('btnDetener')
        .classList.remove('oculto');


      mostrar(
        '📷 Lector activo.<br>Presenta el QR del carnet.',
        'info'
      );

    })


    .catch(function(error) {

      console.error(error);


      mostrar(
        '❌ No se pudo abrir la cámara.<br><br>' +
        'Revisa que el navegador tenga permiso para usar la cámara.',
        'error'
      );


      lector = null;

    });

}


/* =====================================================
   QR DETECTADO
===================================================== */

function codigoEncontrado(codigo) {

  codigo =
    String(codigo || '').trim();


  if (!codigo) {
    return;
  }


  const ahora = Date.now();


  /*
    Evitar que el mismo QR se lea
    muchas veces seguidas.
  */

  if (
    codigo === ultimoCodigo &&
    ahora - ultimoTiempo < 5000
  ) {

    return;

  }


  ultimoCodigo = codigo;

  ultimoTiempo = ahora;


  if (procesando) {
    return;
  }


  procesando = true;


  mostrar(
    '🔎 QR detectado.<br>Consultando jugador...',
    'info'
  );


  consultarJugador(codigo);

}


/* =====================================================
   CONSULTAR JUGADOR
===================================================== */

function consultarJugador(codigo) {

  /*
    El QR puede contener:

    BFC-001

    o una dirección como:

    ...?jugador=BFC-001

    Vamos a intentar obtener el ID.
  */

  let jugadorID = codigo;


  try {

    if (
      codigo.includes('?jugador=')
    ) {

      const url =
        new URL(codigo);

      jugadorID =
        url.searchParams.get('jugador') ||
        codigo;

    }

  }

  catch(e) {

    console.log(
      'El QR no es una URL. Se utilizará como ID.'
    );

  }


  jugadorID =
    String(jugadorID)
      .trim();


  registrarAsistencia(jugadorID);

}


/* =====================================================
   REGISTRAR ASISTENCIA
===================================================== */

function registrarAsistencia(jugadorID) {

  const url =
    URL_APPS_SCRIPT +
    '?accion=qr&codigo=' +
    encodeURIComponent(jugadorID);


  fetch(url)

    .then(function(respuesta) {

      if (!respuesta.ok) {

        throw new Error(
          'Error de comunicación con el servidor.'
        );

      }

      return respuesta.json();

    })


    .then(function(datos) {

      console.log(
        'Respuesta:',
        datos
      );


      /*
        JUGADOR ENCONTRADO
      */

      if (
        datos.ok &&
        datos.encontrado
      ) {


        /*
          YA TENÍA ASISTENCIA
        */

        if (
          datos.duplicate
        ) {

          mostrar(

            '⚠️<br>' +

            '<div class="jugador">' +
            datos.nombre +
            '</div>' +

            'Ya tenía asistencia registrada hoy.',

            'info'

          );

        }


        /*
          ASISTENCIA NUEVA
        */

        else {

          mostrar(

            '✅<br>' +

            '<div class="jugador">' +
            datos.nombre +
            '</div>' +

            (
              datos.categoria ||
              ''
            ) +

            '<br><br>' +

            'Asistencia registrada<br>' +

            '🕐 ' +
            (
              datos.hora ||
              ''
            ),

            'ok'

          );


          agregarHistorial(
            datos
          );


          sonidoCorrecto();

        }

      }


      /*
        JUGADOR NO ENCONTRADO
      */

      else {

        mostrar(

          '❌<br>' +

          (
            datos.mensaje ||
            'Jugador no encontrado.'
          ),

          'error'

        );


        sonidoError();

      }


      /*
        Después de unos segundos
        queda listo para el siguiente.
      */

      setTimeout(function() {

        procesando = false;


        mostrar(

          '📷 Listo.<br>' +
          'Presenta el siguiente carnet.',

          'info'

        );

      }, 1800);

    })


    .catch(function(error) {

      console.error(error);


      mostrar(

        '❌ No se pudo comunicar con BÚFALOS FC.<br><br>' +
        error.message,

        'error'

      );


      procesando = false;

    });

}


/* =====================================================
   HISTORIAL
===================================================== */

function agregarHistorial(datos) {

  const lista =
    document.getElementById(
      'listaHistorial'
    );


  const registro =
    document.createElement(
      'div'
    );


  registro.className =
    'registro';


  registro.innerHTML =

    '✅ <strong>' +

    (
      datos.nombre ||
      ''
    ) +

    '</strong><br>' +

    (
      datos.categoria ||
      ''
    ) +

    '<br>' +

    '🕐 ' +

    (
      datos.hora ||
      ''
    );


  lista.prepend(
    registro
  );


  /*
    Máximo 10 registros visibles.
  */

  while (
    lista.children.length > 10
  ) {

    lista.removeChild(
      lista.lastChild
    );

  }

}


/* =====================================================
   DETENER LECTOR
===================================================== */

function detenerLector() {

  if (!lector) {
    return;
  }


  lector.stop()

    .then(function() {

      lector.clear();


      lector = null;

      lectorActivo = false;

      procesando = false;


      document
        .getElementById('btnDetener')
        .classList.add('oculto');


      document
        .getElementById('btnIniciar')
        .classList.remove('oculto');


      mostrar(
        'Lector detenido.',
        'info'
      );

    })


    .catch(function(error) {

      console.error(error);

    });

}


/* =====================================================
   MENSAJES
===================================================== */

function mostrar(texto, tipo) {

  const elemento =
    document.getElementById(
      'resultado'
    );


  elemento.className =
    tipo;


  elemento.innerHTML =
    texto;

}


/* =====================================================
   SONIDO CORRECTO
===================================================== */

function sonidoCorrecto() {

  try {

    const contexto =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();


    const oscilador =
      contexto.createOscillator();


    const ganancia =
      contexto.createGain();


    oscilador.connect(
      ganancia
    );


    ganancia.connect(
      contexto.destination
    );


    oscilador.frequency.value =
      900;


    ganancia.gain.value =
      0.15;


    oscilador.start();


    oscilador.stop(
      contexto.currentTime + 0.15
    );

  }

  catch(e) {}

}


/* =====================================================
   SONIDO ERROR
===================================================== */

function sonidoError() {

  try {

    const contexto =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();


    const oscilador =
      contexto.createOscillator();


    const ganancia =
      contexto.createGain();


    oscilador.connect(
      ganancia
    );


    ganancia.connect(
      contexto.destination
    );


    oscilador.frequency.value =
      250;


    ganancia.gain.value =
      0.25;


    oscilador.start();


    oscilador.stop(
      contexto.currentTime + 0.25
    );

  }

  catch(e) {}

}

</script>

</body>

</html>
