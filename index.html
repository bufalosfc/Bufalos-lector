<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BÚFALOS FC - HUB QR</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .contenedor {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .panel {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.10);
    }

    button {
      width: 100%;
      padding: 13px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      margin-bottom: 12px;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-iniciar {
      background: #198754;
      color: white;
    }

    .btn-detener {
      background: #dc3545;
      color: white;
    }

    .btn-cambiar {
      background: #0d6efd;
      color: white;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 15px auto;
    }

    .estado {
      text-align: center;
      font-weight: bold;
      padding: 12px;
      border-radius: 8px;
      margin-top: 10px;
      background: #eee;
    }

    .actividad {
      background: #e7f1ff;
      border: 2px solid #0d6efd;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .actividad-titulo {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .dato {
      padding: 6px 0;
      font-size: 16px;
    }

    .dato strong {
      display: inline-block;
      min-width: 90px;
    }

    .resultado {
      text-align: center;
      padding: 20px;
      border-radius: 12px;
      margin-top: 15px;
      font-size: 18px;
      line-height: 1.5;
    }

    .diagnostico {
      background: #fff3cd;
      color: #664d03;
    }

    .exito {
      background: #d1e7dd;
      color: #0f5132;
    }

    .error {
      background: #f8d7da;
      color: #842029;
    }

    .duplicado {
      background: #fff3cd;
      color: #664d03;
    }

    .jugador {
      font-size: 24px;
      font-weight: bold;
      margin: 10px 0;
    }

    .contador {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      margin-top: 10px;
    }

    .oculto {
      display: none !important;
    }
  </style>
</head>

<body>

<div class="contenedor">

  <h1>⚽ BÚFALOS FC</h1>

  <div class="panel">

    <div
      id="actividadSeleccionada"
      class="actividad oculto">

      <div class="actividad-titulo">
        📋 ACTIVIDAD SELECCIONADA
      </div>

      <div class="dato">
        <strong>Fecha:</strong>
        <span id="actividadFecha">-</span>
      </div>

      <div class="dato">
        <strong>Hora:</strong>
        <span id="actividadHora">-</span>
      </div>

      <div class="dato">
        <strong>Actividad:</strong>
        <span id="actividadNombre">-</span>
      </div>

      <div class="dato">
        <strong>Tipo:</strong>
        <span id="actividadTipo">-</span>
      </div>

      <div class="dato">
        <strong>Estado:</strong>
        <span id="actividadEstado">-</span>
      </div>

    </div>

    <button
      class="btn-iniciar"
      id="btnIniciar"
      onclick="iniciarLector()">

      📷 INICIAR LECTOR

    </button>

    <button
      class="btn-detener"
      id="btnDetener"
      onclick="detenerLector()"
      disabled>

      ⛔ DETENER LECTOR

    </button>

    <button
      class="btn-cambiar oculto"
      id="btnCambiar"
      onclick="cambiarActividad()">

      🔄 CAMBIAR ACTIVIDAD

    </button>

  </div>

  <div class="panel">

    <div id="reader"></div>

    <div
      id="estadoLector"
      class="estado">

      🔴 LECTOR DETENIDO

    </div>

    <div
      id="contador"
      class="contador">

      Registros confirmados: 0

    </div>

  </div>

  <div
    id="resultado"
    class="resultado oculto">
  </div>

</div>

<script>

/* =========================================================
   CONFIGURACIÓN
========================================================= */

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbwMw4Lbn8xo9JqZCpd7wJ_6cwNy-nswbErwbhkPWK2y26_ZwtVYZ9p1n2rrHsf60hs/exec";

const TIEMPO_ENTRE_ESCANEOS = 2000;


/* =========================================================
   VARIABLES PRINCIPALES
========================================================= */

let html5QrCode = null;

let lectorActivo = false;

let carnetBloqueado = false;

let escaneosRegistrados = 0;

let contadorJSONP = 0;

let actividadSeleccionada = null;

let procesandoActividad = false;


/* =========================================================
   INICIAR LECTOR
========================================================= */

async function iniciarLector() {

  if (lectorActivo) {
    return;
  }

  try {

    document.getElementById("estadoLector").innerHTML =
      "🟡 INICIANDO CÁMARA...";

    html5QrCode =
      new Html5Qrcode("reader");

    const cameras =
      await Html5Qrcode.getCameras();

    if (!cameras || cameras.length === 0) {

      throw new Error(
        "No se encontró ninguna cámara."
      );

    }

    /*
     * Mantenemos la misma lógica de selección
     * de cámara del HUB que ya funcionaba.
     */

    let camaraSeleccionada =
      cameras[0].id;

    const camaraTrasera =
      cameras.find(function(camara) {

        const nombre =
          String(camara.label || "").toLowerCase();

        return (
          nombre.includes("back") ||
          nombre.includes("rear") ||
          nombre.includes("trasera") ||
          nombre.includes("environment")
        );

      });

    if (camaraTrasera) {

      camaraSeleccionada =
        camaraTrasera.id;

    }

    await html5QrCode.start(

      camaraSeleccionada,

      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        },

        aspectRatio: 1.0,

        rememberLastUsedCamera: true
      },

      procesarQR,

      function(errorMessage) {
        /*
         * Los errores normales de lectura
         * se ignoran.
         */
      }

    );

    lectorActivo = true;

    carnetBloqueado = false;

    document.getElementById("btnIniciar").disabled =
      true;

    document.getElementById("btnDetener").disabled =
      false;

    document.getElementById("estadoLector").innerHTML =
      actividadSeleccionada
        ? "🟢 LECTOR ACTIVO — ESCANEE CARNET"
        : "🟢 LECTOR ACTIVO — ESCANEE QR GENERAL";

    if (actividadSeleccionada) {

      document.getElementById("btnCambiar")
        .classList.remove("oculto");

    }

    mostrarResultado(
      "",
      "oculto"
    );

    console.log(
      "LECTOR CONTINUO INICIADO CORRECTAMENTE"
    );

  } catch(error) {

    console.error(
      "ERROR INICIANDO LECTOR:",
      error
    );

    lectorActivo = false;

    carnetBloqueado = false;

    document.getElementById("btnIniciar").disabled =
      false;

    document.getElementById("btnDetener").disabled =
      true;

    document.getElementById("estadoLector").innerHTML =
      "❌ NO SE PUDO INICIAR LA CÁMARA";

    mostrarResultado(

      "❌ " +
      escaparHTML(
        error && error.message
          ? error.message
          : "Error desconocido."
      ),

      "error"

    );

  }

}


/* =========================================================
   DETENER LECTOR MANUALMENTE
========================================================= */

async function detenerLector() {

  try {

    if (html5QrCode && lectorActivo) {

      await html5QrCode.stop();

    }

  } catch(error) {

    console.error(
      "ERROR DETENIENDO LECTOR:",
      error
    );

  }

  lectorActivo = false;

  carnetBloqueado = false;

  procesandoActividad = false;

  document.getElementById("btnIniciar").disabled =
    false;

  document.getElementById("btnDetener").disabled =
    true;

  document.getElementById("btnCambiar")
    .classList.add("oculto");

  document.getElementById("estadoLector").innerHTML =
    "🔴 LECTOR DETENIDO";

  mostrarResultado(
    "",
    "oculto"
  );

  console.log(
    "LECTOR DETENIDO MANUALMENTE"
  );

}


/* =========================================================
   PROCESAR CUALQUIER QR
========================================================= */

function procesarQR(decodedText) {

  if (carnetBloqueado) {

    console.log(
      "QR IGNORADO: PROCESANDO LECTURA ANTERIOR"
    );

    return;

  }

  if (!lectorActivo) {
    return;
  }

  const texto =
    String(decodedText || "").trim();

  if (!texto) {
    return;
  }

  /*
   * PRIMERO:
   * comprobamos si el QR corresponde
   * a una actividad GENERAL.
   */

  const actividadQR =
    extraerActividadDesdeQR(texto);

  if (actividadQR) {

    if (procesandoActividad) {
      return;
    }

    carnetBloqueado = true;

    procesandoActividad = true;

    console.log(
      "QR GENERAL DE ACTIVIDAD DETECTADO:",
      actividadQR
    );

    mostrarResultado(

      "🔎" +
      "<div class='jugador'>" +
      "QR GENERAL DETECTADO" +
      "</div>" +
      "⏳ Consultando actividad...",

      "diagnostico"

    );

    document.getElementById("estadoLector").innerHTML =
      "🟡 CONSULTANDO ACTIVIDAD...";

    consultarActividad(
      actividadQR
    );

    return;

  }


  /*
   * SI NO ES QR GENERAL:
   * solamente puede ser un carnet
   * si ya existe una actividad seleccionada.
   */

  if (!actividadSeleccionada) {

    carnetBloqueado = true;

    mostrarResultado(

      "⚠️" +
      "<div class='jugador'>" +
      "PRIMERO ESCANEE EL QR GENERAL" +
      "</div>" +
      "Debe seleccionar una actividad antes " +
      "de escanear los carnets.",

      "diagnostico"

    );

    document.getElementById("estadoLector").innerHTML =
      "🟡 ESCANEE QR GENERAL DE ACTIVIDAD";

    setTimeout(function() {

      carnetBloqueado = false;

      if (lectorActivo) {

        document.getElementById("estadoLector").innerHTML =
          "🟢 LECTOR ACTIVO — ESCANEE QR GENERAL";

      }

    }, TIEMPO_ENTRE_ESCANEOS);

    return;

  }


  /*
   * YA HAY ACTIVIDAD:
   * el QR se interpreta como DOCUMENTO.
   */

  const documento = texto;

  registrarJugadorEnActividad(
    documento
  );

}


/* =========================================================
   EXTRAER ACTIVIDAD DESDE QR GENERAL
========================================================= */

function extraerActividadDesdeQR(texto) {

  try {

    const url =
      new URL(texto);

    const accion =
      String(
        url.searchParams.get("accion") || ""
      ).trim();

    const id =
      String(
        url.searchParams.get("id") || ""
      ).trim();

    if (
      accion.toLowerCase() !==
      "actividadqr"
    ) {

      return null;

    }

    if (!id) {
      return null;
    }

    return {
      actividadId: id
    };

  } catch(error) {

    /*
     * Si no es una URL válida,
     * no es QR GENERAL.
     */

    return null;

  }

}


/* =========================================================
   CONSULTAR ACTIVIDAD
========================================================= */

function consultarActividad(datosQR) {

  contadorJSONP++;

  const callback =
    "bufalosActividad_" +
    Date.now() +
    "_" +
    contadorJSONP;

  let terminado = false;

  let script = null;

  const limpiar = function() {

    limpiarJSONP(
      callback,
      script
    );

  };


  window[callback] =
    function(respuesta) {

      if (terminado) {
        return;
      }

      terminado = true;

      console.log(
        "RESPUESTA ACTIVIDAD:",
        respuesta
      );

      try {

        if (!respuesta) {

          mostrarErrorActividad();

          return;

        }

        procesarRespuestaActividad(
          respuesta
        );

      } finally {

        limpiar();

      }

    };


  script =
    document.createElement("script");

  script.src =
    APPS_SCRIPT_URL +
    "?accion=actividadQR" +
    "&id=" +
    encodeURIComponent(
      datosQR.actividadId
    ) +
    "&callback=" +
    encodeURIComponent(
      callback
    ) +
    "&_=" +
    Date.now();


  script.onerror =
    function() {

      if (terminado) {
        return;
      }

      terminado = true;

      console.error(
        "ERROR CONSULTANDO ACTIVIDAD"
      );

      mostrarResultado(

        "❌" +
        "<div class='jugador'>" +
        "NO SE PUDO CONSULTAR LA ACTIVIDAD" +
        "</div>" +
        "No se recibió respuesta del sistema.",

        "error"

      );

      document.getElementById("estadoLector").innerHTML =
        "🔴 ERROR CONSULTANDO ACTIVIDAD";

      carnetBloqueado = false;

      procesandoActividad = false;

      limpiar();

    };


  const temporizador =
    setTimeout(function() {

      if (terminado) {
        return;
      }

      terminado = true;

      console.error(
        "TIEMPO DE ESPERA ACTIVIDAD"
      );

      mostrarResultado(

        "⚠️" +
        "<div class='jugador'>" +
        "SIN RESPUESTA" +
        "</div>" +
        "El sistema tardó demasiado en responder.",

        "error"

      );

      document.getElementById("estadoLector").innerHTML =
        "🔴 ERROR CONSULTANDO ACTIVIDAD";

      carnetBloqueado = false;

      procesandoActividad = false;

      limpiar();

    }, 15000);


  script._bufalosTimeout =
    temporizador;

  document.body.appendChild(
    script
  );

}


/* =========================================================
   PROCESAR RESPUESTA DE ACTIVIDAD
========================================================= */

function procesarRespuestaActividad(
  respuesta
) {

  const estado =
    String(
      respuesta.estado || ""
    ).toUpperCase();


  /*
   * ACTIVIDAD ENCONTRADA
   */

  if (
    respuesta.ok === true &&
    (
      estado === "OK" ||
      estado === "ACTIVA" ||
      respuesta.actividad
    )
  ) {

    const actividad =
      respuesta.actividad ||
      respuesta;

    actividadSeleccionada = {

      actividadId:
        actividad.actividadId ||
        respuesta.actividadId ||
        "",

      fecha:
        actividad.fecha ||
        respuesta.fecha ||
        "",

      hora:
        actividad.hora ||
        respuesta.hora ||
        "",

      actividad:
        actividad.actividad ||
        actividad.nombre ||
        respuesta.actividad ||
        "",

      tipo:
        actividad.tipo ||
        respuesta.tipo ||
        "",

      estado:
        actividad.estado ||
        respuesta.estado ||
        ""

    };


    mostrarActividadSeleccionada();


    document.getElementById("btnCambiar")
      .classList.remove("oculto");


    document.getElementById("estadoLector").innerHTML =
      "🟢 ACTIVIDAD LISTA — ESCANEE CARNETS";


    mostrarResultado(

      "🟢" +
      "<div class='jugador'>" +
      "ACTIVIDAD SELECCIONADA" +
      "</div>" +

      "<strong>" +
      escaparHTML(
        actividadSeleccionada.actividad
      ) +
      "</strong>" +

      "<br><br>" +

      "Ahora puede escanear los carnets " +
      "de los jugadores.",

      "exito"

    );


    carnetBloqueado = false;

    procesandoActividad = false;

    return;

  }


  /*
   * ACTIVIDAD NO DISPONIBLE / NO ENCONTRADA
   */

  mostrarResultado(

    "❌" +
    "<div class='jugador'>" +
    "ACTIVIDAD NO ENCONTRADA" +
    "</div>" +

    escaparHTML(
      respuesta.mensaje ||
      "El QR GENERAL no corresponde a una actividad válida."
    ),

    "error"

  );


  document.getElementById("estadoLector").innerHTML =
    "🟡 ESCANEE OTRO QR GENERAL";


  carnetBloqueado = false;

  procesandoActividad = false;

}


/* =========================================================
   MOSTRAR ACTIVIDAD SELECCIONADA
========================================================= */

function mostrarActividadSeleccionada() {

  const panel =
    document.getElementById(
      "actividadSeleccionada"
    );

  panel.classList.remove(
    "oculto"
  );


  document.getElementById(
    "actividadFecha"
  ).textContent =
    actividadSeleccionada.fecha || "-";


  document.getElementById(
    "actividadHora"
  ).textContent =
    actividadSeleccionada.hora || "-";


  document.getElementById(
    "actividadNombre"
  ).textContent =
    actividadSeleccionada.actividad || "-";


  document.getElementById(
    "actividadTipo"
  ).textContent =
    actividadSeleccionada.tipo || "-";


  document.getElementById(
    "actividadEstado"
  ).textContent =
    actividadSeleccionada.estado || "-";

}


/* =========================================================
   REGISTRAR JUGADOR EN ACTIVIDAD
========================================================= */

function registrarJugadorEnActividad(
  documento
) {

  if (!actividadSeleccionada) {

    mostrarResultado(

      "⚠️" +
      "<div class='jugador'>" +
      "NO HAY ACTIVIDAD SELECCIONADA" +
      "</div>",

      "error"

    );

    return;

  }


  carnetBloqueado = true;


  console.log(
    "================================"
  );

  console.log(
    "CARNET DETECTADO:",
    documento
  );

  console.log(
    "ACTIVIDAD:",
    actividadSeleccionada
  );

  console.log(
    "================================"
  );


  mostrarResultado(

    "🔎" +
    "<div class='jugador'>" +
    "QR DETECTADO" +
    "</div>" +

    "<strong>Documento:</strong> " +
    escaparHTML(documento) +

    "<br><br>" +

    "⏳ Procesando asistencia...",

    "diagnostico"

  );


  document.getElementById("estadoLector").innerHTML =
    "🟡 PROCESANDO CARNET...";


  contadorJSONP++;


  const callback =
    "bufalosAsistencia_" +
    Date.now() +
    "_" +
    contadorJSONP;


  let terminado = false;

  let script = null;


  window[callback] =
    function(respuesta) {

      if (terminado) {
        return;
      }

      terminado = true;


      console.log(
        "RESPUESTA ASISTENCIA:",
        respuesta
      );


      try {

        if (!respuesta) {

          mostrarErrorRespuesta();

          return;

        }


        procesarRespuestaAsistencia(

          respuesta,

          documento

        );


      } finally {

        limpiarJSONP(
          callback,
          script
        );

      }

    };


  script =
    document.createElement("script");


  script.src =
    APPS_SCRIPT_URL +

    "?accion=registrarAsistenciaActividad" +

    "&documento=" +
    encodeURIComponent(
      documento
    ) +

    "&id=" +
    encodeURIComponent(
      actividadSeleccionada.actividadId
    ) +

    "&callback=" +
    encodeURIComponent(
      callback
    ) +

    "&_=" +
    Date.now();


  script.onerror =
    function() {

      if (terminado) {
        return;
      }

      terminado = true;


      console.error(
        "ERROR RECIBIENDO RESPUESTA DEL SERVIDOR"
      );


      mostrarResultado(

        "❌" +
        "<div class='jugador'>" +
        "NO SE RECIBIÓ CONFIRMACIÓN" +
        "</div>" +

        "El registro pudo haberse enviado," +
        "<br>" +

        "pero el navegador no recibió " +
        "la respuesta del sistema." +

        "<br><br>" +

        "Por seguridad, el lector fue detenido.",

        "error"

      );


      document.getElementById("estadoLector").innerHTML =
        "🔴 LECTOR DETENIDO — REVISE EL REGISTRO";


      detenerLector();


      limpiarJSONP(
        callback,
        script
      );

    };


  const temporizador =
    setTimeout(function() {

      if (terminado) {
        return;
      }

      terminado = true;


      console.error(
        "TIEMPO DE ESPERA AGOTADO"
      );


      mostrarResultado(

        "⚠️" +
        "<div class='jugador'>" +
        "SIN CONFIRMACIÓN" +
        "</div>" +

        "El sistema tardó demasiado en responder." +

        "<br><br>" +

        "Por seguridad, el lector fue detenido." +

        "<br>" +

        "Revise la hoja Asistencia antes de continuar.",

        "error"

      );


      detenerLector();


      limpiarJSONP(
        callback,
        script
      );

    }, 15000);


  script._bufalosTimeout =
    temporizador;


  document.body.appendChild(
    script
  );

}


/* =========================================================
   PROCESAR RESPUESTA DE ASISTENCIA
========================================================= */

function procesarRespuestaAsistencia(
  respuesta,
  documento
) {

  const estado =
    String(
      respuesta.estado || ""
    ).toUpperCase();


  /*
   * REGISTRO NUEVO
   */

  if (
    respuesta.ok === true &&
    estado === "REGISTRADO"
  ) {

    escaneosRegistrados++;


    document.getElementById(
      "contador"
    ).innerHTML =
      "Registros confirmados: " +
      escaneosRegistrados;


    const jugador =
      respuesta.jugador || {};


    const nombre =
      jugador.nombre ||
      respuesta.nombre ||
      "";


    mostrarResultado(

      "🟢" +

      "<div class='jugador'>" +
      "ASISTENCIA REGISTRADA" +
      "</div>" +

      (
        nombre
          ? "<strong>" +
            escaparHTML(nombre) +
            "</strong><br><br>"
          : ""
      ) +

      "<strong>Documento:</strong> " +
      escaparHTML(documento) +

      "<br><br>" +

      "Actividad: " +
      escaparHTML(
        actividadSeleccionada.actividad
      ),

      "exito"

    );


    prepararSiguienteEscaneo();

    return;

  }


  /*
   * DUPLICADO
   */

  if (
    respuesta.duplicado === true ||
    estado === "DUPLICADO"
  ) {

    const nombre =
      respuesta.nombre ||

      (
        respuesta.jugador &&
        respuesta.jugador.nombre
      ) ||

      "";


    mostrarResultado(

      "🟡" +

      "<div class='jugador'>" +
      "DUPLICADO" +
      "</div>" +

      (
        nombre
          ? "<strong>" +
            escaparHTML(nombre) +
            "</strong><br><br>"
          : ""
      ) +

      escaparHTML(

        respuesta.mensaje ||
        "Este jugador ya tiene registrada la asistencia para esta actividad."

      ),

      "duplicado"

    );


    /*
     * CONTINUAMOS AUTOMÁTICAMENTE.
     */

    prepararSiguienteEscaneo();

    return;

  }


  /*
   * JUGADOR NO ENCONTRADO
   */

  if (
    estado === "NO_ENCONTRADO"
  ) {

    mostrarResultado(

      "🔴" +

      "<div class='jugador'>" +
      "JUGADOR NO ENCONTRADO" +
      "</div>" +

      "<strong>Documento:</strong> " +
      escaparHTML(documento) +

      "<br><br>" +

      escaparHTML(

        respuesta.mensaje ||
        "No existe un jugador con este documento."

      ),

      "error"

    );


    /*
     * CONTINUAMOS AUTOMÁTICAMENTE.
     */

    prepararSiguienteEscaneo();

    return;

  }


  /*
   * ERROR DESCONOCIDO
   */

  mostrarResultado(

    "❌" +

    "<div class='jugador'>" +
    "ERROR EN EL REGISTRO" +
    "</div>" +

    escaparHTML(

      respuesta.mensaje ||
      "El sistema devolvió una respuesta inesperada."

    ) +

    "<br><br>" +

    "Por seguridad, el lector fue detenido.",

    "error"

  );


  detenerLector();

}


/* =========================================================
   PREPARAR SIGUIENTE ESCANEO
========================================================= */

function prepararSiguienteEscaneo() {

  if (!lectorActivo) {
    return;
  }


  document.getElementById("estadoLector").innerHTML =
    "🟢 REGISTRO PROCESADO — PREPARE SIGUIENTE CARNET";


  setTimeout(function() {

    if (!lectorActivo) {
      return;
    }


    carnetBloqueado = false;


    mostrarResultado(
      "",
      "oculto"
    );


    document.getElementById("estadoLector").innerHTML =
      "🟢 LECTOR ACTIVO — ESCANEE SIGUIENTE CARNET";


    console.log(
      "LECTOR DESBLOQUEADO — LISTO PARA SIGUIENTE CARNET"
    );

  }, TIEMPO_ENTRE_ESCANEOS);

}


/* =========================================================
   CAMBIAR ACTIVIDAD
========================================================= */

function cambiarActividad() {

  actividadSeleccionada = null;

  carnetBloqueado = false;

  procesandoActividad = false;


  document.getElementById(
    "actividadSeleccionada"
  ).classList.add("oculto");


  document.getElementById(
    "btnCambiar"
  ).classList.add("oculto");


  mostrarResultado(

    "🔄" +
    "<div class='jugador'>" +
    "ACTIVIDAD CAMBIADA" +
    "</div>" +

    "Escanee ahora el QR GENERAL " +
    "de la nueva actividad.",

    "diagnostico"

  );


  if (lectorActivo) {

    document.getElementById("estadoLector").innerHTML =
      "🟢 LECTOR ACTIVO — ESCANEE QR GENERAL";

  }


  console.log(
    "ACTIVIDAD LIMPIADA — LISTO PARA NUEVO QR GENERAL"
  );

}


/* =========================================================
   ERROR DE ACTIVIDAD
========================================================= */

function mostrarErrorActividad() {

  mostrarResultado(

    "❌" +
    "<div class='jugador'>" +
    "NO SE RECIBIÓ CONFIRMACIÓN" +
    "</div>" +

    "El servidor no devolvió una respuesta válida.",

    "error"

  );


  document.getElementById("estadoLector").innerHTML =
    "🟡 ESCANEE NUEVAMENTE EL QR GENERAL";


  carnetBloqueado = false;

  procesandoActividad = false;

}


/* =========================================================
   ERROR DE RESPUESTA
========================================================= */

function mostrarErrorRespuesta() {

  mostrarResultado(

    "❌" +
    "<div class='jugador'>" +
    "NO SE RECIBIÓ CONFIRMACIÓN" +
    "</div>" +

    "El servidor no devolvió una respuesta válida." +

    "<br><br>" +

    "Por seguridad, el lector fue detenido.",

    "error"

  );


  detenerLector();

}


/* =========================================================
   LIMPIAR JSONP
========================================================= */

function limpiarJSONP(
  callback,
  script
) {

  try {

    if (
      script &&
      script._bufalosTimeout
    ) {

      clearTimeout(
        script._bufalosTimeout
      );

    }

  } catch(error) {}


  try {

    if (
      script &&
      script.parentNode
    ) {

      script.parentNode.removeChild(
        script
      );

    }

  } catch(error) {}


  try {

    delete window[callback];

  } catch(error) {

    window[callback] =
      undefined;

  }

}


/* =========================================================
   MOSTRAR RESULTADO
========================================================= */

function mostrarResultado(
  contenido,
  tipo
) {

  const elemento =
    document.getElementById(
      "resultado"
    );


  elemento.className =
    "resultado " +
    tipo;


  elemento.innerHTML =
    contenido;


  if (tipo === "oculto") {

    elemento.classList.add(
      "oculto"
    );

  } else {

    elemento.classList.remove(
      "oculto"
    );

  }

}


/* =========================================================
   HTML SEGURO
========================================================= */

function escaparHTML(texto) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    String(texto || "");


  return div.innerHTML;

}

</script>
